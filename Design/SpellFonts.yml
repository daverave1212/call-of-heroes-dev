
Fire:

  ~Fire Burst~:
    A: 1 Action
    Range: 5 meters
    Degree: Minor
    Tags: [Damage, Critical Strike]
    Effect: |
        Deal 1d10 Fire Damage to a Unit.
        If it had already taken Fire Damage this Combat, its hit by another 1d10 Fire Damage.
        
        {CriticalStrike} for each 10 rolled, apply a ~Combo~.

  ~Burning Breath~:
      A: 0 Actions
      Cooldown: Once / Turn
      Range: Near you
      Cost: 1 Mana
      Degree: Lesser
      Tags: [Mass Damage, Combo]
      Effect: |
          All Units 3x3 meter area take 1d6 Fire Damage.
      Combo: If any affected Unit has a Combo, +50% total Damage (to all Units) and does not trigger the Cooldown.
      Tag: AoE (Half)
  
  ~Searing Arrows~:
    A: 1 Action
    Cost: 1 Mana
    Range: 10 meters
    Requirement: Level 2
    Degree: Major
    Tags: [Damage, Flexible]
    Effect: Shoot 3 rays of fire (at one or more Units). Each does 1d10 Fire Damage.
    Notes: You can roll them one by one, after they deal the Damage.
    Tag: Damage (1)
  
  ~Cinder Storm~:
      A: Half-Action
      Range: Exactly 2 meters
      Cost: 2 Mana
      Cooldown: Once / Turn
      Requirement: Level 4
      Tags: [Mass Damage, Area Status Effect]
      Effect: |
        Each Unit in a 5x5 meter area centered on you takes 2d4 Fire Damage. Units exactly on the outer edge of the area are also Dazed or Blinded (your choice).
  
  ~Scorching Heat~:
    A: Half-Action
    Cost: 2 Mana
    Range: 3 meters
    Requirement: Level 5
    Effect: |
      A Unit you can see takes 3d4 Fire Damage, then becomes Frail.

  ~Fire Ball~:
      A: 3 Action Points
      Cost: 3 Mana
      Range: 6 meters (to the edge)
      Requirement: Level 6
      Degree: Grand
      Tags: [Mass Damage]
      Effect: |
          All Units in 6x6x6 meter area take 6d8 Fire Damage.
      Notes: Cover is calculated from the center of the area.

  ~Blazetrail~:
      A: 0 Actions
      Requirement: Level 7
      Duration: 1 minute
      Cost: 1 Mana
      Degree: Minor
      Tags: [Buff]
      Effect: |
          A Unit you can see gains propulsion by fire. It gains +3 Movement Speed and whenever it comes near a Unit, that Unit takes 1d4 Fire Damage.
      Upgrade: The Damage also happens the moment you cast this Spell, around the target Unit.
      Notes: |
        The Damage can only happen once per Turn per Unit. The Damage source is you (for amplification effects).

  ~Ignition~:
      A: 1 Action
      Cost: 1 Mana
      Degree: Major
      Duration: 1 minute
      Requirement: Level 8
      Tags: [Damage Over Time]
      Effect: |
          Ignite a Unit you can see. At the end of each of your Turns, it takes 8 Fire Damage.
          Its ignition ends if the Unit is Damaged by Cold, Shock or Acid or is splashed with water.

  ~Cauterize~:
    A: Half-Action
    Cost: 2 Mana
    Requirement: Level 9
    Effect: |
      Choose a Unit you can see. Deal 3d6 Fire Damage to it.
      At the start of its Turn, Heal it for 5d6.
    Combo: You can repeat this next Turn, without spending the Mana.

  ~Meteor~:
    A: 2 Action Points
    Cost: 5 Mana
    Range: 10 meters (to edge)
    Duration: 1 minute
    Requirement: Level 10
    Effect: |
      Conjure a 5x5x5 meter _meteor_ that falls from the sky onto an area, dealing 10d4 Fire Damage on impact.
      At the start of your next Turns, the _meteor_ keeps rolling away from you up to 3 meters and dealing 5d4 Fire Damage to Units hit again.
      The zone underneath the meteor is Hard Terrain.
  
  ~Armaggeddon~:
    A: 3 Action Points
    Cost: 9 Mana
    Requirement: Level 11
    Effect: |
      Rain death of fire upon the entire battlefield. ALL Units on the battlefield take 21d6 Fire Damage.

Lightning:

    ~Lightning Chord~:
        A: Half-Action
        Range: 5 meters
        Duration: 1 minute
        Cooldown: Once / Turn
        Degree: Minor
        Tags: [Damage Over Time]
        Effect: |
            Create a lightning chord between you an a Unit.
            At the end of your every turn, deal 1d6 Shock Damage to it.

            {CriticalStrike} if you roll 6, apply a ~Combo~.
        Upgrade: The chord is broken if you end your Turn more than 5 meters away from it.
        Notes: |
          A Unit can only be affected by one Lightning Chord at a time.
          You can have multiple Units chorded at a time.
        Tag: RoI

    ~Charge Ward~:
      A: 0 Actions
      Cost: 1 Mana
      Tags: [Protection]
      Effect: |
        An Ally you can see (or you) becomes surrounded in an electric aura.
        They gain 1d6 Shielding. When it breaks, deal that much Shock Damage to all Units within 1 meter of the Ally.


    ~Conduit Flow~:
        A: 1 Action
        Cost: 1 Mana
        Range: 5 meters to first target
        Requirement: Level 2
        Degree: Major
        Tags: [Mass Damage, Mass Healing]
        Effect: |
            Choose a Worthy Unit other than you. If Enemy, it takes 1d10 Shock Damage. Otherwise, Heal it for 1d8.
            If there is another Unit within 2 meters of it, repeat Conduit Flow on the new Unit (you choose if multiple).
        Notes: Each Unit can be affected by Conduit Flow only once per cast. Cover is calculated from Unit to Unit (as if the conduit is jumping from Unit to Unit). The conduit can be repeated on you as long as you're not the first target.

    ~Electric Enchantment~:
        A: Half-Action
        Cost: 1 Mana
        Range: 3 meters
        Duration: One Combat
        Requirement: Level 3
        Degree: Minor
        Tags: [Buff]
        Effect: |
            Choose a metallic weapon to imbue it with electricity.
            Whenever it attacks, also deal 1d6 Shock Damage to a different Unit within 3 meters of it.
        Upgrade: Lasts until the end of the next (or current) combat, or the end of the Adventure.
        Notes: Does not stack with other weapon enchantments from Spells. If targeting an Ally's weapon, this does count towards Wizard's Electromancy.

    ~Volt Guard~:    
        A: Reaction
        Range: 5 meters
        Cost: 1 Mana
        Requirement: Level 4
        Tags: [Protection]
        HasMixins: true
        Effect: |
          Use when a Unit would take Damage (after roll). Negate 50% of the incoming Damage and return it back to the source as Shock Damage.
          Apply a ~Combo~ to either of them.
        Upgrade: The returned Damage is a quick lightning that bends around obstacles, ignoring Cover or Line of Sight.
        Tag: Protection

    ~Chain Thunder~:
        A: 1 Action
        Range: 5 meters
        Requirement: Level 5
        Degree: Grand
        Tags: [Mass Damage]
        Effect: |
          Strike an Enemy with Lightning for 2d10 Shock Damage.
          The lightning extends and strikes the closest _new_ Unit within 3 meters, dealing half of the previous damage.
          This keeps on extending and striking new Units until it deals 0 Damage or there are no more Units to strike.
        Notes: |
          This lightning can't strike the same Unit twice per cast (so it only hits _new_ Units that it hasn't hit).
          If there's a tie for the closest Unit, you choose which Unit it hits.

    ~Elating Jolt~:
        A: 0 Actions
        Requirement: Level 6
        Cost: 1 Mana
        Cooldown: Once / Turn
        Tags: [Support]
        Effect: |
            Choose a Unit you can see.
            If your last cast Spell was shock-themed (e.g. from the Lightning Font), they regain 1 Mana and get a Shielding that can block 1d8 Damage.
            Otherwise it takes 1d6 Shock Damage and is Deafened.

Frost:

    ~Ice Shard~:
      A: Half-Action
      Range: 10 meters
      Tags: [Damage, Combo]
      HasMixins: true
      Effect: |
        Throw an icicle at Unit, dealing Cold Damage equal to 1d4 + its Setback (or Initiative).
        Deals +50% Damage if the target is under any Status Effect.
  
    ~Rime Shackles~:
        A: Half-Action
        Range: 5 meters
        Cost: 1 Mana
        HasMixins: true
        Degree: Major
        Tags: [Damage, Status Effect, Combo]
        Effect: |
            Deal Cold Damage to a Unit equal to 1d6 + ^Its {Dexterity}^.
            Slow it and apply a ~Combo~ to it.
        Combo: Double-Slow it instead!
        Tag: Status Effect

    ~Snowstorm~:
      A: Half-Action
      Cooldown: Once / Turn
      Requirement: Level 2
      Range: 5 meters to edge
      Tags: [Control, Mass Status Effect]
      Effect: |
        Choose a 4x4 meter area and a direction.
        Each Enemy caught already effected by any Status Effect takes 1d4 Cold Damage.
        Then each Unit is ~Cold-~Slammed 1d6 meters in that direction.
      Upgrade: ~Cold-~Slam impact Damage is Cold.

    ~Frostfall~:
        A: Half-Action
        Cost: 2 Mana
        Range: 10 meters
        Degree: Major
        Requirement: Level 3
        Tags: [Mass Damage, Status Effect (Hard), Flexible]
        Effect: |
            Choose a Unit. It takes 1d10 Cold Damage, and each Unit within 2 meters of it takes Cold Damage equal to 200% of the rolled amount.
            If there were no Units within 2 meters of it, the target is Double-Stunned instead.
        Upgrade: When Stunning a flying target, it remains stuck in the air (levitating) for up to 6 seconds.

    ~Hypothermia~:
      A: 2 Action Points
      Cost: 1 Mana
      Range: 5 meters
      Requirement: Level 2
      Effect: |
        Deal 1d10 Cold Damage to a Unit. Deal +1d10 for each Status Effect it was affected with this Combat.
      Notes: While you have this Ability, keep track of what Status Effects you affected certain Units with.

    ~Deep Freeze~:
      A: 3 Action Points
      Tags: [Situational, Damage, Status Effect]
      Requirement: Level 5
      Effect: |
        A Unit takes 4d6 Cold Damage and is Single-Stunned.
      Downside: Only usable on Units that have taken Cold Damage this Combat.
    
    ~Creeping Cold~:
      A: 1 Action
      Cost: 1 Mana
      Cooldown: Once / Turn
      Range: 1 meter to line start
      Requirement: Level 6
      Effect: |
        Shoot a 3x6 gale line of frost. All Units caught gain +1 Setback (or +0.5 Initiative), then take Cold Damage equal to their Setback (or Initiative).

    ~Armor of Hrim~:
      A: Half-Action
      Cost: 2 Mana
      Duration: 1 minute
      Requirement: Level 7 and only works in Worthy Combat
      Effect: |
        A Unit you can see gains a _hrim_ armor that keeps growing.
        Now and at the end of its Turns, it gains 1 Shielding that can block 1d4 Damage.
        At the start of any other Unit's (or Unit group's) Turn, increase any still existing _hrim_ Shieldings' values on it by 1d4.
      Notes: For example, if you cast Armor of Hrim on a Unit, it gains 1d4 Shielding. Then, if another ally starts their Turn, increase that _hrim_ Shielding by 1d4. Note that you increase the Shielding's ^value^, not just add another Shielding!

    ~Iceberg Drop~:
        A: 3 Action Points
        Cost: 3 Mana
        Range: 6 meters (to the edge)
        Degree: Grand
        Requirement: Level 8
        Tags: [Control, Mass Damage]
        Effect: |
            Choose a 6x6x6 meter area.
            Conjure a giant iceberg in the sky that you drop upon the area.
            All Units hit are pushed to the closest available edge of the area and take 6d6 Cold or Smash Damage.
            The iceberg remains in the area until it melts.

    # ~Glacial Step~:
    #   A: Passive
    #   Requirement: Level 9
    #   Effect: |
    #     Whenever you cast a Frost Spell, create ice under the Unit or area affected, which acts as Hard Terrain.
        
    #     You can spend 1 Action Point to touch an icy area and teleport to another one you can see within 5 meters.

    ~Crystalize~:
      A: Reaction
      Cost: 2 Mana
      Cooldown: Once / Combat
      Tags: [Protection]
      Requirement: Level 9
      Effect: |
        Use when a Unit would take Damage.
        Give it 2 Shieldings that can block 1d20 Damage each, and Double-Stun it.

    ~Absolute Zero~:
      A: Reaction
      Cost: 3 Mana
      Requirement: Level 10
      Effect: |
        Use when a Unit starts its Turn. It takes 4d4 Cold Damage and is _1d6_-Stunned.
      Notes: Single-Stun it 1d6 times.

    ~Whiteout~:
      A: Half-Action
      Cost: 7 Mana
      Cooldown: Once / Combat
      Requirement: Level 11
      Effect: |
        Conjure a fog of tiny ice specks in a 1x1x1 kilometer area, which keeps getting colder.
        At the start of ^each^ Turn, all Units in the area take 1 Damage and that Unit becomes Slowed.
        You can spend a Half-Action at the start of each of your Turns to maintain the effect.

Arcane:

  ~Magic Arrows~:
      A: Half-Action
      Range: 5 meters
      HasMixins: true
      Cooldown: Twice / Turn
      Degree: Minor
      Tags: [Damage, Mass Damage, Combo]
      Effect: |
          Shoot 2 arcane arrows. Each does 1d4 Pulse Damage.
      Combo: 1 more arcane arrow shoots from the target into any target within 5 meters of it.
      Notes: |
          When you cast this, decide the targets before rolling the dice. Roll the dice for each target at a time.

  ~North Star~:
      A: 3 Action Points
      Range: 15 meters
      Cost: 2 Mana
      Degree: Major
      Tags: [Situational, Damage, Combo]
      Effect: |
          You conjure a magical star that always shoots North and deals 9d4 Pulse Damage to the first Unit hit.
      Combo: The star explodes, dealing 50% of the total Damage to all other Units within 2 meters of the hit target.
      Notes: |
          You can only shoot the star towards North - without an angle.
          Ask the DM which way North is (if your Hero knows that).

  ~Magic Ward~:
    A: Half-Action
    Cooldown: Once / 2 Turns
    Duration: Until end of Combat
    Requirement: Level 2, only usable in Worthy Combat
    Tags: [Protection]
    Effect: |
      Give an ally you can see one Shielding that can block 1d6 Damage.

  ~Longblade~:
      A: 0 Actions
      Cooldown: 1 real hour
      Duration: 1 minute
      Requirement: Level 3
      Tags: [Buff]
      Effect: |
          Magically extend the weapon of a willing ally you can see (or yourself) to up to 3 meters.
          Its Attacks with that weapon can have up to 3 meters range.

  ~Magic Arrow Barrage~:
      A: 1 Action
      Cost: 1 Mana
      Range: 10 meters to edge
      Cooldown: Once / Combat
      Requirement: Level 4
      Tags: [Mass Damage]
      Degree: Major
      Effect: |
          Conjure floating arrows in a 3x3 area, up to 10 meters above ground.
          At any point (for 0 Actions or with a Reaction), you can release these arrows downward. All Enemies hit take 3d4 Pierce Damage.
      Upgrade: At the start of your every Turn, if the barrage is not yet released, it increases by 1 meter in size in all directions and gains 1d4 Damage when it will be released (up to +3d4 and 9x9).
      Notes: |
          E.g. every turn, it goes from 3x3 to 5x5, then 7x7, then 9x9, etc and deals from 2d6 Damage to 2d6 + 1d4, then 2d6 + 2d4, etc.
          The arrows disappear as soon as they hit ground, or when dismissed (all at once) for free at any point, or after 1 minute of staying in the air.

  ~Arcane Prison~:
    A: 1 Action
    Cost: 1 Mana
    Requirement: Level 5
    Cooldown: Once / Combat
    Tags: [Status Effect]
    Effect: |
      Each Unit within 2 meters of you takes 2d4 Pulse Damage and becomes Dazed and Slowed.

  ~Ray of Annihilation~:
    A: 3 Action Points
    Cost: 4 Mana
    Range: 5 meters
    Requirement: Level 6
    Tags: [Damage]
    Effect: |
      Shoot a massive beam of pure arcane energy onto a Unit, dealing 11d6 Pulse Damage.

  ~Afterflash~:
    A: Half-Action
    Cost: 2 Mana
    Requirement: Level 7
    Tags: [Control, Damage]
    Effect: |
      Choose a Unit. It takes 4d4 Shock Damage and teleport it up to 6 meters away.
  
  ~Mirror Clone~:
    A: 1 Action
    Cost: 2 Mana
    Duration: 1 hour
    Requirement: Level 8
    Tags: [Other]
    Effect: |
      Summon a magical clone of an Allied Hero, with its current Health, Mana, Cooldowns, etc at this time.
      You control it, it takes Turns like the Hero, but takes 500% Damage, deals only 10% Damage (at lest 1 per instance), and can't inflict Status Effects.
    Notes: The clone counts as a Hero, and respects all Hero rules (e.g. monster Setback).