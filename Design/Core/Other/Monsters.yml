Skinwalker:
  Set:          core
  Type:         Person, Beast, Fiend
  Degree:       Normal
  Experience:   175
  Stats:        2/2/0/2/2
  Health:       43
  HPCoef:       0.95
  Speed:        6
  Initiative:   5
  Abilities:
    - Claw:
        A: Half-Action
        Damage: 1d8
        Inflict Fear: If rolled 8, the target chooses to either be Clawed again or get a Phobia Negative Quirk.
    - Bite:
        Effect: 1d8 + 1d10
        Requirement: Only usable when Blood Rushed
        Blood Fever: The target becomes Silenced (it can't use Abilities).
  Passives:
    - Blood Rush: |
        As soon as the Skinwalker drops to/below 50% HP, it can make a free Move Act and a free Bite (even during other Units' turns).
        Then, the other Unit can continue its Turn.
    - Shapeshift & Mimickry: |
        While at least 10 meters away from an observer, the Skinwalker can shapeshift into any animal or person they have seen, and can mimick any voice or sound.
        The closer you get to a Skinwalker, the more apparent it seems that the transformation is disfigured and uncanny.
  Avoids AoE: No
  Behavior: |
    When dropping to 50% HP, they can run towards the back line of the party and bite them!
    If healthy, Gnolls employ tactics like kiting, flanking, etc.
    If below 50% HP, Gnolls go wild!
  Pair: Pair with Hyenas (reskinned Wolves).
  Lore: None
  Suggested Obstacles:
    - Hunting Traps
    - Spike Pits
    - Net Traps
    - Spiked Fence (Spiked Barricades)
  Monster Data: No tactic, mid HP, no gimmick
  Role: Main Enemy