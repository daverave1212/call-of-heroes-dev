

Race: Hollow
Description: |
  My dear Henrick,
  A most unsettling visitor arrived at my door last night. The man claimed he needed shelter from the cold, yet the moment I opened the door I understood his fear was not of the weather but of himself. His skin hung loose and gray in some places, stretched taut and translucent in others. His reed eyes were sunken yet fever-bright, darting in frantic circles even while the rest of him moved with a slow, deliberate caution. The faint smell of blood clung to him, but it was wrong… metallic, yes, but with a bitter, spoiled undertone I could not place.
  He collapsed on my threshold, and when I helped him rise, he recoiled from my touch with a hiss not quite human. For a moment, his jaw shifted, stretching in a way no bone should, teeth lengthening before snapping back into place. His voice trembled between tones, sometimes hollow and airy, sometimes wet and guttural. He spoke of a hunger he dared not name, and of a “curse” that gnawed at him from within. I have seen vampires, lycanthropes, revenants, and plague-bearers, but never all their symptoms woven together in one trembling frame.
  My friend… I believe he is one of the Hollowed. one of those unfortunate souls whose bodies have become host to curses that warp them beyond simple classification. A perfect, living specimen at last. I have sealed him in the cellar for now, where the stone is thick and the locks are strong; still, as I write this, I can hear him pacing beneath the floorboards, muttering in languages I do not know, scratching at the walls when he thinks I am asleep. I am eager to begin my treatment. And yet… I confess to you, my old friend, that for the first time in many years, I am very, very afraid.

ImageStyle:
  top: -5%
  width: 135%

Other: |
  Choose which race you were prior to your death.
  This is only for aesthetics and storytelling purposes.

Creation:
    Stat Restrictions: |
        Your Stat numbers are -2, -1, 0, 1, 2 instead of -1, 0, 1, 2, 3.
Custom Stat Array: [-2, -1, 0, 1, 2]

Stats:
  Base Health: 11
  Health Regen: 2
  Movement: 5 meters
  Lifespan: 1 to 20 years as a Hollow
  Size: the size of your past life race


Language: You speak Languages exactly how it says in the Race you were before death (see that Race's Languages box).
Languages: []
Hollow Languages: true

Ideas:
    - Cannibalize

Starting Abilities:

  ~Burden of Passing~:
    A: Passive
    Effect: |
      Your starting Stats are -2, -1, 0, 1, 1.
      Your are always 1 Level higher than what you're supposed to be.
    Upgrade: With your extra Level, you do gain Level Up bonuses for it, as normal.
    Notes: e.g. if playing with Experience, even if you have gained enough Experience to be Level 3, you are Level 4, but still require Experience for Level 3 to 4 to Level up - and so on. If playing with milestone Levels, you are simply always always 1 Level higher than what you're supposed to be. Maximum Level is 10.

  ~Burning By Silver~:
    A: Passive
    Effect: |
      You are a cursed individual. Your race can be any of the available ones for cosmetic purposes, but your curse makes your race's abilities inert, and only have what the Hollow race provides.
      You take +50% Damage when hit by silver weapons.

Starting Abilities Description:
    - Hollow: |
        A Hollow is an individual, of any previous race, who has been affected by a powerful curse or disease to the point where their old self, both flesh and mind, is no longer recognizable.
        Be it vampirism, undeath, lycanthropy, or even being affected by a spirit curse, most Hollows seek a cure for their ailment, though some relish their afflictions, and are greatful not for the lack of humanity, but for the immortality granted by their curse.
    - Silver Weakness: |
        The life (or death) of a Hollow is a difficult one. As a Hollow, you are particularily vulnerable to silver, and often to other superstitions.
        Your Quest Master may add extra superstitions you could be sensitive to, such as copper wind chimes, saffron ash or black salt circles.

Talents:

    ~Vampirism~:
      A: Special
      Effect: |
        Your Health Regen is 0 and can not be increased by any other means, but you gain the Drain Blood Ability.
        You start with 0 {Blood}Blood Points. You can spend them to acquire Vampirism Features.
      Upgrade: |
        You can't use any Abilities while in sunlight or in someone's home if you were not invited, or within 1 meter of garlic, running water or holy symbols.
        Your body does not age, but your mind does.

      Notes: "You have been touched by the ancient crimson thirst that feeds life through death. Your emotions sharpen unnaturally: love, rage, envy, despair. Your body no longer breathes, yet your heart beats faintly with stolen blood."
      Subspells:
        ~Drain Blood~:
          A: Half-Action
          Cooldown: Once / Turn
          IsSubspell: true
          Range: 2 meters
          Requirement: Only usable in Worthy Combat
          Effect: |
            Deal 1d6 Slash, Pierce or Scourge Damage to a Unit. Heal for the amount Damaged. Generate 1 {Blood}{Color('red' 'Blood Point')}.
          Upgrade: Does not work on Units without blood.
      SpellTable:
        - Name: Dark Vision {Blood}5
          Effect: You can see clearly in the dark.
        - Name: Sanguine Pact {Blood}5
          Effect: Whenever you defeat a Worthy Enemy, gain 2 Blood Points.
        - Name: Overcoming Light {Blood}5
          Effect: You are no longer affected by sunlight.
        - Name: Improved Drain Blood {Blood}10
          Effect: Increases Drain Blood Damage to 1d8.
        - Name: Vampire Immunity {Blood}15
          Effect: You are immune to being Crippled and to mind control effects.
        - Name: Quick Drain Blood {Blood}20
          Effect: Drain Blood can be used Twice / Turn.
        - Name: Power Channel {Blood}30
          Effect: At the end of every Adventure, increase your current Blood Points by 10%.
        - Name: Bat Form {Blood}35 {Action}0 Action Points {Cooldown} Once / real hour
          Effect: Transform into a bat for up to 1 minute. You can fly up to your normal Movement Speed.
        - Name: Misting {Blood}35 {Action}0 Action Points {Cooldown} Once / real hour
          Effect: Briefly transform into a mist and quickly move up to 6 meters away.
        - Name: Charm {Blood}50 {Action}0 Action Points {Cooldown} Once / real hour
          Effect: A Person you're talking to must roll a Sense Roll at least equal to your Charisma Roll. If it fails, you can control it on its next Turn.
        - Name: Flight {Blood}100
          Effect: You can fly at your normal Movement Speed
        - Name: Vampire Lord {Blood}100
          Effect: You get +1 in all Stats.
    
    ~Lycanthropy~:
      A: Special
      Effect: |
        At the start of each Combat between 18:00 and 06:00 (night), you must make a Sense Roll at least 8 or transform into a lycanthrope for 1 minute.
      Upgrade: On certain nights, out of Combat, you may transform regardless, for 1 minute or longer. Upon returning to your normal self, you might be disoriented or have trouble remembering what happened.
      Notes: The moon is no longer a comfort to you, but a summon. Beneath its light, your bones ache and your breath grows hot with something feral. Rage gnaws at the edge of your thoughts and your senses sharpen to the point of pain.
      Subspells:
        ~Werebeast~:
          A: Passive
          IsSubspell: true
          Effect: |
            You have +1 Movement Speed and +2 to non-Combat Sense and Dexterity Rolls.
            Whenever ^you^ defeat a Worthy Enemy, heal an ally you can see (or yourself) for 10% of their Max Health.
            At the start of your Turn, make a free melee attack on a Unit near you for 1d6 + Might Damage. If you don't, you take the Damage instead.


    ~Death Forsaken~:
      A: Passive
      Skill Bonuses:
        Survival: 1
      Extras:
        - You can hold your breath for 1 hour
      Effect: |
        You have a Shielding that can block up to 1d4 Damage. It replenishes at the start of each in-game day.

        You are considered Undead. You can hold your breath for up to 1 hour. You don't need to eat food, but you do need water and sleep.
        You have +1 in Survival.
      Downside: +50% Fire Damage taken.
      Notes: |
        You walk between the living and the dead, a soul stitched back into flesh for reasons unknown. Perhaps you were a warrior, a scholar, or a thief when death claimed you... or perhaps even you cannot even remember who you once were, you poor, weak soul...
    
    ~Curse of Gray Flesh~:
      A: Passive
      Bonuses:
        Movement Speed: -1
        Initiative: -1
        Might: 1
        Max Health: 2
      Combat Extras:
        - Immune to Blind
      Skill Bonuses:
        Control Emotions: 1
      Effect: |
        You have -1 Movement Speed and -1 Initiative, but +1 Might and +2 Max Health.
        You are immune to being Blinded.
        You have +1 in Control Emotions.
      Notes: |
        You are afflicted by a curse of petrification, a gray, stone-like hardening that creeps over your flesh like slow-rolling mist. Perhaps it came from the gaze of a basilisk, the spite of a powerful curse, or a hereditary disease that has haunted your family for generations. The curse spreads on your body. Who knows how long you have until you can no longer move...

    ~Stolen Soul~:
      A: 0 Actions
      Cooldown: Once / real hour
      Skill Bonuses:
        Empathy: 2
        Memory: -1
      Combat Extras:
        - Immune to Silence
      Effect: |
        You know the locations of any living Units within 15 meters that are not obstructed by thick materials. One of them of your choice gets a Combo.

        Passively, you are immune to being Silenced.
        You have +2 in Empathy but -1 in Memory.
      Notes: You are a husk. Your soul lies someplace else, but it's tethered to your body by a fragile, almost invisible thread. Sensations reach you only as echoes, distant and muted, and the spark of creativity or clarity has dimmed. The voice in your mind is faint, your thoughts feel hollow, and the vision that once guided you seems blurred or absent. Perhaps you know where your soul lingers, or perhaps it is lost beyond reach...

    ~Wendigo~:
      A: 0 Actions
      Cooldown: Once / Adventure
      Skill Bonuses:
        Nature: 1
        Tracking: 1
        Control Emotions: -1
      Effect: |
        Force a Unit that is not looking at you to run away from you, freely, at it Movement Speed. It gets a Combo.

        Passively, you have +1 in Nature and +1 in Tracking, but -1 in Control Emotions.
      Notes: You have become a monster, your body gaunt and bony, skin stretched tight over hunger-wracked bones. This transformation is the mark of deeds too cruel or desperate to forget, a reminder of the inhuman acts that bound you to this cursed form. Perhaps you seek redemption for what you have done, or perhaps you wander, powerless to resist your cravings for raw flesh.

    ~Touched by the Abyss~:
      A: Half-Action
      Cooldown: Once / Adventure
      Skill Bonuses:
        Swimming: 2
      Requirement: Requires being in a natural water source
      Effect: |
        Heal for 1d8.

        You have +2 in Swimming.
      Notes: The deep has claimed you. And your flesh no longer belongs to the world of men. Scales ripple across your body like the black tides of forgotten trenches, and writhing tentacles curl on your wretched body. The abyss is constant. Seductive. _Maddening_, tugging you toward horrors that twist both body and soul in ways no mortal was meant to endure.

    ~From a Different World~:
      A: Passive
      Skill Bonuses:
        Luck: 1
        Understanding People: -2
      Effect: |
        You have access to Level 1 and Utility Sorcerer Talents (you don't get the regular bonuses of the Unstable Spark die, but you can choose your Magical Archetype).
        You have +1 in Luck, but -2 in Understanding People.
      Notes: You came from somewhere else, a place close enough to feel but too far to name. The air here tastes almost the same, the stars are nearly right, yet everything is slightly… off. Memories of it are fragments. The kingdoms were different, but you can't quite name them. People were different, but you're not sure how. How did you get here? Is there a way back? ^Should^ you go back?

    # Fillters
    ~Blood Disease~:
      A: Passive
      Bonuses:
        Health Regen: 1
      Effect: |
        Whenever you heal with your Health Regen, flip a coin. On heads, you heal for +50%. On tails, you heal for -50%.
        You have +1 Health Regen.
        You are immune to minor diseases.
      Downside: Potions and elixirs do not work on you.
      Notes: Your blood flows with an unnatural vitality, coursing more efficiently than it should and bolstering your immune system in ways ordinary medicine cannot. But it aches and twists in ways you do not fully understand, and the price it demands is as hidden as it is inevitable.

    ~Gazed the Old One~:
      A: Passive
      Skill Bonuses:
        General Knowledge: 1
      Effect: |
        You have access to Level 1 Minor and Utility Warlock Talents (ignoring the Evoke effects).
        You have bonus Initiative equal to the opposite of your Sense.
        You have +1 in General Knowledge and the Fear of the Unknown Negative Quirk (Phobia).
      Notes: Your eyes have glimpsed what should never be seen, and something ancient now stirs within your mind. The knowledge is intoxicating, the insight uncanny, the quiet of the mind impossible. The Old One watches...

    ~Mark of the Beast~:
      A: Passive
      Bonuses:
        Sense: -1
      Skill Bonuses:
        Nature: 1
        Animal Handling: 1
        Survival: 1
      Effect: |
        On the 3rd Round of Combat only, you have ^Dice Upgraded^ to the next die type on all physical Damage.
        You have -1 Sense.
        You have +1 in Nature, Animal Handling and Survival.
      Notes: You have been marked with a visible, ever-bleeding scar. Claws sharpen, senses heighten, and a restless hunger stirs whenever you grow angry or desperate. You feel closer to the wild than to humanity, as if part of you is always prowling, always watching.

    ~Pharaoh's Curse~:
      A: Passive
      Skill Bonuses:
        Luck: -2
      Extras:
        - Everyone has -2 Luck
      Effect: |
        At the start of every Combat, a random enemy becomes afflicted with a curse of locusts, and takes 1d4 Damage at the start of your every Turn.
        Everywhere you go, you bring with you bad weather, pests, and bad luck.
        Everyone within sight or hearing distance has -2 in Luck (including you).
      Notes: The moment your fingers brushed the surface of that unearthed relic, or set foot in that forbidden tomb, the curse took root within you. ests swarm at times, crawling across your skin like locusts that no one else can see, and misfortune clings even to those who oppose you. This is the wrath and magic of someone ancient, maybe of a king long dead.

    ~Haunted Idol~:
      A: Half-Action
      Range: 5 meters
      Cooldown: Once / real hour
      Effect: |
        Activate the Vile Idol to do one of the following effects, within range.
        {Diamond} Deal 1d12 Fire, Cold or Poison Damage to a Unit.
        {Diamond} Slam a Unit 1d6 meters in any direction.
        {Diamond} Give a Unit 1d6 Shielding for 1 minute.
        {Diamond} Teleport up to 3 meters away.
        After that, flip a coin. On heads, summon a Idol Ghost for the enemy party, within 3 meters of you. The Idol Ghost will try to chase and attack you, and is not considered a Worthy Enemy.
      Notes: You discovered it in a forgotten corner, an object humming with power you can scarcely comprehend, but seemingly possessed by a strange entity. Those nearby feel it too, a chill crawling down the spine, and sometimes, you wonder if the power you wield is truly yours… or if something else pulls the strings.
      Monster:
        Name: Idol Ghost
        Speed: 4 meters
        Stats: -1/-1/-1/-1/-1
        Initiative: 0
        Health: 5
        Abilities:
          Attack:
            A: 1 Action
            Range: 2 meters
            IsSubspell: true
            Effect: Deal 1d4 Psychic Damage.
            EffectGreen: If you roll 4, the Unit gets -1 in a random non-Combat Skill.


    ~Disfigured~:
      A: Passive
      Bonuses:
        Health Regen: -1
        Max Health: 3
      Combat Extras:
        - -50% Acid Damage taken
        - Immune to Cripple
      Skill Bonuses:
        Convincing: -2
      Effect: |
        You have -1 Health Regen, but +3 Max Health.
        You take -50% Acid Damage and are immune to being Crippled.
        You have -2 in Convincing.
      Notes: Your body bears shapes that unsettle the eye, fingers that grow at odd angles, sometimes too many, a spine that curves in ways no ordinary body should, or a face that refuses symmetry. Perhaps it is a curse, a mark placed by some malicious force, or perhaps you were simply born this way, a malformed form in a world that prizes normality.

    ~Hollowing Fire~:
      A: Passive
      Effect: |
        Your first attack each Combat deals +1d4 Fire Damage to both you and the target(s).
        You can turn any Damage you deal into Fire Damage.
      Downside: You can not wear armor or clothes made of flammable material.
      Notes: Flames course through your very veins, and your cracked, blackened skin scorches to the touch. The fire inside you cannot be contained. Burning fire spews from your body, setting flammable objects ablaze. You endure the pain. You have no other choice.

    ~The Cure~:
      A: Special
      Requirement: Level 5
      Effect: |
        Some say your affliction can be cured. Perhaps it's your life purpose to find the remedy.
        If you ever succeed in achieving remission, increase your 3 lowest Stats by 1 and remove the curse you have.





