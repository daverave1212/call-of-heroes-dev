    Effect: When creating your Hero, choose 3 Elf Talents from below.

Starting Abilities Description:
    - Meditation: |
        Elves are known for their strange sleeping patterns: their slumber is short, light, and dreamless. This leaves ample time during the day (or night) for the Elves to mind their business, engage in study, or prepare for a hunt. 
        Long lives are often credited for their wise and clever individuals, though it's not clear what the lifespan of an Elf is. Some say centuries, while some claim some Elves don't reach even the lifespan of a mere human.
    - Gene Diversity: |
        Elven kingdoms span all across the lands and continents, and many of the subspecies of Elves have diverged into further branches, specializing in thriving in their environment. From the northern Aos Si Elves to the Dark Elves living underground, Elves are some of the most versatile inhabitants of Gaia.
        Choose your heritage wisely, Elf.

Talents:

    ~High Elf Ancestry~:
      A: Passive
      IsIgnored: true
      Combat Extras:
        - You have a Wizard Talent
      Effect: |
        You know have a Level 1 Wizard Talent. You can change it inbetween Adventures.
      Notes: You can pick Attention to get any Font Spell.

    ~Moon Elf Ancestry~:
      A: 0 Actions
      Cooldown: Once / Adventure
      Range: 3 meters.
      Effect: |
        Silence a non-Epic Unit.
        Learn which of its Stats are higher than yours.

    ~Purebreed~:
      A: 10 minutes
      Cost: 1 Plot Point
      Effect: Destroy a Magic Item equipment piece to permanently gain its Magic Item properties.
      Notes: E.g. you disenchant Gloves of Athletics to permanently gain Skilled in Athletics, or you disenchant Gloves of Fire Ball to permanently gain the power to cast Fire Ball with a Half-Action once per Adventure.
 
    ~Wood Elf Ancestry~:
      A: Passive
      IsIgnored: true
      Bonuses:
        "{Might}": -1
        Movement Speed: 1
      Combat Extras:
        - You can use bows and arrows with Stat Limit
      Effect: |
        You have -1 {Might}, but +1 Movement Speed.
        When using a Sword or Bow of any kind (except Sickle), you attack with your Stat Limit instead of that specific Stat.
      
    ~Dark Elf Ancestry~:
      A: Passive
      IsIgnored: true
      Combat Extras:
        - You have a Warlock Talent
      Effect: |
        You know have a Level 1 Warlock Talent (except Evocations). You can change it inbetween Adventures.
        You can generate {Evoke} Evoke Points like a Warlock.

    ~Aos Si Power~:
      A: Half-Action
      Cooldown: Once / Encounter
      Requirement: Only usable in Worthy Combat.
      Effect: |
        Gain 1 Mana. You must spend it this Turn.
      Upgrade: With fox ears, the tail of a squirrel or eyes of a cat, the Aos Si (pronounced Ees Shee) are a mythical type of elf with whimsical roots in the strange magic of the forest. The animal traits are said to resemble the personality of the Aos Si from birth, the animal features do not necessarily correspond to the parents'!

    ~Faey Heritage~:
      A: Passive
      IsIgnored: true
      Combaat Extras:
        - You have +1 Druid Talent
      Effect: |
        You know a Level 1 Druid Utility or Class Talent.
        You can change it inbetween Adventures.

    ~Thimble Kin~:
      A: Passive
      IsIgnored: true
      Bonuses:
        "{Might}": -1
        "{Dexterity}": 1
      Combat Extras:
        - You can move through Enemy spaces
        - You can climb and ride on the back of an ally and move with them on their turn 
      Effect:
        You have -1 {Might}, but +1 {Dexterity} (up to the Level Limit).
        You can move through spaces of enemy Units.
        You can climb and ride on the back of an ally and move with them on their turn (without them having a Speed penalty).
        You are Small.

    ~Snow Elf Ancestry~:
      A: Passive
      Tags: [Early Access, Utility]
      Bonuses:
        Movement Speed: -0.5
        "{Intelligence}": 1
      Combat Extras:
        - Ignore Hard Terrain
        - Can see through fog/storms
      Effect: |
        You have -0.5 Movement Speed, but +1 {Intelligence}, up to +3.

        You ignore Hard Terrain and can see normally through fog and snowstorms.

    ~Blade Mastery~:
      Tags: [Early Access, Plot Points, Other]
      A: Passive
      Extras:
        - Use bows/blades with +2
      Effect: |
        You can use all blade (sword-like) weapons and bows regardless of their requirement, and you can switch any one Stat written on it to the number ^2^.

        Whenever you make a blade or bow attack, gain 0.05 Plot Points for each Action Point spent.
      Notes: Plot Points can't be spent in fractions, but keep attacking and you will get to full Points!

    ~Seasonal Change~:
      A: Half-Action
      Cost: 1 Plot Point
      Tags: [Early Access, Flexible]
      Range: 3 meters
      Effect: |
        Apply a different effect baased on the _seasonality_ climate of the location you're in, of the 4 below. Each of them also grants you a passive Damage resistance.
        
        {Teal(Winter:)} Push a Unit 2 meters away from you and Lag it.
        {Brown(Autumn:)} Phase through to a location up to 3 meters away.
        {Green(Spring:)} Heal a Unit for 1d6 and remove a Control Effect on it.
        {Red(Summer:)} Ignite a Unit. It takes 1d6 Fire Damage at the end of each of your Turns.

        You take -50% {Teal(Cold)}/{Brown(Scourge)}/{Green(Poison)}/{Red(Fire)} Damage, based on the _seasonality_ climate.
      
      Upgrade: Not all zones have a specific type of seasonality or climate. 
