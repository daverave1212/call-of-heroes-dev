

Race: Dwarf
LayoutType: A
Description: |
  Now, ye might've heard a tale or two about dwarves. Some true, most twisted by long-tongued humans who've never held a pickaxe in their lives. There's more to us than stone and ale... though I'll not deny we fancy both. There are the rune-carvers, aye, clever lot, some etch their runes for warding and protection, others for blasting holes in mountains... or enemies. Then there's the Irontouched, deep below the roots of the world, whose skin gleams like hammered steel and whose beards shimmer gold as morning sun on a mug of mead. I've seen one once... or so I claim when the ale's strong enough!
  Now, don't go askin' about the womenfolk's beards, mind you. Some do, some don't, and that's all ye need to know.
  Every dwarf's born with hands that itch to build. We carve homes into mountains, we forge ships stout enough to kiss the sea's fury, and we raise tombs so grand the dead feel right at home. Feh, we're probably sitting right on top of a lost dwarven underground civilization ready to have its treasure looted! But if ye ever find yerself near the northern shores… best pray the wind's on yer side. The raider clans there? Wild as thunder and twice as loud. They'll drink with ye one night and raid yer village the next, and still call ye “friend” when they're done!
  Aye, we're stubborn folk, proud folk. The mountains and lands remember our names long after we've passed.

Stats:
  Base Health: 18
  Health Regen: 3
  Movement: 4 meters
  Lifespan: 250 years
  Size: Medium

Language: You speak Common, Dwarvish and a number of chosen languages equal to your {Intelligence} or {Charisma} (whichever is higher).
Languages:
- Common
- Dwarvish

Starting Abilities:
  
  ~Stouthearten~:
    A: Passive
    IsIgnored: true
    Combat Extras:
      - You wear 2 sets of armor.
    Effect: |
      You can wear an extra layer of Light or Medium armor over (or underneath) your armor. Apply all of its effects as normal.
    Notes: Unarmored is not an armor. 50% Damage reductions of the same type do not stack



Starting Abilities Description:
    - Stouthearten: |
        Dwarves are slow folk - they usually need a lot of rest to be able to do their tasks.
        However, that does not mean they are lazy; quite the contrary. Dwarves are very sturdy, hence their unique ability to be able to wear two sets of armor, in which it would normally be very difficult to move around.

Talents:


    
    ~Forgeborn~:
      A: 1 hour
      Cooldown: Once / Adventure
      HasMixins: true
      Effect: |
        Spend 1 hour at a forge while in a friendly town to craft an artisanal 2-handed weapon or an armor, that's made of metal.
        Spend {Gold}Gold equal the item's base cost + 100.
        If it's a 2-handed weapon, it deals +1 Damage. If it's an armor, its wearer has +2 Max Health.
      Upgrade: For example, you can't craft padded armor, robes, leather armor, etc.
      Notes: Smelting, forging, and crafting - must-know skills for many dwarves. It is not just a mere rumor that many of the best blacksmiths are dwarves, or have been born and raised in Forgeborn dwarf societies.

    ~Uldran Ancestry~:
      A: 12 hours
      Cooldown: Once / Adventure
      Effect: |
          You can spend 12 hours sleeping to recover 1d8 Health or get -50% Cold Damage taken until the end of next Combat.

          Also, you can choose to hibernate for 48 hours to cure all your minor diseases and poisons.
      Upgrade: Loud noises and movement still wake you up as they normally would.
      Notes: The nordic dwarves have made hibernation a core skill to surviving the harsh winters of the mountains.

    ~Shoreraider~:
      A: Passive
      Skill Bonuses:
        Boating: 1
        Swimming: 1
      Effect: |
        When defeating people, your team loots +10% {Gold}Gold and goods like gems, metals, textiles, etc.
        You have +1 in Boating and Swimming.
      Notes: Long boats, wooden homes and raiding parties are the common sight you grew up with, and you have learned much about these crafts throughout the years, for better or worse...

    ~Stonekin~:
      A: Reaction
      Cooldown: Once / Worthy Combat
      Effect: Use when you or an ally takes Damage that would make them fallen. That Damage is reduced by 100%.
      Notes: Certain subspecies of dwarves come from Stonekin clans, and are fit for roles of leadership due to their thick, almost stone-like textured skin and temper.

    ~Rúndottir~:
      A: 10 minutes
      Cooldown: Once / Adventure
      Effect: |
        Inscribe one of the Runes below onto a weapon as an _extra Rune_, without actually needing to have that Rune.
      Upgrade: The weapon will also have its regular Rune slot, aside from this _extra Rune_.
      Notes: Some dwarven communities rely on runes for protection, enchantment and utility. Many of their buildings are laid out on key coordinates representing numbers or conceprs with strong meanings, and their clothes are often woven in the shape of constelations for good fortune and increased control over magic.
      SpellTable:
        - Name: Elemental Rune
          Effect: Choose Fire, Cold or Shock. The attacker can freely change the Damage Type of the weapon to that element.
        - Name: Spirit Rune
          Effect: Change any one Stat written on it to ^{Intelligence}^, ^{Sense}^, or ^{Charisma}^.
        - Name: Lodestone
          Effect: +2 Damage if the weapon scales with no Stat
        - Name: Wind Rune
          Effect: Remove all Stat requirements for the weapon.

    ~Irontouched~:
      A: Passive
      IsIgnored: true
      Bonuses:
        {Dexterity}: -1
        Max Health: 5
      Effect: |
        You have -1 {Dexterity}, but +5 Max Health.
      Notes: |
        Your skin has a metal-like sheen to it, your beard and hair are thick like metal strings and your finger nails resemble gems the same color as your eyes. As you age, these become more and more valuable, even being made of gold and emeralds in your days of age.
        Dwarves with Irontouched ancestries have learend to be wary of strangers and bandits, many of whom will not waste the chance to kill and sell Irontouched body parts for money.

    ~Landliving~:
      A: Passive
      IsIgnored: true
      Combat Extras:
        - You have a Druid Talent
      Effect: |
        You know have a Level 1 Druid Talent. You can change it inbetween Adventures.
      Notes: From more obscure and hidden dwellings around the world, the Landliving dwarves inhabit forests, hill-houses and sometimes swamps, and have learned to live off the land. However, some of them are said to innately wield nature magic, and they may be regarded as oddly special or particularly uncanny.

