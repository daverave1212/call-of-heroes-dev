
Race: Dwarf
Description: |
  "Ah, I see the fire in yer eyes, eager to hear the tales of old," the weathered Dwarf says, beckoning you to join him by the crackling flames. "Well, settle in, lad, for I shall regale ye with the legend of our people, an ancient race that has borne witness to the unfolding of history itself."
  The Dwarves, known for their stocky frames and unyielding determination, stand as stalwart guardians of tradition and craftsmanship. Standing no taller than one and a half meters, they possess a stoutness that belies their extraordinary resilience. Their long lifespans grant them the gift of time, enabling them to witness the ebb and flow of civilizations, and accumulate wisdom that spans centuries. Though Dwarves may appear slow and in need of ample rest, their diligent nature sets them apart. Far from being idle, they channel their limited energy with unwavering focus, ensuring that every waking moment is utilized for productivity and progress. They may take frequent breaks and even hibernate during extended vacations, recharging their spirits and bodies for the challenges that lie ahead. It is in this balance of toil and respite that the Dwarves find the strength to create magnificent works of craftsmanship, shaping the very foundations of their society.
  A part of the Dwarves carve their homes deep beneath the earth, where they forge magnificent subterranean cities. However, their spirit knows no boundaries, as some Dwarves embrace the rugged northern lands by the treacherous ocean, honing their boatbuilding skills. Others find solace amidst lush forests, forming a profound connection with nature, where their craftsmanship seamlessly intertwines with the beauty of the natural world.
IsShort: true

Creation:
    Stat Restrictions: |
        Your Might must be at least 1.
        Your lowest stat must be either Dexterity or Presence.
Stat Requirements: Might >= 1 and (Dexterity == -1 or Presence == -1)

Stats:
  Base Health: 20
  Health Regen: 4
  Movement: 4 meters
  Lifespan: 250 years
  Size: Medium

Language: You speak Common, Dwarvish and a number of chosen languages equal to your Intelligence or Presence (whichever is higher).
Languages:
- Common
- Dwarvish

Starting Abilities:
  
  ~Stouthearten~:
    A: Passive
    IsIgnored: true
    Combat Extras:
      - You wear 2 sets of armor.
    Effect: |
      You can wear an extra layer of Light or Medium armor over (or underneath) your armor. Apply all of its effects as normal.
    Notes: Unarmored is not an armor. 50% Damage reductions of the same type do not stack



Starting Abilities Description:
    - Dwarf Resting: |
        Dwarves are slow folk - they usually need a lot of rest to be able to do their tasks.
        However, that does not mean they are lazy; quite the contrary. Dwarves make very good use of their limited time.
        On vacations, Dwarves ocasionally hibernate for longer periods.
        While awake, Dwarves are very sturdy; hence their increased Health, Dwarven Resilience and not having their speed reduced by Armor or Slows.
    - Dwarven Determination: |
        TODO

Talents:


    
    ~Forgeborn~:
      A: 1 hour
      Cooldown: Once / Adventure
      HasMixins: true
      Effect: |
        Spend 1 hour at a forge while in a friendly town to craft an artisanal 2-handed weapon or an armor, that's made of metal.
        Spend {Gold}Gold equal the item's base cost + 100.
        If it's a 2-handed weapon, it deals +1 Damage. If it's an armor, its wearer has +2 Max Health.
      Upgrade: Smelting, forging, and crafting - must-know skills for many dwarves. It is not just a mere rumor that many of the best blacksmiths are dwarves, or have been born and raised in Forgeborn dwarf societies.
      Notes: For example, you can't craft padded armor, robes, leather armor, etc.

    ~Uldran Ancestry~:
      A: 12 hours
      Cooldown: Once / Adventure
      Effect: |
          You can spend 12 hours sleeping to recover 1d6 Health.

          Also, you can choose to hibernate for 48 hours to cure all your minor diseases and poisons.
      Upgrade: The nordic dwarves have made hibernation a core skill to surviving the harsh winters of the mountains.
      Notes: Loud noises and movement still wake you up as they normally would.

    ~Shoreraider~:
      A: Passive
      Skill Bonuses:
        Boating: 1
        Swimming: 1
      Effect: |
        When defeating people, your team loots +10% {Gold}Gold and goods like gems, metals, textiles, etc.
        You have +1 in Boating and Swimming.
      Upgrade: Long boats, wooden homes and raiding parties are the common sight you grew up with, and you have learned much about these crafts throughout the years, for better or worse...

    ~Stonekin~:
      A: Reaction
      Cooldown: Once / Adventure
      Effect: Use when you or an ally takes Damage that would make them fallen. That Damage is reduced by 100%.
      Upgrade: Certain subspecies of dwarves come from Stonekin clans, and are fit for roles of leadership due to their thick, almost stone-like textured skin and temper.

    ~Rúndottir~:
      A: Passive
      Effect: |
        You can inscribe one extra Rune onto weapons.
        You can inscribe one Elemental, Intelligence or Presence Rune onto gloves. All Spells gain the Rune's effect when cast wearing these gloves, if possible.
        If it makes sense, you can also inscribe other more powerful Runes (Magic Items) onto gloves.
      Upgrade: Some dwarven communities rely on runes for protection, enchantment and utility. Many of their buildings are laid out on key coordinates representing numbers or conceprs with strong meanings, and their clothes are often woven in the shape of constelations for good fortune and increased control over magic.
      Notes: Only one Rune can be inscribed onto gloves.

    ~Irontouched~:
      A: Passive
      Bonuses:
        Movement Speed: -1
        Might: 1
      Effect: |
        You have -1 Movement Speed, but +1 Might.
      Upgrade: |
        Your skin has a metal-like sheen to it, your beard and hair are thick like metal strings and your finger nails resemble gems the same color as your eyes. As you age, these become more and more valuable, even being made of gold and emeralds in your days of age.
        Dwarves with Irontouched ancestries have learend to be wary of strangers and bandits, many of whom will not waste the chance to kill and sell Irontouched body parts for money.

    ~Landliving~:
      A: Passive
      Effect: You have access to Level 1 Minor and Utility Druid Talents, up to your Level, no matter what Class you are.
      Upgrade: From more obscure and hidden dwellings around the world, the Landliving dwarves inhabit forests, hill-houses and sometimes swamps, and have learned to live off the land. However, some of them are said to innately wield nature magic, and they may be regarded as oddly special or particularly uncanny.

    ~Dvergr Blood~:
      A: Passive
      Effect: TBD







