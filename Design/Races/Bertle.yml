
Race: Bertle
Description: |
  Once upon a winding road, when the moon was still learning how to shine, the Bertles began to wander. No one knows quite how they came to be. Perhaps the gods grew lonely and shaped them from the beasts of the wild, or perhaps the beasts themselves learned kindness and stood upright to walk among people.
  Wherever there is a road, there are Bertles upon it. They come in every shape and size imaginable: turtle merchants with shells that carry half their homes, sly foxfolk who trade stories sharper than knives, and lumbering elephant people whose laughter shakes the dust from trees.
  Always moving, always wandering, they travel not for gold or glory, but to find others like themselves. When one stumbles, another will lend a shoulder; when one sings, others join. They make no empires, raise no banners, and yet the world feels warmer for their passing.
  And if you meet one on the road, be you human, beast, or something between, they will share their food, their fire, and perhaps a story that sounds strangely like your own.

Creation:
  Stat Restrictions: Your Dexterity must be at least 1.
Stat Requirements: Dexterity >= 1
Custom Stat Array: [0, 0, 0, 2]

Stats:
  Base Health: 16
  Health Regen: 8
  Movement: 6 meters
  Lifespan: 75 years
  Size: Small or Medium (your choice)

Language: You speak Common and a number of chosen languages equal to your Intelligence or Presence (whichever is higher).
Languages:
- Common

Other: Due to the variations in Bertle species, you can choose if you want your size to be Small or Medium.

Starting Abilities:

  ~Skipper~:
    A: Passive
    IsIgnored: true
    Bonuses:
      Movement Speed: 1
    Combat Extras:
      - You can jump 3 meters without requiring a Check
    Effect: |
      Your starting Stats distribution is 0, 0, 0, 2 (instead of -1, 0, 1, 2).
      You have +1 Movement Speed
      You can jump 3 meters without requiring a Check (e.g. over enemies, gaps, etc).
    Notes: Jumping still uses Movement.

Starting Abilities Description: |
  Bertles have extra movement speed compared to other Races, and can naturally jump very high. That speed will be detrimental in combat!

Talents:
    # Bravery
    # Annoying

    ~Tall Paws (or Hooves)~:
      A: Passive
      IsIgnored: true
      Combat Extras:
      - You are immune to Slows
      - You can not wear Boots
      Effect: You are immune to being Slowed.
      Downside: You can not wear boots.

    ~Carnivore~:
      A: Passive
      Effect: |
        Once inbetween Worthy Combats, you can eat a piece of meat to restore 1 Health.
      Downside: |
        You can not eat grains and can only lightly eat vegetables.
        Exclusive with Herbivore.
      Notes: If you do, you take 1d4 Damage.

    ~Herbivore~ :
      A: Passive
      IsIgnored: true
      Bonuses:
        Max Health: 2
      Extras:
        - Half of your meals can consist of grass and leaves, but you can not eat meat.
      Effect: |
        Gain +2 Max Health.
        Half of your meals can consist of grass and leaves.
      Downside: |
        You can not eat meat.
        Exclusive with Carnivore.
      Notes: If you do, you take 1d4 Damage.

    ~Thick Shell~:
      A: Passive
      Combat Extras:
        - -50% Slash Damage taken from behind while unarmored.
      Effect: While unarmored, you take -50% Slash Damage when hit from behind instead of having +1 Movement Speed.

    ~Horns~:
      A: Passive
      Combat Extras:
        - When you gain Shielding, give it +1
      Effect: |
        Whenever you gain Shielding, increase its value by 1.
        You have +2 in Intimidation.
      Skills:
        Intimidation: 2
      Downside: You can't wear helmets (hats might fit you, though).
    
    ~Feral Claws~:
      A: Half-Action
      Cooldown: Once / Turn
      Damage: 1d6 + Any Stat
      EffectGreen: |
        Critical Strike - if you rolled minimum, apply a Combo.
        Critical Strike - if you rolled maximum, the target becomes Blinded.
      Subspells:
        ~Sharpen With Magic~:
          A: 10 minutes
          IsSubspell: true
          Cooldown: Once / Adventure
          Effect: |
            Permanently sharpen your claws with a ^magic weapon^ worth at least 25 XP.
            Increase the Damage of Feral Claws by +1.
            The magic weapon is then destroyed.

    ~Avian Wings~:
      A: 0 Actions
      Cooldown: Once / real hour
      Combat Extras:
        - You don't take Falling Damage.
      Effect: |
        Quickly fly up to 3 meters (e.g. almost instantly).
        Passively, you don't take Falling Damage.
      Upgrade: Your arms and hands become bird-like wings, but that makes it harder for you to hold and use weapons.
      Downside: -1 on all weapon attacks

    ~Thick Fur~:
      A: Passive
      IsIgnored: true
      Combat Extras:
        - -50% Cold Damage taken
        - -50% Smash Damage taken while below 50% Health
      Effect: |
        You take -50% Cold Damage.
        You take -50% Smash Damage while below 50% Health

    ~Fins~:
      A: Passive
      Bonuses:
        Initiative: 2
      Combat Bonuses:
        - You swim at your Movement Speed + 1 meter
      Effect: |
        You have +2 Initiative.
        You can swim at your normal Movement Speed + 1 meter.

    ~Aerodynamic~:
      A: Passive
      HasMixins: true
      Skill Bonuses:
        Running: 1
        Stealth: 1
      Combat Extras:
        - You can use Dexterity instead of Intelligence or Presence for weapons and Abilities
      Effect: |
        In Abilities or weapons that use Intelligence or Presence, you can use your Dexterity instead.
        You have +1 in Running and +1 in Stealth.
      Notes: E.g. Chilling Shout becomes 12 + ^Dexterity^ instead of 12 + ^Presence^. Phase Orb becomes 2d6 + ^Dexterity + Dexterity^ instead of 2d6 + ^Intelligence + Presence^.

    ~All Eyes and Noses~:
      AlignOnWebsite: Right
      A: Reaction
      Cooldown: 1 hour
      IsNonCombat: true
      Effect: Whenever you fail a Presence Check, you can spend 2 Health to reroll it.
      Notes: You always know if you failed a Presence Check.
    
    ~Clacker Claw~:
      A: Half-Action
      Cooldown: Once / Adventure
      Range: 1 meter
      Effect: Double-Stun 

