
Race: Bertle
Description: |
  Peering from behind a towering tree, a whimsical creature captures your attention with its keen eyes. Its fluffy form, resembling a bipedal rabbit, fox, raccoon, or other enchanting woodland creature, emanates an aura of curiosity and grace.
  Bertles possess a gentle and herbivorous nature, thriving on a vegetarian diet. While their love for greens is unmatched, it is their remarkable agility that truly sets them apart, as they excel in evading danger and traversing treacherous terrains with ease. This makes them excellent adventurers who leave thier homes in search of great wonders and stories to tell when they return!
  Bertles are known for their tribal societies, where they forge strong bonds within their communities. Living harmoniously amidst lush woodlands and enchanting meadows, these tribes prioritize unity and cooperation. Standing at heights ranging from 1 meter to 2 meters, depending on the species, Bertles showcase an array of vibrant hair and eye colorations, adding to the diversity of their appearances. They, however, are not afraid to fight! They can't hunt for food, but some might have retractible claws or sharp fangs, making them great exceptional monster hunters!

Variant: Vulper

Creation:
  Stat Restrictions: Your Heart must be at least 2.
Stat Requirements: Heart >= 2

Stats:
  Base Health: 16
  Health Regen: 8
  Movement: 6 meters
  Lifespan: 75 years
  Size: Small or Medium (your choice)

Language: You speak Common and a number of chosen languages equal to your Mind or Spirit (whichever is higher).
Languages:
- Common

Other: Due to the variations in Bertle species, you can choose if you want your size to be Small or Medium.

Starting Abilities:

  ~Skipper~:
    A: Passive
    IsIgnored: true
    Bonuses:
      Movement Speed: 1
    Combat Extras:
      - You can jump 3 meters without requiring a Check
    Effect: |
      Your Movement Speed is increased by 1.
      You can jump 3 meters without requiring a Check (e.g. over enemies, gaps, etc).
    Notes: Jumping still uses Movement.

  ~All Eyes and Noses~:
    AlignOnWebsite: Right
    A: Reaction
    Cooldown: 1 hour
    IsNonCombat: true
    Effect: Whenever you fail a Spirit Check, you can spend 2 Health to reroll it.
    Notes: You always know if you failed a Spirit Check.

Starting Abilities Description: |
  Bertles have extra movement speed compared to other Races, and can naturally jump very high. That speed will be detrimental in combat!

Talents:
    # Bravery
    # Annoying

    ~Tall Paws~:
      A: Passive
      IsIgnored: true
      Combat Extras:
      - You are immune to Slows.
      Effect: You are immune to being Slowed.

    ~Carnivore~:
      A: Passive
      Effect: |
        Gain +1 Spirit (up to the Level limit).

    ~Herbivore~ :
      A: Passive
      IsIgnored: true
      Bonuses:
        Max Health: 2
      Extras:
        - Half of your meals can consist of grass and leaves, but you can not eat meat.
      Effect: |
        Gain +2 Max Health.
        Half of your meals can consist of grass and leaves, but you can not eat meat.
      Notes: If you eat meat, you become Exhausted for 1 hour. Remember that Body also affects Max Health!

    ~Thick Shell~:
      A: Passive
      Effect: While unarmored, You take -50% Slash Damage when hit from behind instead of having +1 Movement Speed.

    ~Horns~:
      A: Passive
      Effect: |
        Whenever you gain Shielding, increase its value by 1.
        You have +2 in Intimidation.
      Skills:
        - +2 Intimidation
      Downside: You can't wear helmets (hats might fit you, though).
    
    ~Feral Claws~:
      A: Half-Action
      Cooldown: Once / Turn
      Damage: 1d6 + Any Stat
      EffectGreen: |
        Critical Strike - if you rolled minimum, apply a Combo.
        Critical Strike - if you rolled maximum, the target becomes Blinded.
      Subspells:
        ~Sharpen With Magic~:
          A: 10 minutes
          IsSubspell: true
          Cooldown: Once / Adventure
          Effect: |
            Permanently sharpen your claws with a ^magic weapon^ worth at least 25 XP.
            Increase the Damage of Feral Claws by +1.
            The magic weapon is then destroyed.

    ~Avian Wings~:
      A: 0 Actions
      Cooldown: Once / real hour
      Effect: |
        Quickly fly up to 3 meters (e.g. almost instantly).
        Passively, you don't take Falling Damage.
      Upgrade: Your arms and hands become bird-like wings, but that makes it harder for you to hold and use weapons.
      Downside: -1 on all weapon attacks

    ~Thick Fur~:
      A: Passive
      IsIgnored: true
      Combat Extras:
        - -50% Cold Damage taken
        - -50% Smash Damage taken while below 50% Health
      Effect: |
        You take -50% Cold Damage.
        You take -50% Smash Damage while below 50% Health

    ~I Am Speed~:
      A: Passive
      HasMixins: true
      Effect: |
        In Abilities or weapons that use Mind or Spirit, you can use your Heart instead.
      Notes: E.g. Chilling Shout becomes 12 + ^Heart^ instead of 12 + ^Spirit^. Phase Orb becomes 2d6 + ^Heart + Heart^ instead of 2d6 + ^Mind + Spirit^.

