Starting Abilities:

  ~Apex of Evolution~:
    A: Passive
    Effect: |
      Your starting Stats distribution is -2, 0, 2, 2 (instead of -1, 0, 1, 2).

Starting Abilities Description:
    - Big and Strong: |
        It's no secret that Giants are the kings of the hill when it comes to physical dominance: most are immense and have the strength of multiple smaller folk. But their size is not everything, and it usually comes with broad disadvantages.

Talents:

    ~Trollskin~:
      Skill Bonuses:
        Persuasion: -1
        Intimidation: 1
      Special Bonuses: Trollskin
      Combat Extras:
        - +50% Fire Damage taken
      Popup:
        Message: After you get this Talent, manually reduce your Max Health and increase your Health Regen.
      Effect: |      
        Your {Might} no longer increases your Max Health. Instead, you gain Health Regen equal to 200% of {Might}.
        You have -1 Persuasion and +1 Intimidation.
      Upgrade: Your skin is akin to a troll's skin - rough and prone to blisters or acne, but regenerates much quicker than normal.
      Downside: +50% Fire Damage taken
    
    ~Greenskin Strength~:
      Skill Bonuses:
        Control Emotions: -2
      Combat Extras:
        - Switch any Stat on Abilities/weapons to {Might}
      Effect: In weapons or Abilities, you can switch any one Stat written on it to ^{Might}^.
      Downside: You have -2 in Control Emotions.
      Upgrade: Your skin is a shade of green due to the stronger hormones and pigment flowing through your body, making your emotions more difficult to control.

    ~True Giant Ancestry~:
      Bonuses:
        Max Health: 4
        {Charisma}: -1
      Skill Bonuses:
        Stealth: -2
        Lifting: 2
      Combat Extras:
        - Large (2x2 meters)
        - Immune to Hard Terrain
      Effect: |
        You have +4 Max Health, but -1 {Charisma}.
        You are Large, immune to Hard Terrain, and occupy a 2x2 meter area.
        You have -2 Stealth and +2 in Lifting, which can exceed the Skill bonus limit.
      Downside: |
        Body and legs armor must be fitted on you by paying 50% of its original cost.
        You wear belts as bracers, bracers as rings, and rings as earrings.
    
    ~Cyclopian Eye~:
      A: Passive
      Skill Bonuses:
        Sight: -1
        Persuasion: -2
      Effect: |
        Your first attack every Turn ignores Cover (if there is Cover).
      Downside: You have -1 Sight and -2 Persuasion.

    ~Ogre Fat Tissue~:
      Skill Bonuses:
        Survival: 2
      Combat Extras:
        - You can eat rocks, dirt and bark
      Effect: |
        You are immune to being Slammed and to Falling Damage. When you are Slammed in melee range, you can also Slam the attacker 2 meters back.
        Most of your meals can consist of rocks, dirt and bark.
        You have +2 in Survival.
      Upgrade: |
        As an ogre-blood who can metabolize various debris, fat tissue is important to you not only for social status, but also for survivability!

    ~Ettin Crests~:
      A: Reaction
      Cooldown: Once / Round
      Effect: |
        When you take 10 or more Damage from a melee attack, Single-Stun the attacker.
    
    ~Stone Skin~:
      A: Passive
      Combat Extras:
        - -50% Slash Damage if unarmored
      Effect: While unarmored, You take -50% Slash Damage instead of having +1 Movement Speed.

    ~Two Heads~:
      A: Passive
      Bonuses:
        Mana: 1
        {Sense}: -1
      Skill Bonuses:
        Observing Detail: 2
      Effect: |
        If your class's Mana is _standard_ or none, you have 1 extra Mana, but -1 {Sense}.
        You have +2 in Observing Detail.
        You may interrupt your Turn, and continue it later after one Enemy acts (or at the end of Round).
      Upgrade: Having 2 heads often means having 2 opposite personalities with different skills, 2 mental headspaces and 2 names, but folklore says 2-headed giants have only one soul, as they have one body, one heart. Life as a two-header is tough, facing likely ridicule or ostracization. But chins up! Two heads think better than one, and contrary to popular belief, such giants seem to have even more thorough control over their body!

    ~Madness~:
      Effect: Alchemical rage.

