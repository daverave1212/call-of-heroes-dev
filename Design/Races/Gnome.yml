
Race: Littlefolk
Variant: Hobbit or Halfling or Domovoy
LayoutType: B
DescriptionLeft: |
  Day #47, written beneath a mushroom too wide for one traveler and too damp for two.
  I cannot help but marvel at how many kinds of us there are! Oh, the Littlefolk, they call us, as if we were one tidy people! Yet I have met halffolk who bake joy into every crumb of bread, gremlins who smell of copper and mischief, gnomes who hum lullabies to their plants, and the mute Jee tribes of the East, who speak through gestures so graceful they make wind look clumsy. Some even whisper that the Dom Voyagers were born of soot and starlight, and I half believe it. How curious! It's said we see colors more vividly than other folk, so vividly that dreams often spill into waking. I wouldn't know, I've never been an Elf or a Dwarf. But sometimes, when the light hits just right, I can't quite tell which world I'm standing in… and isn't that wonderful?
  In truth, one must be curious to live like the Littlefolk! Just last week, I spent an evening with a band of Gremlins who had decided to turn a chicken into an airship. I still don't know why, but it did work for a moment—long enough for the bird to gain a bit of altitude and a deep sense of confusion. It is this excitement that keeps us alive - literally! Because we don't age like other people. Only sorry and sorrow Littlefolk grow wrinkles!
DescriptionRightTop: |
  You, whoever you are reading my last page of this journal, are welcome to wonder. No more writing, I say! Only doing! I have changed my ways and left my red hat and journal here, beneath a mushroom too wide for one traveler and too damp for two.


Creation:
    Stat Restrictions: Your Might must be either 3 or -1.
Stat Requirements: Might >= 3 or Might <= -1

Stats:
  Base Health: 14
  Health Regen: 8 # Lowered by -1 because of very strong Talents
  Movement: 4 meters
  Lifespan: potentially infinite (a Littlefolk dies when overwhelmed by stress or depression)
  Languages: Common
  Size: Small if your Might is below 2, or Medium if your Might is 2 or higher


Language: You speak Common and a number of chosen languages equal to your Intelligence or Charisma (whichever is higher).
Languages:
- Common

Starting Abilities:

  ~Inherited Tastes~ :
    A: Passive
    IsIgnored: true
    Combat Extras:
      - You don't age from time, but age when depressed, anxious, angry, etc. You see more colors and your dreams are vivid.
      - You don't have a sense of taste.
    Effect: |
      As a Littlefolk, you don't age from the passing of time. {Color('#470018' "Instead, you age more rapidly when you are suffering emotionally")} (in periods when you're depressed, anxious, fearful, etc).
      
      You don't have a {Color('#003e1f' "sense of taste, but your eyes perceive a broader spectrum of colors")} than other races, including ultraviolet and infrared.
      
      Littlefolk' daydreams tend to be {Color('#2d3e00' "very vivid, almost as vivid as regular dreams at night")} or akin to hallucinations.

  ~Life of Wonder~:
    A: Passive
    Effect: |
      You start with 2 different {Link('Positive Quirks' '/Other/Quirks')} of choice, and 2 chosen Phobias of Monsters of choice (e.g. Zoophobia, Anxiety Around Cadavers, etc).
      The chosen Phobias must be according to your Hero's personality traits.

Starting Abilities Description:
    - Taste: |
        Depending on your type of ancestry, you might not have a sense of taste! However, Littlefolk see a larger spectrum of colors compared to other races.
        In roleplaying situations, this could translate into being able to see hidden messages written in "invisible" colors, detecting certain types of magic that emmanate invisible light, etc.
    - Long (or Short) Lives: |
        This is no time to worry, especially not for a Littlefolk! Life must be lived thoroughly, eating copious meals, playing fun games, working hard, and, most importantly, eating copious meals!
    - Life of Wonder: |
        It is natural that a Littlefolk, with its innate creative mind and sanguine spirit, has both more hobbies, and more fears than "taller" races (not that Littlefolk are not tall).

Talents:

    ~Halffolk Luck~:
      A: Reaction
      Cooldown: Once / Adventure
      Skill Bonuses:
        Luck: 2
      Effect: |
        After another Unit you can see of you makes a roll, you can force them to reroll one die once and keep the new result.
        Passively, you have +2 in Luck.
      Notes: "You are small in stature but big in heart, with nimble fingers, warm cheeks, and an easy smile that draws friends and fortune alike. You take life lightly, but your courage and cleverness often shine brightest when others least expect it."

    ~Redcap~:
      A: 1 hour
      Cooldown: Once / 2 Adventures
      Effect: |
        Transform a Negative Quirk into the Clumsy Negative Quirk. The Quest Master chooses the non-Combat Skill you get a minus in.
        Passively, you age normally instead of aging from negative emotions, living up to 100 to 150 years.
      Upgrade: You can only use at the end of an Adventure, and must finish another 2 Adventures before you can use it again.
      Notes: "Your kind is named for the blood-red caps you all wear not out of tradition, but because no one remembers you for anything else. Redcaps are the grumpy middle children of the smallfolk world: too mean to be gnomes, too lazy to be goblins, and too proud to admit either."
    
    ~Pixie Dust~:
      A: Passive
      Skill Bonuses:
        Magic: 2
      Effect: |
        Your first single-target attack at most 3 meters away each Adventure makes the target Blind.
        You have +1 in Magic.
      Notes: With glittering, pink-hued skin and a sneeze that sends a puff of shimmering dust into the air, you're living proof that the Fey still whispers into the mortal world. Some say you were born from starlight that fell into enchanted groves, others that you're the laughter of ancient fey spirits made flesh. Your dreams are even stranger, colors even more vivid and personality stronger.
    
    ~Garden Home~:
      A: Passive
      Skill Bonuses:
        Nature: 1
      Effect: |
        You have access to Level 1 Minor and Utility Druid Talents, no matter what Class you are.
        You have +1 in Nature.
      Notes: "With rosy cheeks, a round nose, and an ever-dusty hat, you're a living charm of hearth and soil. Your kind was born from the earth's fondness for caretakers: guardians of roots, flowers, and forgotten corners of civilization. Your kind prefers living in ornate burrows with round doors, along cobblestone roads paved between mushrooms."
    
    ~Blueskin~:
      A: Reaction
      Skill Bonuses:
        Convincing: 1
        Empathy: 1
      Effect: |
        You start with an additional Positive Quirk of your choice, that you don't have already.
        You have +1 in Convincing and +1 in Empathy.
      Notes: Born of ancient woodland magic, you stand no taller than a toadstool and wear the cheerful blues of your kin. Your kind thrives in harmony and craft, on teamwork and cooperation. There is loot awaiting in our adventures, but the true treasure is the friends we made along the way!

    ~Farsoulen Spirits~:
      A: Special
      Effect: |
        You and another Littlefolk party member were born as twins, and are said to be sprung off the same soul.
        If both of you have this Talent, you both have the highest of both's baseline Health and Health Regen (without buffs and items).
        Both of you start with an extra Hatred Positive Quirk and Phobia Negative Quirk (the same ones).
      Upgrade: The two of you are bound to eachother, and always know the direction of the other if separated. You feel eachother's joy and sorrow, no matter the distance.

    ~Kobold Reflex~:
      A: Special
      Bonuses:
        Intelligence: -1
        Sense: 1
      Effect: |
        The first time you would take Damage from a physical source each Adventure, you dodge the Damage and negate it (if it's dodge-able).
        You get -1 Intelligence, but +1 Sense (up to your Level's Stat limit).
      Upgrade: You may dodge any Damage from a physical source that would make sense. You dodge the Damage, but if the attack had any other effects like Crowd Control, it is still applied.
      Notes: |
        You have traits from the wild Kobolds, a race of feral Bertle-like folks with animal features, albeit much more agressive and less intelligent.
        Choose which animal's visual features you would like to have!
    
    ~Leprechauni~:
      A: Passive
      Effect: |
        As an olden secret technique of your kin, you have a special _cauldron_. Whenever your party finds or gains {Gold}Gold from exploring or quest rewards, your _cauldron_ generates extra {Gold}Gold equal to 10% of the found amount.
      Upgrade: The Cauldron must be planted in a safe space, and can only be moved once per real month.
      Notes: Said to descend from fey tricksters who once bartered luck for gold, your skin carries a faint golden sheen, and your eyes glint like minted coins. Your tribes are drawn to the new and shiny, and your presence seems to coax gold from the air itself, as if fortune enjoys your company.
    
    ~Dom Voyager~:
      A: Passive
      Skill Bonuses:
        Housekeeping: 1
        Cooking: 1
      Effect: |
        The first time you deal Damage to an Enemy each Adventure, it becomes Rooted.
        You have +1 in Housekeeping and +1 in Cooking.
        You also have the Camping Ability.
      Notes: Dom Voyagers are gnomes with a touch of old household spirit in their blood. Sturdier and a little hairier than their kin, they have a homey presence and a knack for keeping spaces warm and welcoming.
      Subspells:
        ~Camping~:
            A: 5 minutes
            Cooldown: Once / in-game day
            Effect: |
                Setup camp, creating favorable conditions for your party for up to 8 in-game hours.
                Units in the camp are protected from all bad weather and are immune to being poisoned by food.
                Until the end of the Adventure, all Units who camped here are immune to Hard Terrain.
        

    ~Goblin Tendencies~:
      A: Passive
      Combat Extras:
        - You can see 5 meters in the dark
      Effect: |
        The first time you attack with a weapon each Adventure, deal +1d6 Damage.
        You have no penalty for attacking in the dark.
      Notes: Your skin carries a greenish hue that seems to reflect your restless nature. . Your teeth are sharp and uneven, made for biting into life as much as food. It's hard for you to sit still, ideas come in bursts, and random naps are key to a healthy way of living.
    
    ~Family of Gremlins~:
      A: Special
      Bonuses:
        Intelligence: 1
        Initiative: 0.5
        Charisma: -1
      Skill Bonuses:
        Crafting: 1
        Lockpicking: 2
      Effect: |
        You have +1 Intelligence and +0.5 Initiative, but -1 Charisma.
        You have +1 in Crafting and +2 in Lockpicking.
      Notes: Your skin carries a rough, teal-tinted hue. You're endlessly curious. Adrenaline is your constant companion, and boredom your greatest enemy.
    
    ~Of The Jee Tribes~:
      A: Special
      Skill Bonuses:
        Performing: 2
      Effect: |
        The first time you use a Healing Spell each Adventure, it does +1d6 Healing.
        You have +2 in Performing.
        You are mute and can not speak.
      Notes: "Born from the whispers of ancient mountains and the songs of forgotten winds where your ancestors worship strange gods, you bear the legacy of your Jee tribe through your round body and pale shiny skin. You sense the world in subtler ways: vibrations in the air, the warmth of life, the harmony of life... if only you had a way to tell your story."
    
    ~Backwards Feet~:
      A: 0 Actions
      Cooldown: Once / Adventure
      Skill Bonuses:
        Stealth: 2
      Effect: |
        Move up to your Movement Speed.
        Passively, you have +2 in Stealth.
      Notes: "Your legs bear the mark of a strange mutation that occured among your folk long ago: slightly taller than other Littlefolk and your legs bent backwards. You live by cunning and instinct, protector and trickster both."

    ~Thimble Kin~:
      A: Passive
      Effect:
        You have -1 Might, but +1 Dexterity (up to the Level Limit).
        You can move through spaces of enemy Units.
        You can climb and ride on the back of an ally and move with them on their turn (without them having a Speed penalty).
        You are Small.