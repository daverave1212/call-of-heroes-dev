Ability Choices Description: |
    As a Dragonsworn, you can choose how your Dragon's Breath has evolved.

Talents:

    ~Drake Breath~:
      A: Half-Action
      Range: 4 meters
      Cooldown: Once / Turn
      Effect: Shoot a quick burst with your elemental breath at a Unit, dealing 1d12 Damage (of your Element Type).
    
    ~Dragon Breath~:     # Ok
      A: 1 Action
      Cooldown: Once / 2 turns
      Range: 1 meter to edge
      HasMixins: true
      Effect: |
        Choose a 3x3 meter area. All Units there take 2d8 Damage (of your Element Type).
      Notes: |
        You can use this if you didn't use it last turn.

    ~Back Wings~:
      A: 0 Actions
      Cost: 1 Mana or 6 Health
      Cooldown: Once / Turn
      Effect: |
        Quickly fly up to 6 meters (e.g. almost instantly).
        Passively, you don't take Falling Damage.
      Downside: You have -2 in Stealth
      Skills:
        - -2 Stealth
      Upgrade: You have membranous dragon-like wings growing from your back, which allow you to fly for short distances.

    ~Hulking Dracontaur~:
      A: Special
      IsIgnored: true
      Bonuses:
        - Health Regen: -2
        - Heart: -1
        - Body: +1
      Combat Extras:
        - +1 Defense while Unarmored (-2 HR, -1 DEX and +1 MIG were added automatically).
      Effect: |
        Your lower body is 4-legged, like a draconic-centaur, and your size is Long.
        You have -2 Health Regen and -1 Heart, but +1 Body (up to +4) and, while Unarmored, you have +1 Defense instead of +1 Movement Speed.
        You are Long and occupy a 2x1 meter area.
    
    ~Primordial Dragon~:
      A: Special
      Effect: |
        You are Large and occupy a 2x2 meter area.
        You have +1 Mind (up to +4) and +6 Max Health, but -1 Heart and -1 Spirit.
      Downside: |
        Body and legs armor must be fitted on you by paying 50% of its original cost.
        You can wear belts as bracers, and bracers as rings.

    ~Serpent Shape~:
      Effect: TBD

    ~Wing Arms~:
      A: 0 Actions
      Cooldown: Once / real hour
      Effect: |
        Quickly fly up to 3 meters (e.g. almost instantly).
        Passively, you don't take Falling Damage.
      Upgrade: Your arms and hands become wings, and your hands are more akin to talons.
      Downside: -1 on all weapon attacks

    ~Horns~:
      A: Passive
      Effect: |
        Whenever you gain Shielding, increase its value by 1.
        You have +2 in Intimidation.
      Skills:
        - +2 Intimidation
      Downside: You can't wear helmets (hats might fit you, though).
    
    ~Feral Claws~:
      A: Half-Action
      Cooldown: Once / Turn
      Damage: 1d6 + Any Stat
      EffectGreen: |
        Critical Strike - if you rolled minimum, apply a Combo.
        Critical Strike - if you rolled maximum, the target becomes Blinded.
      Subspells:
        ~Sharpen With Magic~:
          A: 10 minutes
          IsSubspell: true
          Cooldown: Once / Adventure
          Effect: |
            Permanently sharpen your claws with a ^magic weapon^ worth at least 25 XP.
            Increase the Damage of Feral Claws by +1.
            The magic weapon is then destroyed.

    ~Second Skin~:
      A: Passive
      IsIgnored: true
      Combat Extras:
        - You also take -50% Damage from your 2nd chosen element.
      Effect: |
        Choose one more Element from Dragon Ancestry
        You take -50% Damage from that Damage type.
            






