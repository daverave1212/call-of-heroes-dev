Meta:
  Descriptions:
    Common: |
      These are simple utility magic that don't usually have much impact on the game.
      All of these items can be sold to a merchant for 50% of the standard price.
    Uncommon: |
      These are standard consumables. Award players with one these every now and then. It is also recommended you provide these in limited supply at shops (e.g. if your Adventure is medium difficulty, do not provide more than 2 Potions per Adventure).
      Remember that items always take an Action Point to use, and a Potion consumer risks an Overdose if 2 Potions are consumed within 1 hour. Special ammo does not need a Half-Action to be loaded - a Player can simply state that they are using that ammo for an attack.
      All of these items can be sold to a merchant for 50% of the standard price.
    Epic: These are simple utility magic that don't usually have much impact on the game.
    Situational Items: These are simple utility magic that don't usually have much impact on the game.
