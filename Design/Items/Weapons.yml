
# Shields:
# - 50% pierce damage


# No Req, 1 Stat, 2 Stat (and rarely 3 Stat)
# Weapons that do not require any stat deal 1 less Damage than their counterparts
#   ...and they are more for utility

# One-Handed Weapon (LOW): 1d4 + Stat

Descriptions:
  # Weapon Runes: |
  #   Any weapon can be inscribed with 1 rune. A rune is destroyed when used to inscribe a weapon, and inscribing a rune onto a weapon replaces the previous rune (if there was any).
  #   Standard runes (like the ones below) can be purchased from most regular stores.
  # One-Handed Melee: Any Hero can freely use any One-Handed Weapon, as long as the Stat requirements are met. Attacks with One-Handed Weapons only use 1 Action Point, so you can make 3 attacks on your turn, even with the same weapon!
  Two-Handed Melee: Any Hero can freely use any Two-Handed Weapon, as long as the Stat requirements are met. Attacks with Two-Handed Weapons use 2 Action Points. For some Two-Handed Weapons, you can spend 1 extra Action Point when you declare the attack to add the extra effect to the attack.
  # One-Handed Ranged: Any Hero can freely use One-Handed Weapon, as long as the Stat requirements are met. Attacks with One-Handed Weapons only use 1 Action Point, so you can make 3 attacks on your turn, even with the same weapon!
  Two-Handed Ranged: Any Hero can freely use any Two-Handed Weapon, as long as the Stat requirements are met. Attacks with Two-Handed Weapons use 2 Action Points. For some Two-Handed Weapons, you can spend 1 extra Action Point when you declare the attack to add the extra effect to the attack.
  Wands: Wands are usually reserved for spellcasters with high {Intelligence}, and generally have elemental Damage and effects different from regular weapons.



# Weapon Runes:

#     Elemental Rune:
#       EffectGreen: Inscribe on a weapon to permanently change its Damage type to Fire, Cold or Shock.
#       Notes: This rune is consumed when inscribed, and overwrites the previous rune on the weapon if any.
#       Price: 75
    
#     Traditional Rune:
#       EffectGreen: Inscribe on a weapon to permanently remove its Stat requirements.
#       Notes: This rune is consumed when inscribed, and overwrites the previous rune on the weapon if any.
#       Price: 75
    
#     {Intelligence} Rune:
#       EffectGreen: Inscribe on a weapon to permanently replace one Stat in its text (e.g. Might) with {Intelligence}.
#       Notes: This rune is consumed when inscribed, and overwrites the previous rune on the weapon if any.
#       Price: 75
    
#     Spirit Rune:
#       EffectGreen: Inscribe on a weapon to permanently replace one Stat in its text (e.g. Might) with {Sense} or {Charisma}.
#       Notes: This rune is consumed when inscribed, and overwrites the previous rune on the weapon if any.
#       Price: 75

