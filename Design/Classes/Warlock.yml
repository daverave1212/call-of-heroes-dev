        <Curse of Domination>:
          A: 1 Action
          Cooldown: One Success / Adventure
          Effect: |
            Choose a Unit you can see. Pass an Intelligence or Presence Check at least equal to 5% of its Experience Worth to permanently put it under your control. You can command it telepathically what to and it will do your bidding.
