
Class: Druid
Description: |
  Traveling this harsh environment, you spot an unusually ornate stone - it's a monolith, tribute to the sun and the forest. You are passing through a druid's domain, and he or she might just be watching you from the eyes and form of a woodland critter, ready to leap upon you as a mighty wolf, or in the form of an otherworldly creature of the forest. Travelers beware!
  Druids are guardians of their domain, be it a lush forest, a barren wasteland, the peak of a mountain, or the depth of the sea. Most druids can transform into various animals, some even able to invent their own fauna and flora to shape their domain, while others forgo nature entirely to focus on studying the old ways of the cosmos.
  A druid is a spellcaster heavily attuned to their environment, who can shapeshift into animals, cast nature magic and channel the old powers of the stars themselves.

Quick Note: A druid is a spellcaster heavily attuned to their environment, who can shapeshift into animals, cast nature magic and channel the old powers of the stars themselves.

Difficulty: Hard

Weapons: You are Trained in 2 Weapon Categories of choice (e.g. 1-Handed Melee, 2-Handed Ranged, Shields, etc).

Languages: Druidic

Level Up:
  Every Level: 
    Health: 5


Spellcasting:
  Type: Mana-based
  SpellsOrAbilities: Spell
  
  Change: You can change your known Spells and Talents inbetween Adventures.
  Other: All Druid-specific abilities are considered spells (unless stated otherwise).
  
  Mana:
    Amount: 1
    Regain: You regain all Mana back inbetween Adventures.
    Per: per Adventure
  
  
  Basic Ability Lists:
    - Nature
    - Mysticism

  Recommended Abilities Description: |
    You can provide healing and utility to your team with Healing Surge and Speak With Plants, deal flexible damage and Crowd Control with Poison Burst and Intelligence Blast, and provide buffs to your party with Wild Dexterity.

Druidic: |
    Whistletone is the art of conveying information at long distances through whistles, claps and snaps. Druids specifically can also incorporate magic into their Whistletone to mimick the breeze of the wind, the subtle sound of thunder in the distance, or even replicate smells and miasmas to convey hidden messages.

Starting Abilities Description:
    - Druidcraft: |
        Druids have the ability to create small magical effects that affect plants, animals or just nature.
        You can use the Druidcraft Spell in roleplay scenarios to affect the environment and people.
    - Shapeshift: |
        As a Druid, you can tranform into various animals, both in combat and outside of combat.
        The Shapeshift Spell provides an infinite amount of options to help out your party in any situation!
        You can choose any animal from the Animals list to Shapeshift into, as long as it's not Exotic or non-standard. Each Animal allows you to use its special Ability once per Adventure. You are still only allowed to use that Ability once per Adventure, even if you Shapeshift into that animal twice (the cooldown stays the same).
        Other Druid Talents might allow you to Shapeshift into more unusual beasts.
        Shapeshift is considered a Spell.

        When in Shapeshift form, you always have access to the Animal Attack Ability, which is not considered a Spell.
        Animal Attack is, of course, impaired if you are Crippled.

Starting Abilities:       # 1

  ~Naturality~:
    A: Passive
    AlignOnWebsite: Right
    Effect: |
      You start with +1 in any Stat (up to +3) and +2 Skill Points.
      You may have 1 additional Utility Talent from any available Level.

  ~Animal Attack~:
    Requirement: Only usable while Shapeshifted
    A: Half-Action
    AlignOnWebsite: Right
    Damage: 1d6 + Any Stat
    Range: 1 meter
    Stat: Smash, Slash or Pierce
    EffectGreen: Critical Strike - if you roll maximum, apply a Combo.

  ~Shapeshift~:
    A: 0 Actions
    Cost: 1 Mana
    HasMixins: true
    Duration: Until cancelled (0 AP) or you Fall
    Effect: |
      Transform into a medium-sized, regular animal, or a mystical beast resembling one you've encountered this Campaign. It has 2 features of choice from below (up to your Level).
    Notes: |
      Your animal's Stats are 3/1/0/-1 spread as you like (for Rolls only).
      You can only cast _some_ Abilities while Shapeshifted.
      You choose what items you keep on you when Shapeshifting, and those items are 'merged' into your new form.
      While Shapeshifted, you can speak, but your voice is slightly altered to match your shape (e.g. guttural for lions, high pitched for birds, etc).
    HasSpellTableNumbers: true
    SpellTable:
      - Name: Hefty
        Effect: When Shapeshifting, gain 3 Shieldings that block 1d4 Damage each. You are Long (2x1 meters) and Ridable.
      - Name: Clawed
        Effect: Your animal features listed here have their Dice Upgraded to the next die type.
      - Name: Sweep {Action}2 Action Points {Cooldown} Once / Shapeshift
        Effect: All Units within 2 meters take 2d4 + Your Highest Stat (any type). If only one Unit is hit, +50% Damage and apply a Combo.

      - Name: Bash {Action}1 Action Point {Level}Level 2 {Cooldown} Once / Combat
        Effect: |
          Single-Stun a Unit and deal 1d4 Smash Damage to it.
          {Combo} and a one Unit 2 meter from you.

      - Name: Venomous {Level}Level 3
        Effect: Animal Attacks deal +1d4 Damage to Units affected by Crowd Control. {Combo} +1d4 Damage.

      - Name: Fast {Level}Level 4
        Effect: You have +3 Movement Speed. You can freely Break Movement.
            
      - Name: Sticky {Action}1 Action Point {Range}3 meters {Level}Level 5
        Effect: Shoot a sticky substance at a Unit. It takes 1d4 Damage, becomes Rooted and apply a Combo. Usable once per Shapeshift.
      
      - Name: Shred {Action}2 Action Points {Level}Level 6
        Effect: Attack a Unit for 2d8 + 3 Slash Damage. Deals +1d8 Damage for each level of Stun on it.

      - Name: Leap {Action}1 Action Point {Level}Level 7
        Effect: "Leap at a Unit 2-3 meters away. Deal 2d6 Pulse Damage and apply a Combo. {Combo} it becomes Frail."

      - Name: Fly {Level}Level 8
        Effect: You can fly up to your speed. You take -50% Smash Damage.

      - Name: Large {Level}Level 9
        Effect: You have 2 Defense. You are Large (2x2 meters) and Ridable.
      
