        Range: 5 meters
        Degree: Minor
        Tags: [Healing, Combo]
        Effect: |
            Heal an ally (or yourself) for 1d8 Health.
            If they have 50% or more Health before the heal, double the result!
        Combo: Cast Awe.

    ~Elation~:
        A: 0 Actions
        Cost: 1 Mana
        Degree: Minor
        Tags: [Buff]
        Effect: |
          Up to 2 Heroes you can see gain Health Regen equal to your Intelligence.

    <Weakness of the Soul>:
      A: Half-Action
      Cost: 1 Mana
      Range: 5 meters
      Tags: [CC, Combo]
