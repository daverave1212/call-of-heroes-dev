    ~Warding Incense~:
      A: Reaction
      Cost: 1 Mana
      Tags: [Protection, Combo]
      Effect: |
        Use when an ally would take Damage.
        Roll 1d6 and subtract that much from the attack.
        Then give them the rolled die as one Shielding and apply a ~Combo~ on them.
    
Utility:
        
    ~Guidance~ :
        A: Reaction
        Range: 10 meters
        Cooldown: 1 real hour
        Tags: [Utility]
        Effect: When an ally makes a Check, it can use your modifiers (including being Skilled in that Skill) instead of its own.

    ~Saving Throw~:
        A: 0 Actions or Reaction
        Cooldown: 1 hour
        Range: 7 meters
        Degree: Minor
        Tags: [Protection, Other]
        Effect: |
            Use when the Turn of an Enemy starts (or on your Turn).
            Instantly pull another ally to your nearest empty space.
        Notes: |
            The ally goes flying.
            You need line of sight to the targets. The allies fly to you ignoring obstacles and ground traps (goes around obstacles), unless the ally needs to swerve more than 2 meters in any direction.

    ~Mending~:
        A: 1 Action
        Degree: Lesser
        Tags: [Utility]
        Effect: |
            Touch a slightly broken piece of material that is still in one piece.
            You can repair the Damage done to it.
            Mending can repair a piece of Armor or Weapon for 1 Defense or Damage, but no more.
        Notes: |
            For example, repair a hole through a chain shirt or textile material, the crack in a piece of glass, etc.

    ~Compel~:
        A: 0 Actions
        Range: 5 meters
        Degree: Minor
        Duration: Lasts until they can't see/hear you
        Cooldown: 1 real hour
        Tags: Roleplaying
        Effect: |
            Choose a Unit you can see. You have +1d2 to Sense Rolls against it.
        Notes: The target can't tell it was affected unless it knows about this type of magic.


Starting Abilities Description: |
