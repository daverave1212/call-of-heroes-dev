    <Ruining Throw>:
      _Value: 2
      A: Half-Action
      Range: 10 meters
      Cooldown: Once / Combat
      Tags: [Control]
      Upgrade: |
        Epic Monsters gain ther Defense back when they spend the Action to recover.

