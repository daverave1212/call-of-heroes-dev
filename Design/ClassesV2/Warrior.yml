        You can recruit one squire per Adventure, but only one can follow you in your adventures at a time.
        At the start of every Adventure (and when you get this Talent), you must spend 1 Mana and train your Squire to permanently increase its Health by 2 or gain one Ability from any other Squire type.
      Upgrade: |
        If your squire drops to 0 Health, it becomes Fallen, like a player. It has no Health Regen, but at any point outside of combat, you (the pet owner) can spend 30 minutes to tend to your squire's wounds and heal it back to full Health.

        {KeystoneTalent}
      Notes: Your squire is not a Hero by any means and does not behave like one (it can't use Weapons, Armor, Feats, Abilities, etc like a Hero can). It is limited to what its stat block and Abilities say it can do. You can, however, give it orders, customize its looks (hair style, clothes, etc) and it will obey your commands within reason. You are the leader it looks up to. Lead proudly and fairly!

