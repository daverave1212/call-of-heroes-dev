Utility:



  ~Vault Break~:
      Degree: Lesser
      A: 0 Actions
      Cooldown: 1 real hour
      ScrollPower: Auto
      Range: 3 meters
      Tags: [Control]
      Effect: |
          Slam the ground so hard that it shatters one obstacle that fits within a 3x3x3 meter area.
      Notes: It is the Quest Master's call if an obstacle can be broken. Most walls can't be broken, except for thinner ones and fences.

  ~Sound Mind~:
      A: Reaction
      HasMixins: true
      Tags: [Protection]
      Effect: |
          Take 2d4 Damage.
          Block any non-damaging negative incoming _effect_ on another ally you can see.
      Upgrade: Negative effects in this case means any Crowd Control, Debuff, Curse, mind-altering magic, non-Damaging Poison, etc.

  ~Command - Resist~:
      A: Reaction
      Effect: |
        Use when another Ally would take Damage.
        They don't take the Damage now. They take it at the end of their Turn.
      Notes: You can use dice and put them on their Hero Sheet to track that they will take the Damage later.

  ~Snap Out Of It~:
      A: Half-Action
      ScrollPower: Auto
      Cost: 1 Mana
      Cooldown: Once / Turn
      Tags: [Heal]
      Requirement: Only usable in Worthy Combat
      Effect: Attack a different Unit with a 1-handed weapon. It Heals them instead of dealing Damage to them.
      Notes: Any extra Damage effects on it heal as well (e.g. War Craft, Criticl Strikes, etc). Apply any weapon effects if they happen. The attack might still do Damage to other collateral Units (if applies, e.g. Cleaver to you).

Starting Abilities Description:
  - War Craft: |
      Your War Craft is your bread-and-butter feature. Use it optimally to deal more Damage in Combat!
      There are many ways you can optimize how you deal this Damage, depending on the style of fighting you like, be it sword-and-board, using an Ultra Greatsword, or punching your way to victory!
  - Charge: |
      Charge is a way to get free movement on your Turn, even every Turn! Note that Charge has an exact range of 2 meters, so you can't move less than that. You can, however, Charge 2 meters to move next to an Enemy that's only 1 meter away, if you land a bit farther back.

Specializations:
  Description: At Level 1, you can choose your specialization. Every Warrior can choose from the following Warrior specializations
  Choices:
    - Fighter, a person specialized in weapon fighting and body-to-body combat
    - Battlemaster, a heavily trained and armed warrior; master yourself - master the enemy
    - Barbarian, a crude and battle thirsty warrior, who seeks to shed blood and lives for the fight
    - Marksman, a precise and mechanical soldier, always finding the best tactic and position; the Marksman wins the battle before it begins





