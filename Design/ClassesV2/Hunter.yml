Starting Abilities Description:
  - Animal Companion:
      As a Hunter, you always have your trusted Animal Companion with you. It is both your protectee and protector. Make sure you give it a fitting name and personality, and decide what kind of animal it is. Is it a large mammal, a majestic bird, a sly lizard, or even a giant insect? The choice is yours.
  - Dodge Roll: |
      Dodge Roll allows you to dodge-roll to avoid some of the Damage, or can be used on your Turn to immediately move 2 meters without using an Action Point.
  - Pet Talents: |
      Your pet has a baseline of 2 Pet Talents. These are special Pet Abilities that give your animal companion extra power. You can pick between having it be more tanky, focus on Damage or area attacks, or even give it a Healing Ability.

