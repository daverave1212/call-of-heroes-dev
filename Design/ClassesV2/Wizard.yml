

Ideas:
    
    ~Book Is Alive!~:
      A: Passive
      Effect: Your spell book is alive!


Class: Wizard
Description: |
  You step inside the magic circle, and an incantation of fire, frost, and lightning begins. The figure with robes and glowing eyes moves around, raw energy emanating from their palms. A book lays open on the floor, pages flipping themselves and shifting through bright violet runes. The circle is abruptly broken, and the magic stops, as you notice the Wizard caressing his beard, eyes all on you. Did the spell fail? Could this be a mistake? An error in the code of arcane? Wizards work in mysterious ways...
  Wizards are channelers magic, refiners of the coarse arcane, directly from the source, who can transform those vibrations into elemental energies. Mastery over magics has made their spells fast and efficient, but in their choice of spells and invocations, no two Wizards are alike.

Quick Note: |
  Wizards are in a continuous study of magic, and their mind is trained for accessing higher-order spells ahead of time, while sorcerers prefer a more random (albeit practical) usage of magic, going with the flow. Artificers are the complete opposite, however, prefering rigurious crafts of trial and error until they excel in their preferred creation field - alchemy, tinkering, even blacksmithing.

Difficulty: Easy
 
Weapons: You are Trained in a Weapon Category of choice (e.g. 1-Handed Melee, 2-Handed Ranged, etc).



Proficiencies Description: |
    With all the study involved in becoming a Wizard, you have undoubtedly come across facts and tidbits on how the things work in this world, hence your proficiency in general knowledge.

    Depending on what you studied, you will know quite a bit about either the occult or the arcane - what is your alignment?


# Idea: What is the Wizard class fantasy?
# Idea: Summon a wizard's tower
# Idea: You become a dragon
# Idea: You become an ethereal being of pure magic
# Idea: Stop time for a few seconds (you literally get a free turn xD)
# Idea: Cast Spells that cost 2+ Charges with -1 Charge
# Idea: Create bombs
# Idea: Chronomancy - gain some chronomancy spells, like Slow (which limits Epics to 1 turn too)


Level Up:
  Every Level: 
    Max Health: 3
    Mana: 1
    Health Regen: 2
    Skill Point: 1
    Any Stat (up to the Stat Limit): 1

Spellcasting:
  Type: Mana-based
  SpellsOrAbilities: Spell
  HasFont: true

  Mana:
    Amount: 4
    Regain: You regain all Mana back inbetween Adventures.
    Per: per Adventure

  Change: You can change your known Spells and Talents inbetween Adventures.
  Other: All Wizard-specific Abilities are considered Spells (except Magic Mastery).
  Known Basic Abilities: 3 + Intelligence (minimum 1)
  BaseKnownSpells: 3

Starting Abilities:
  
  ~Spell Book~:
    _Value: 1.5
    A: Passive
    Effect: Replenish 1 Mana after each Worthy Combat.
  
  ~Magic Font~:
    _Value: 0
    A: Passive
    Effect: |
      You may select a Magic Font to pick Minor Talents from.
      You get a free Magic Font Minor Talent at Level 1.
    Notes: |
      All Magic Font Abilities are Minor Talents.
      You can get more Magic Font Minor Talents as if you're getting normal Minor Talents (e.g. a number of them equal to your Intellgience).

Utility:

  ~Learn Scrolls~:    # 0
    A: 1 minute
    Effect: |
      If you have a Scroll that contains a Basic Ability (e.g. from Arcane, Nature, etc), you can destroy it to Know it permanently, without needing to learn it inbetween Adventures.
    Notes: You can not learn Class Abilities from Scrolls. Of course, you still need to spend Mana and respect the Cooldown of said Ability.
    AlignOnWebsite: Left

  ~Control Elements~:
      Degree: Lesser
      HasMixins: true
      A: 1 Action
      DisplayName: Control {Element}
      Range: 5 meters
      Cooldown: Your Level uses / Adventure
      Effect: |
          {DoWhat}
      Notes: |
          {ElementNotes}
          Apply common sense. The QM has the final word on whether something is possible.
      Tag: Utility
      Variants:
        - Element: Fire
          DoWhat: |
            Target a 2x2x2 meter cube containing Fire.
            Choose any of the following to do with it:
            🔹 Move it up to 5 meters in any direction
            🔹 Extinguish it
            🔹 Lower or increase its intensity or light emission by 50%
            🔹 Roughly alter its shape and/or color
          ElementNotes: A Unit that touches the fire takes 2 Damage.
          IconName: Control Elements
        - Element: Water
          DoWhat: |
            Target a 1 meter cube containing {Element}.
            Choose any of the following to do with it:
            🔹 Move it up to 5 meters in any direction
            🔹 Destroy it
            🔹 Lower or increase its temperature down to near-freezing or near-boiling
            🔹 Roughly its shape and/or color
          IconName: Control Elements
          ElementNotes: Water is Hard Terrain. A Unit that touches near-boiling or near-freezing water takes 2 Damage.

  ~Magic Tricks~:
      A: 1 Action
      Range: 3 meters
      HasMixins: true
      Degree: Lesser
      AlignOnWebsite: Right
      Effect: |
          Choose one of these effects to cast:
          {Diamond} Create harmless sensory effects, sparks or non-damaging heat or cold.
          {Diamond} Channel to create simple, small, harmless illusions in your hand or within 3 meters.
          {Diamond} Instantly clean or soil objects.
          {Diamond} Control a quill with telekinesis to quickly write with it.

  ~Feather Fall~ :
      A: Reaction or 0 Actions
      Requirement: Level 4
      Range: 10 meters
      Degree: Minor
      ScrollPower: Auto
      Effect: |
          Up to 2 Units you choose will start falling gently, down to 3 meters per round.
          Once the fall finishes, the spell effect ends.
      Notes: |
          Arcane Feathers can be bought in most towns.
          For faster gameplay, you can spend 10 gold when casting the spell, and buy the feather later.

  ~Flash~:
      A: 0 Actions
      Cost: 1 Mana
      Cooldown: Once / Turn
      Degree: Minor
      Requirement: Level 3
      ScrollPower: 2
      Effect: Instantly teleport up to 5 meters away, within line of sight.
      Notes: Does not work if you're Rooted or stuck in place somehow. You take with you all items carried you want, but not other Units.

Starting Abilities Description:
  - Magic Mastery: |
      Magic Mastery can convert a Spell from a Half-Action to 1 Action.
      You can use this twice per turn or multiple times per turn to dish out a lot of spells in quick succession, in a single turn.
      It is not considered a Spell because some other Wizard abilities affect Spells specifically, so Magic Mastery is unaffacted by them.



Talents:
  Level 1 - Minor Talent:

    ~Inscription~:
      A: 0 Actions
      Cost: 1 Mana
      Duration: Until end of Adventure
      ScrollPower: 2
      Effect: |
        Cast a Spell onto a _scroll_, spending its Cost, Cooldown, Action Points, etc (plus the additional 1 {Mana}Mana for this Ability).
        The _scroll_ can be used with Half-Action, and is destroyed after being used.
    
    ~Attention~:
      A: Passive
      Effect: Get one more Magic Font Talent.
      Notes: You can have this Talent multiple times, from different Levels.

    ~Animated Weapon~:
        Height: 80
        A: 1 Action
        Cost: 1 Mana
        Range: 3 meters
        Duration: Depends
        Degree: Major
        ScrollPower: Auto
        Effect: |
            Conjure a levitating, self-wielding melee weapon on a space within 3 meters.
            It has 1 Action which can only be spent Move and attack,
            It takes its Turn on at the same time as you, but disappears if it doesn't attack an Enemy or Worthy Unit by the end of your Turn.
        Monster:
            Name: Animated Weapon
            Speed: 3 meters
            Health: 1
            Defense: 5
            Stats: 0/0/0/0/0
            Abilities:
                ~Attack~:
                    A: Half-Action
                    Effect: Attack an Enemy for 2d8 Damage (Pierce, Slash or Smash).
                    Upgrade: If the weapon doesn't make an attack on an Enemy or Worthy Unit by the end of your Turn, it is unsummoned.

    ~Magic Rune~:
      A: Half-Action
      Cost: 1 Mana
      ScrollPower: Auto
      Effect: |
        Magically draw a faint 3x3 meter _rune_ onto a flat surface.
        Cast a Spell onto the _rune_, spending its Cost, Cooldown, Action Points, etc (plus the additional 1 {Mana}Mana for this Ability).
        When an Enemy enters the _rune_, that Spell is automatically cast on that Unit (or centered on that Unit if it's an Area Ability). Then the _rune_ is destroyed.
      Notes: If the Spell has you choose something else, like a secondary target or an effect, you can do so the moment the rune explodes.


  Level 2 - Keystone Talent:

    <Pyromancy>:
      _Value: 1.5
      A: Passive
      Effect: Every Turn, after the first time you deal Damage to 2 or more Enemies with the same Ability, increase all Fire Damage you deal by 1 for the rest of the combat.

    <Electromancy>:
      _Value: 1.5
      A: Passive
      Effect: |
        After the first time you affect an Ally with a Spell each Turn, increase all Healing and Shock Damage you deal by 1 for the rest of the Combat.

    <Arcanism>:
      _Value: 2
      A: Passive
      Effect: |
        Your dice can't roll less than 0 (see below).
        After every 5 rolled dice, increase that number by 1 this Combat.
      Notes: The rolled dice carry on to the next Turn. This number can even exceed a die's highest number.

    <Hydromancy>:
      _Value: 1.5
      A: Passive
      Effect: Once per Turn, after you apply Crowd Control to an Enemy, increase all Cold Damage you deal by 1 for the rest of the combat.
      Notes: Hard Terrain does not count as Crowd Control. Slamming counts as Crowd Control.

  Level 3 - Minor Talent:

    ~Upcast~:
      A: 0 Actions
      Cost: 1 Mana
      ScrollPower: Auto
      Effect: After you cast the next Spell this Turn, choose one of the rolled dice. Increase the result number of that die by 100%.
      Upgrade: This is not considered a Spell.

    ~Grow or Shrink~:
        A: 1 Action
        Cost: 1 Mana
        Cooldown: Once / Turn
        ScrollPower: Auto
        Degree: Minor
        Effect: |
            A Unit or object you can see becomes one Size larger/smaller.
            It gains or loses 10% Max Health, gains or loses 1 Damage on all offensive Acts, and gains or loses 1 Movement Speed.
            Can stack multiple times.
        Notes: |
            Current Health changes with the Max Health (e.g. for 80/100 Health, if growing, new Health will be 90/110; if shrinking, new Health will be 70/90). When the effect expires, the new Current Health stays as it is, unless it's higher than the new Max Health.
            When the effect expires, current Health remains the same if lower, or is cut to maximum if higher.
            A larger Unit becomes 1 meter larger/smaller in both directions.
            It's number of spaces occupied also changes with this.

    ~Attention~:
      A: Passive
      Effect: Get one more Magic Font Talent.
      Notes: You can have this Talent multiple times, from different Levels.

    ~Spectral Hand~:
        A: 0 Actions
        Cost: 1 Mana
        Range: 5 meters
        Duration: Rest of Adventure
        ScrollPower: 2
        Degree: Minor
        Effect: |
            Conjure a _spectral hand_ in a space you can see.
            You can control the hand as you move your normal hands. You can spend Half-Action to move it up to 5 meters.
            You can cast Spells as if they originate from the _spectral hand_ instead of your own, calculating Range and Cover from it instead of you.
        Notes: |
            The hand can't lift objects weighing more than you can lift just with one hand.
            Moving the hand spends Action Points as if you made moved your own hand.
            You can destroy the _hand_ at will.


  Level 4 - Keystone Talent:
  
    <Abjuration>:
      _Value: 2.25  # 2 or more
      A: Reaction
      Cost: 1 Mana
      Effect: |
        Use when an ally (or you) would be hit by a missile (before hitting the target).
        Fling it from air back to the attacker (with the exact Damage and effects).
    
    <Animation>:
      _Value: 2.5
      A: Passive
      Effect: |
        Whenever you spend Mana on a Spell that doesn't deal Damage, you can pick a Large or Medium object within 6 meters and bring it to life.
        It has 3 Speed, can fly and can attack for 1d4 Smash, Slash or Pierce Damage.
        Lasts 1 minute or until it takes Damage (after which it returns to its inanimate form).
      Notes: Alternatively, it can use Sprint, Push or Taunt once.

    <Illusionism>:
      _Value: 2
      A: Passive
      Duration: 1 minute
      Effect: |
        After you use Magic Mastery, choose an ally.
        Create a clone of them on a space within 2 meters of them, and teleport the ally 2 meters in any direction (as to create a diversion).
        The clone has the same Health and other stats, but takes 300% of the Damage it takes.
        The clone can pretend to do anything the ally can do. If it attacks with a weapon or Spell, it can do at most 1 Psychic Damage per attack Act.
      Upgrade: An enemy can't tell which Unit is real and which is the clone until the clone does something relevant and the Unit has at least 3 Intelligence.
      Notes: |
        E.g. the clone could cast Magic Missiles, but only one missile will deal 1 Damage (you can choose which, and apply Cover, Defense and other penalties normally - e.g. 1 Damage with Cover becomes 0 Damage). Alternatively, for example, it could attack twice with a one-handed weapon for 1 Damage each.

    <Spellcraft>:
      _Value: 2.5
      A: 0 Actions
      Cooldown: Once / Combat
      AlignOnWebsite: Right
      HasMixins: true
      Effect: |
        When you cast a spell, you can apply this any of the following effects to it:
        {Diamond} For every 2 dice in its Damage, roll 1 more
        {Diamond} Increase it or decrease its Area by 50% (if AoE)
        {Diamond} Change its Damage type to any type
        {Diamond} Increase its Stunning by 1 tier
        {Diamond} Double its range
        You can spend 1 {Mana}Mana to cast this ignoring its Cooldown.

  Level 5 - Minor Talent:

    ~Amplification~:
      A: 0 Actions
      Cost: 1 Mana
      Duration: Until end of Adventure
      ScrollPower: 2
      Effect: |
        Choose a Unit to amplify their magic potential.
        Their first Healing or Spell Damage every Turn has its ^Dice Upgraded^ to the next die type.
      Notes: Doesn't stack with itself multiple times. "{DiceUpgrade}"

    ~Invisibility~:
        A: Reaction or 0 Actions
        Cost: 1 Mana
        HasMixins: true
        ScrollPower: 3
        Degree: Major
        Effect: |
            Use on your Turn, or before a Unit wants to do something.
            Choose a Unit you can see. It becomes invisible for up to 1 minute, or until it does an offensive Act.
        Upgrade: You can spend extra {Mana}Mana to extend the duration of this by that many minutes.
    
    ~Polymorph~:
        A: 1 Action
        Cost: 2 Mana
        ScrollPower: Auto
        Cooldown: Once / Adventure
        Effect: |
          Choose a Unit. It becomes shapeshifted into an animal you choose until the end of its next Turn, which has 2 of the Druid Shapeshift animal features (also listed here).
          It can not do any of its normal attacks or Abilities or use items, and all its Movement works as if it's moving through Hard Terrain.
          It keeps its Stats, Passives and can do Animal Attack.
        Upgrade: Apply all other rules for Druid's Shapeshift Ability.
        Subspells:
          ~Animal Attack~:
            Range: 1 meter
            IsSubspell: true
            A: Half-Action
            Damage: 1d6 + Any Stat (Slash, Smash or Pierce)
            EffectGreen: Critical Strike - if you roll maximum, apply a Combo.
        HasSpellTableNumbers: true
        SpellTable:
          - Name: Hefty
            Effect: When Shapeshifting, gain 3 Shieldings that block 1d4 Damage each. You are Long (2x1 meters) and Ridable.
          - Name: Clawed
            Effect: Your animal features listed here have their Dice Upgraded to the next die type.
          - Name: Sweep {Action}2 Action Points {Cooldown} Once / Shapeshift
            Effect: All Units within 2 meters take 2d4 + Your Highest Stat (any type). If only one Unit is hit, +50% Damage and apply a Combo.

          - Name: Bash {Action}1 Action Point {Level}Level 2 {Cooldown} Once / Combat
            Effect: |
              Single-Stun a Unit and deal 1d4 Smash Damage to it.
              {Combo} and a one Unit 2 meter from you.

          - Name: Venomous {Level}Level 3
            Effect: Animal Attacks deal +1d4 Damage to Units affected by Crowd Control. {Combo} +1d4 Damage.

          - Name: Fast {Level}Level 4
            Effect: You have +3 Movement Speed. You can freely Break Movement.
                
          - Name: Sticky {Action}1 Action Point {Range}3 meters {Level}Level 5
            Effect: Shoot a sticky substance at a Unit. It takes 1d4 Damage, becomes Double-Slowed and apply a Combo. Usable once per Shapeshift.
          
          - Name: Shred {Action}2 Action Points {Level}Level 6
            Effect: Attack a Unit for 2d8 + 3 Slash Damage. Deals +1d8 Damage for each level of Stun on it.

          - Name: Leap {Action}1 Action Point {Level}Level 7
            Effect: "Leap at a Unit 2-3 meters away. Deal 2d6 Pulse Damage and apply a Combo. {Combo} it becomes Frail."

          - Name: Fly {Level}Level 8
            Effect: You can fly up to your speed. You take -50% Smash Damage.

          - Name: Large {Level}Level 9
            Effect: You have 2 Defense. You are Large (2x2 meters) and Ridable.

    ~Attention~:
      A: Passive
      Effect: Get one more Magic Font Talent.
      Notes: You can have this Talent multiple times, from different Levels.
  

  Level 6 - Utility Talent:

    ~Levitate~ :
        A: 1 Action
        Cost: 1 Mana
        Degree: Major
        Range: 10 meters
        ScrollPower: Auto
        Effect: |
            First, roll 2d100. That's how many kilograms you can levitate when you cast this.
            Levitate one object or Unit you can see and move it as you like as long as it is and remains within 10 meters of you.
            On each of your Turns, you can spend 1 Action to keep the Object levitated or move it again. Otherwise, it falls slowly and the Spell ends.
        Upgrade: |
            A levitated Unit is Slowed perpetually.
            At Level 8, the amount increases to 5d100.
        Notes: Lasts until you don't spend 1 Action, or you become at least Single-Stunned.

    ~Major Illusion~:
        A: 1 Action
        Cost: 1 Mana
        Range: 10 meters
        Degree: Major
        ScrollPower: Auto
        Effect: |
            You create an illusion that fits at most in a 3x3x3 meter area.
            The illusion appears real to the eyes, ears and by smell, but physical interaction makes it obvious it's an illusion and objects pass through it normally.
            The illusion can deal no Damage or Crowd Control, but can provide Cover or block Line of Sight (both from the front, and from behind).
            On your Turn, you can spend 1 Action to keep and/or move the illusion, otherwise the Spell ends.
        Upgrade: |
            At Level 8, the illusion lasts indefinitely until you cancel it without needing to spend Actions, and it can hold its own simple movement and clockwork-like routines.
            You can also program this illusion to react on its own in a specific way to specific triggers, but the instructions must be concise - talk with your QM about this.

    ~Conjuration~ :
        A: 1 Action
        Cost: 1 Mana
        Range: 3 meters
        ScrollPower: Auto
        Degree: Major
        Effect: |
            You can conjure an object that is up to 1x1x1 meter in size.
            The object is solid and glows faintly.
            You can't conjure mechanical objects.
            The object disappears after 1 hour (24 hours at Level 8).

    ~Transmogrification~:
        A: 10 minutes
        Cost: 1 Mana
        Degree: Major
        ScrollPower: 1
        Effect: |
            Touch 2 objects of the same type (e.g. 2 helmets, or 2 arrows, or 2 melee 1-Handed weapons, etc).
            You make one of the look like the other.
            The change is permanent until the object breaks.
        Notes: Upon close inspection of the shape and colors, this is visibly an illusion.


  Level 7 - Keystone Talent:

    <Grand Wizardry>:
      _Value: 2.5
      A: Passive
      Effect: |
        Spells that cost 3 or more Mana cost 1 less for you.
        Basic Spells that cost Mana and have a Cooldown have no Cooldown for you.
    
    <Destruction>:
      _Value: 4
      A: Passive
      HasMixins: true
      Effect: |
        Whenever you deal Damage with a Spell that cost Mana, zap a Unit within 4 meters for ^your Intelligence^ Shock Damage.
      Notes: This is optional.

    <Evocation>:
      _Value: 3
      A: Half-Action
      ScrollPower: Auto
      Cooldown: Once / Adventure
      Duration: 1 minute
      HasMixins: true
      Effect: |
        Take the form of an _evoker_ - a being made of pure energy.
        While in the _evoker_ form, all Damage you deal from all sources becomes Pulse Damage, and all your spells that cost 2 or more Mana now cost 1 less.
        You can breathe underwater and fly at normal Speed.
      Notes: You can't end your turn inside an obstacle, and you can't move through walls, ceilings and floors.

  Level 9 - Keystone Talent:

    <Chronomancy>:  # ~3 or more
      A: 0 Actions
      Cost: 1 Mana
      Cooldown: Once / Adventure
      Effect: |
        Instantly return to how and where you were at the start of the turn, with that same Movement, Actions, Health, Shielding, Buffs and Cooldowns (not Mana, though).
        Alternatively, if you're out of combat, you can turn back time for all the world up to 10 minutes, exactly how it was, but retaining all your information from the future. Allies don't retain the information.

    <Graviturgy>:
      A: Half-Action
      Cooldown: Once / Adventure
      Duration: Until the start of your next turn
      ScrollPower: 6
      Effect: |
        Choose a 5x5x5 meter cube.
        That area become frozen in time - Units skip their turns and can't be daWizardd or affected by anything.
        Any object that touches the area becomes frozen, too (and, if it is a missile, resumes its trajectory when the area ends).

  Level 10 - Ultimate Talent:

    <Hermeticism>:
      A: Passive
      Effect: |
        You know all Basic Spells and they all cost 1 less Mana to cast. If they cost 0 Mana, they instead restore 1 Mana if used in Combat.
        You may create your own _homebrew_ Spells as per the rules of _QM Resources, Homebrewing Abilities_.
        You can use Restricted Abilities even if restricted in your current adventures.
      HasMixins: true
      Downside: "{Ultimate}"

    <Highmancy>:
      A: Passive
      Effect: |
        Your chosen Level 3 Talent triggers 3 times when it happens. When using Magic Mastery on a Spell with the same element as your Level 3 Talent, it no longer gets its ^Dice Downgraded^.
      Upgrade: All your other Spells become themed to the same element, but keep their original Damage Type. For example, if you chose fire, Frost Nova will now burst in cold, blue flames instead of ice.
      Notes: For example, when you hit multiple Units with an Ability, you increase your Fire Damage by +3 instead of +1, or you gain +6 Cold Damage from Hydromancy when you Crowd Control an Enemy. For Eldritchianism, your Spells have their ^Dice Upgraded^ 3 times.
      HasMixins: true
      Downside: "{Ultimate}"

