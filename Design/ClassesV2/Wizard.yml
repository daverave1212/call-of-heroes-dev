      You can change your chosen Magic Font (and Font Spells) inbetween Adventures.

  ~Comprehension~:
    A: Passive
    Effect: When you unlock a Talent tier, you may forgo getting a Talent from that tier to instead pick an extra Talent from a lower-Level tier or an extra Magic Font Spell.

