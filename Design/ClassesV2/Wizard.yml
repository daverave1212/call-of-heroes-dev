  ~Verticalism~:
      A: 1 hour
      Cooldown: Once / Lifetime
      Requirement: Level 6
      Tags: Other
      Effect: |
        Tapping into the arcane knowledge and the materials in the ground beneath, spend 1000 {Gold}Gold to conjure a permanent stone tower up to 40 meters tall and 12 meters across, decorated as you like. The insides are currently empty, but while you have this Ability, you may spend 1 minute to teleport any non-alive item you can hold to any location in your tower.
        While you have this Ability, if within 100 kilometers of the tower, you can channel for 1 hour to teleport your party to it.

Starting Abilities Description:
  - Fonts & Elements: |
      Wizards are masters of the elements and of pure magic. As such, you can choose what kind of elemental magic you specialize in: Fire, Frost, Lightning or Arcane. At Level 2, you will be able to pick a Talent that further increases your power in the chosen magic element. Don't worry too much about picking the right element. You can change all of them between Adventures.



