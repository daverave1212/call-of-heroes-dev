      Notes: "{DiceUpgrade}. It is up to the Quest Master what is considered natural light."
    
    <Let There Be Darkness> :
      _Value: 0.75
      A: Passive
      HasMixins: true
      Tags: [Upgrade]
      Effect: |
        While standing in environmental shadows, your damaging Awe has its ^Dice Upgraded^ to the next die type and your attacks ignore Cover.
      Notes: "{DiceUpgrade}. It is up to the Quest Master what is considered shadow."


    ~Assistance of Merit~:
      A: Passive
      Range: 5 meters
      Tags: [Reaction, CC]
      Effect: Whenever you use a Reaction, cast Awe or Single-Stun a Unit.

    <Circle of Awe>:
      _Value: 2
      A: 1 Action
      Cooldown: Once / Adventure
      Tags: [AoE, AoE Healing]
      Range: 6 meters to edge
      Effect: |
        Declare a 4x4 meter area. Cast Awe on all Units inside the area.
        After casting Awe 3 times, reset the Cooldown of this Ability (except Awes from this Ability).
      OrderOnWebsite: 1


  Level 5 - Minor Talent:

    ~Solace Tide~:
        A: Half-Action
        Cost: 1 Mana
        Range: 5 meters
        Degree: Minor
        Replacement: Replaces Solace Wave
        Requirement: Requires Solace Wave
        Tags: [Healing, Combo]
        Effect: |
            Heal an ally (or yourself) for ~1d10~ Health.
            If they have 50% or more Health before the heal, double the result!
