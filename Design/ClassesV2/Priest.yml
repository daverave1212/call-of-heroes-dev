Class: Cleric
Description: |
  In the tumult of battle, you suffer grievous wounds, tumbling injured to the ground. Amidst the chaos, however, a beacon of hope catches your eye across the battlefield. Drawing nearer, you discern a figure brandishing a sacred symbol, poised to intervene in your plight. With a decisive strike, they confront your assailant and then approach, kneeling by your side. Yet disquieting feeling overtakes you - this Cleric's powers are not of the same god as yours. All gods demand something... what will this one demand of you for bringing you back on your feet?
  Clerics are spellcasters deeply attuned to their religion, and while their magic source may be from a divine source, they nevertheless possess an understanding to wield magic, and more often than not, they have learned the secrets of their creed, and can put them to good use to attain their life's purpose.
  A Cleric is a guide, a seeker of understandings. Clerics have the innate ability to heal and cause harm, and every Cleric has the option to embrace either side of the coin - war or peace, light or darkness, life or death. While they usually serve a greater god, no two Clerics are alike, and each has their own way of worship and path in life.

Quick Note: A Cleric is a guide, a seeker of understandings. Clerics have the innate ability to heal and cause harm, and every Cleric has the option to embrace either side of the coin - war or peace, light or darkness, life or death. While they usually serve a greater god, no two Clerics are alike, and each has their own way of worship and path in life.

Difficulty: Medium-Hard

Armor Training: Medium Armor

Level Up:
  Every Level: 
    Health: 4

Spellcasting:
  Type: Mana-based
  SpellsOrAbilities: Spell
    
  Spell Grade: 6 + Presence or Presence, whichever is higher
  Change: You can change your known Spells and Talents inbetween Adventures.
  Other: All Cleric-specific Abilities are considered Spells (unless stated otherwise).
  
  Mana:
    Amount: 2
    Regain: You regain all Mana back inbetween Adventures.
    Per: per Adventure
  
  Known Basic Abilities: 2 + Intelligence (minimum 1)
  BaseKnownSpells: 2
  
  Basic Ability Lists:
    - Mysticism
    - Divine

  Recommended Basic Abilities:
    - Divine: Light
    - Divine: Cure Wounds
    - Conjuration: Dancing Weapon
    - Divine: Radiant Smite
    - Divine: Cure Affliction
    - Divine: Saving Throw
    - Divine: Guiding Bolt

  Recommended Abilities Description: |
    They provide a good range of utility with Light, healing and supporting with Cure Wounds, Cure Affliction and Saving Throw, and some good damage with Dancing Weapon, Guiding Bolt (single-target) and Radiant Smite (area).

Starting Abilities:

  ~Awe~:
    _Value: 3
    A: Passive
    Range: 5 meters
    Tags: [Damage, Healing]
    Effect: |
      Whenever you spend Mana, "cast Awe" on a Unit for each Mana spent.
      Casting Awe deals 1d4 Divine Damage if it's an Enemy, or Heals if it's an Ally.
    Notes: Ignores Cover. Some other Cleric spells will "cast Awe" for free.

  ~Blessing~:
    _Value: 0.25
    A: Half-Action
    Cooldown: Once / Adventure
    Tags: [Utility, Debuff, Awe]
    Effect: |
      Cast Awe on 2 Units and they become Blessed.
      Blessed Allies have +1 to all non-Combat Rolls for the rest of the Adventure. Blessed Enemies become Slowed.
    Notes: |
      You can bless yourself.
    AlignOnWebsite: Right

Ability Choices:

    ~Privilege~:
      A: Half-Action
      Cooldown: Once / Unit / Combat
      Requirement: Only usable in Worthy Combat
      Tags: [Healing, Combo]
      Effect: |
        Heal a Player Character you can see for an amount equal to their Health Regen.
        They do not Regen Health at the end of the Combat.
      Combo: They can Regen Health after Combat, but only for 50% of Health Regen.

    ~Mind's Thing~:
        DisplayName: "Mind's {Name}"
        A: 1 Action
        Range: 3 meters
        Degree: Minor
        HasMixins: true
        Tags: [Damage]
        Effect: |
            Deal 1d12 + ^Your Presence or Intelligence^ {Type} Damage to a Unit.
            For the rest of the combat, whenever it would take {Type} Damage, it takes {Damage} more (stacks indefinitely).

            ~Click on the icon to selecte the preferred effect!~
        Variants:
          - Name: Shadow
            Type: Scourge
            Damage: 2
            IconName: Minds Shadow
          - Name: Abolition
            Type: Divine
            Damage: 1
            IconName: Minds Abolition

    ~Solace Wave~:
        A: Half-Action
        Cost: 1 Mana
        Range: 5 meters
        Degree: Minor
        Tags: [Healing, Combo]
        Effect: |
            Heal an ally (or yourself) for 1d8 Health.
            If they have 50% or more Health before the heal, double the result!
        Combo: Cast Awe.

    ~Elation~:
        A: 0 Actions
        Cost: 1 Mana
        Degree: Minor
        Tags: [Buff]
        Effect: |
          Up to 2 Player Characters you can see gain Health Regen equal to your Intelligence.

    <Weakness of the Soul>:
      A: Half-Action
      Cost: 1 Mana
      Range: 5 meters
      Tags: [CC, Combo]
      Effect: Cast Awe on a Unit. It becomes Slowed and Blinded. Apply a ~Combo~.
    
    ~Warding Incense~:
      A: Reaction
      Cost: 1 Mana
      Tags: [Protection, Combo]
      Effect: |
        Use when an ally would take Damage.
        Roll 1d6 and subtract that much from the attack.
        Then give them the rolled die as one Shielding and apply a ~Combo~ on them.
    
Utility:
        
    ~Guidance~ :
        A: Reaction
        Range: 10 meters
        Cooldown: 1 real hour
        Tags: [Utility]
        Effect: When an ally makes a Check, it can use your modifiers (including being Skilled in that Skill) instead of its own.

    ~Saving Throw~:
        A: 0 Actions or Reaction
        Cooldown: 1 hour
        Range: 7 meters
        Degree: Minor
        Tags: [Protection, Other]
        Effect: |
            Use when the Turn of an Enemy starts (or on your Turn).
            Instantly pull another ally to your nearest empty space.
        Notes: |
            The ally goes flying.
            You need line of sight to the targets. The allies fly to you ignoring obstacles and ground traps (goes around obstacles), unless the ally needs to swerve more than 2 meters in any direction.

    ~Mending~:
        A: 1 Action
        Degree: Lesser
        Tags: [Utility]
        Effect: |
            Touch a slightly broken piece of material that is still in one piece.
            You can repair the Damage done to it.
            Mending can repair a piece of Armor or Weapon for 1 Defense or Damage, but no more.
        Notes: |
            For example, repair a hole through a chain shirt or textile material, the crack in a piece of glass, etc.

    ~Compel~:
        A: 0 Actions
        Range: 5 meters
        Degree: Minor
        Duration: Lasts until they can't see/hear you
        Cooldown: 1 real hour
        Tags: Roleplaying
        Effect: |
            Choose a Unit you can see. You have +1d2 to Presence Rolls against it.
        Notes: The target can't tell it was affected unless it knows about this type of magic.

Talents:

