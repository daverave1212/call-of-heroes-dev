    ~Water Walk~:
        A: 0 Actions or Reaction
        Cost: 1 Mana
        Range: 3 meters
        Duration: 1 hour
        AlignOnWebsite: Left
        Requirement: Level 5
        Degree: Minor
        Tags: [Utility]
        Effect: |
