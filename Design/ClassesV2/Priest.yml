  Level 10 - Ultimate Talent:

    <Edict of Awe Eternal>:
      A: 0 Actions
      Range: 10 meters
      Cooldown: Once / Turn
      Replacement: Replaces Vested Awe
      Effect: |
        ~Cast Awe twice. The dice results are increased by 50%.~
        This deals 1d4 Divine Damage to enemies or heals allies for 1d4.
