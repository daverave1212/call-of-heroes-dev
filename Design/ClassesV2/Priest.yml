Starting Abilities Description: Awe triggers automatically, so it should be a good way to heal or deal some extra Damage. Tyy to Damage low-health enemies with it. Blessed allies also have an adantage in roleplaying situations, so use Blessing early on every Adventure!
Starting Abilities:

  ~Awe~:
    _Value: 3
    A: Passive
    Range: 5 meters
    Tags: [Damage, Heal]
    Effect: |
      After you spend Mana, "cast Awe" on a Unit for each Mana spent.
      Casting Awe deals 1d4 Divine Damage if it's an Enemy, or Heals if it's an Ally.
    Notes: Ignores Cover. Some other Cleric spells will "cast Awe" for free.

  ~Blessing~:
    _Value: 0.25
    A: Half-Action
    Cooldown: Once / Adventure
    Tags: [Utility, Status Effect, Buff, Awe]
    Effect: |
      Cast Awe on 2 Units and they become Blessed.
      Blessed Allies have +1 to all non-Combat Rolls for the rest of the Adventure. Blessed Enemies become Slowed.
    Notes: |
      You can bless yourself.
    AlignOnWebsite: Right


