Level Up:
  Every Level: 
    Health: 4

Spellcasting:
  Type: Hunter
  SpellsOrAbilities: Spell

  Change: You can change your known Spells and Talents inbetween Adventures.
  Other: All Artificer-specific Abilities are considered Spells (except Magic Mastery).
  Known Basic Abilities: 3 + Intelligence (minimum 1)
  BaseKnownSpells: 3

