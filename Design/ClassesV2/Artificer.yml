  # - Augment (replace a body part, you can do this over and over)
  # - Use your arm as a blade
  # - Gene editing
  # - Skate on a hoverboard
  # - Golem
  # - Forge weapon
  # - Forge armor
  # - Have a car
  # - Become a cyborg
  # - Become a beast through elixirs
  # - Complications from surgery
  # - Iron Mask
  # - Autoturret
  # - Grenade
  # Brew Potions
