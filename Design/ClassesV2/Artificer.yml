Starting Abilities:

  ~Artificer~:        # Ok
    A: 10 minutes
    IsIgnored: true
    Extras:
      - Can create or dismantle items for Gold
    Effect: |
      Spending {Gold}Gold for its components, design and assemble a mechanized apparatus capable of performing simple, repetitive operations such as illumination, sound emission, olfactory diffusion, or the projection of pigment to form crude symbols or imagery.
      You can create any normal weapon, armor, non-food general good or adventuring gear item piece by spending its {Gold}Gold cost.
      You can _dismantle_ any good into {Gold}Gold equal to its selling worth.
    Notes:
      You can't use them to deal Damage, inflict Control Effects, or Heal.
      Typically, items sell at 25% of their base cost, and magic items at 50% of their base cost.
      Feel free to be creative with what you can do - the tools might do other small artificer tasks as well. Ask your QM!
      The spent {Gold}Gold for this is used as resource for obtaining or transmuting materials.

  ~Better Faster Stronger~:
    _Value: 4
    IsIgnored: true
    A: Passive
    HasMixins: true
    Combat Extras:
      - +{Intelligence} Artificer Talents
    Popup:
      Message: After you get this Talent, manually add +1 to a Stat of choice. Go to My Character and click on the number you want to add or subtract from.
    Effect: |
      You start with +1 in a Stat of choice (up to +2).

      You may pick an extra number of Artificer Talents equal to your {Intelligence}.
    Upgrade: |
      _Optimization through augmentation:_ the governing axiom of all Artificers. Every enhancement demands equivalence; every ascension a sacrifice. How much of your humanity will you surrender in pursuit of God?
      Many Artificer Talents are conversions of your {Sense} into long-term, structural refinements, some of which can be gained over and over.
    Notes: |
      Some Artificer Talents may use your ^absolute^ {Sense}. Your absolute {Sense} is simply equal to your {Sense} without the ^minus^ sign, if any. E.g. the absolute of -3 {Sense} is 3. The absolute of 3 {Sense} is also 3.



Utility:

  ~Teleportation Zone~:
    A: 0 Actions
    Cooldown: Once / Adventure
    Range: 5 meters
    Effect: |
      Throw a _teleportation pad_ or draw a _teleportation circle_ on a space.
      At the start of your next Turn, teleport yourself or an ally near you to it.
    Upgrade: Beyond a range of 100 meters, the translocative processes may produce anomalous results.

  ~Toolbelt~:
    A: Passive
    Effect: You possess compact Toolbelt engineered to provide immediate access to one of each Adventuring Gear piece costing at most 100 {Gold}Gold (except food).
    Upgrade: To pull out another tool, you must first put the previous tool back.
    Notes: If you lose the pulled item, you can get another copy next Adventure.

  ~Weaponized Arms~:
    A: 1 hour
    Effect: |
      Spend 100 {Gold}Gold to fabricate a specialized arm sleeve capable of securely housing and concealing up to 3 weapons.
      One may rapidly draw and sheathe any of the weapons at will with the move of a finger.
      You can only have one special sleeve created at a time.

  ~Utility Drone~:
    A: Passive
    Effect: |
      You have a flying _utility drone_. It has 1 Action that it can only use on Grab and Movement, and takes its Turn at the same time as you.
      It can pick up or drop objects. You can tune into it to speak, see, and hear through its peripherals.
    Monster:
      Name: Drone
      Speed: 4 meters (flies)
      Health: 5
      Abilities:
        ~Grab~:
          A: Half-Action
          Effect: |
            Grab, drop, or manipulate an object.
            If holding one, it can use it with a range of 1 meter.
          Notes: Can hold up to 1 object at a tine.




