
Class: Warrior
Description: |
  With a resounding impact, the greatsword cleaves through the air, connecting with the beast's tail in a mighty blow. The wyvern wheels around, its massive jaws primed to ensnare the warrior in their deadly embrace. In a daring maneuver, the fighter relinquishes her blade, seizing the wyvern's jaw in a vice-like grip, diverting its momentum towards a nearby tree. She ascends onto the creature's head, plunging her blade deep into its eye with lethal precision. It is then that you observe a miraculous sight: her previously bloody wounds have miraculously sealed, as if cauterized by the scorching heat of battle and the coursing adrenaline of combat.
  Warriors are talented in using any type of weapon, with hand-to-hand combat capabilities way beyond the average adventurer. Brawn and tactics are a warrior's aces in the sleeve.
  A warrior is a physical combatant, but that does not stop them from overcoming challenges. With mastery over arms, body or range, a warrior may improvise and lead their way to victory.

Quick Note: A warrior is a physical combatant, but that does not stop them from overcoming challenges. With mastery over arms, body or range, a warrior may improvise and lead their way to victory.

Armor Training: Heavy Armor

Difficulty: Easy-Medium


Weapons: You are Trained in all weapons, including Shields.

Level Up:
  Every Level: 
    Max Health: 7
    Mana: 1
    Skill Point: 1
    Any Stat (up to the Stat Limit): 1

Spellcasting:
  Type: Mana-based
  SpellsOrAbilities: Ability

  Spell Grade: 6 + {Intelligence}, {Sense} or {Sense}, whichever is higher
  Mana:
    Amount: 1
    Regain: You regain all Mana back inbetween Adventures.
    Per: per Adventure

  Change: You can change your known Spells and Talents inbetween Adventures.
  Other: All Warrior-specific Abilities are not considered Spells (unless stated otherwise).

Starting Abilities Description: TODO
Starting Abilities:

  ~Path of the Berserker~ :     # Ok
    A: Passive
    Effect: |
      Instead of having normal Health Regen, 200% of your Health Regen is added to your Max Health (and as such your Health Regen after combat is always 0).
      You can not gain extra Defense except through magical means (magic items, spells, etc).
    Notes: |
      Increasing Health Regen increases your Max Health instead (and losing Health Regen loses you Max Health instead).
    # Remember to recalculate your Max Health whenever you increase your Reserve Health or your Max Health.
  

  ~Onslaught~ :           # 1 Charge
    _Value: 1.25
    A: Passive
    HasMixins: true
    Effect: Whenever ^you^ kill a Worthy Enemy, Heal for 1d6 Health. In addition, if an Enemy has 25% or less Health, you know exactly how much Health it has (ask the QM).

  ~Reckless Charge~:      # Ok
    A: 0 Actions
    HasMixins: true
    Range: 2 meters
    Replacement: Replaces Charge
    Cooldown: Once / Turn
    Effect: |
      Freely dash exactly 2 meters towards a Worthy Enemy, landing on the closest space. It becomes Rooted.
      ~Your next weapon attack deals 2d6 extra Damage to the target and half of that to yourself.~
      You can only use this once on every Worthy Enemy.

  ~Blood Boil~ :          # Ok
    A: 0 Actions
    Cost: 1 Mana
    Effect: Heal for 2d6 Health.

  ~Charge~:
    _Value: 1
    AlignOnWebsite: Left
    A: 0 Actions
    HasMixins: true
    Range: 2 meters
    Cooldown: Once / Turn
    Effect: |
      Freely dash exactly 2 meters towards a Worthy Enemy, landing on the closest space, near them.
    Combo: Single-Stun it.

  ~War Craft~:
    A: Passive
    Effect: |
      No two warriors fight alike. Choose your War Craft from below!
      Each War Craft usually gives you a way to deal {Color('#ff5900' '+1d4 extra Damage each Turn')}.
    Upgrade: You may change your War Craft inbetween Adventures.


Other Abilities Title: War Crafts
Other Abilities Description: Choose one of the following War Crafts that will change your playstyle! These are not the same as the Level 1 Talents (which are below), and you still get one free War Craft and one free Level 1 Talent.
Other Abilities:

  ~Shield Craft~:
    A: Reaction
    Requirement: Requires an equipped shield
    Effect: Use after you are melee attacked. Deal 1d4 Smash Damage with your {Color('#ff5900' 'shield')} to the attacker.
    Combo: Single-Stun it instead.

  ~Dualwield Craft~:
    A: Passive
    Effect: Your {Color('#ff5900' 'second one-handed')} attack with a real weapon each Turn deals +1d4 Damage {Color('#ff5900' 'if it is with a different weapon than the first attack')}.

  ~Heavy Weapon Craft~:
    A: Passive
    Effect: Your first {Color('#ff5900' 'two-handed')} weapon attack each Turn deals +1d4 Damage {Color('#ff5900' 'if there is an Ally, obstacle or wall directly behind the target')}.

  ~Throw Craft~:
    A: Passive
    Effect: |
      You may throw real melee weapons with a 3-5 meter range. They deal -1 Damage for one-handed weapons (or -2 Damage for two-handed weapons).
      Your first {Color('#ff5900' 'thrown')} weapon attack each Turn deals +1d4 Damage {Color('#ff5900' 'if it's the first Act you do on your Turn and you have a clear throw to the target')}.

  ~Unarmed Craft~:
    A: Passive
    Effect: Your {Color('#ff5900' 'second Punch')} attack each Turn deals +1d4 Damage {Color('#ff5900' "if it's on a different target than the first")}.

  ~Marksman Craft~:
    A: Passive
    Effect: |
      Your first ~ranged~ weapon attack each Turn deals +1d4 Damage {Color('#ff5900' 'if there is no Unit or obstacle near the target')}.
      Your Charge becomes Uncharge.
    Subspells:
      ~Uncharge~:
        _Value: 0.25
        A: 0 Actions
        HasMixins: true
        Range: 2 meters
        Replacement: Replaces Charge
        Cooldown: Once / Turn
        Effect: |
          Freely dash exactly 2 meters towards an ~Ally~, landing on the closest space, near them.
        Combo: If the Ally had a Combo, make a free Move Act.
      
  ~Dual Shield Craft~:
    A: Passive
    Effect: |
      You can Dual Wield shields and attack with them for 1d6 + ^Any Stat^ Damage.
      After you Charge, gain 1d4 Shielding.
  
  ~Improvisation Craft~:
    A: Passive
    Effect: |
      Your first {Color('#ff5900' 'Improvised Attack')} each Turn deals +1d6 Damage {Color('#ff5900' 'if it's with an improvised weapon type you haven't used this Adventure')}.
  
  ~Old-Fashioned Craft~:
    A: Passive
    Effect: Your first {Color('#ff5900' 'old-fashioned')} weapon attack each Turn deals extra Damage equal to ^Any Stat^, {Color('#ff5900' 'and applies a ~Combo~ if the target is a Person')}.
    Upgrade: Old-fashioned weapons are weapons that do not deal extra Damage with any Stat (e.g. Hammer).


Utility:

  ~Vault Break~:
      Degree: Lesser
      A: 0 Actions
      Cooldown: 1 real hour
      Range: 3 meters
      Effect: |
          Slam the ground so hard that it shatters one obstacle that fits within a 3x3x3 meter area.
          After casting this Ability, if you moved this turn, you can continue your movement.
      Notes: It is the Quest Master's call if an obstacle can be broken. Most walls can't be broken, except for thinner ones and fences.

  ~Sound Mind~:
      A: Reaction
      Cooldown: Once / Adventure
      HasMixins: true
      Effect: |
          Block any non-damaging negative incoming _effect_ on an ally you can see.
      Upgrade: Negative effects in this case means any Control Effect, Debuff, Curse, mind-altering magic, non-Damaging Poison, etc.

  ~Doublesault~:
      A: 0 Actions
      Cooldown: Once / Adventure
      Degree: Major
      Effect: |
          Leap up to 3 meters. If you land on a Unit, Doublesault again (for free)!
      Notes: |
          You leap from Unit to Unit until you no longer land on a Unit. If you land on a Unit, you must leap again. You can't leap on the same Unit twice; if you do, you end your leap in the closest space near it.
          You can use this even while in the air and it cancels out your current fall or acceleration.            

  ~Snap Out Of It~:
      A: Half-Action
      Requirement: Level 4
      Cost: 1 Mana
      Effect: Attack a different Unit with a One-Handed weapon. It heals instead of dealing Damage.
      Notes: Any extra Damage effects on it Heal as well (e.g. Smite, Cursewielder, etc).


