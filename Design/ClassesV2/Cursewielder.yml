
Class: Witchblade
Description: |
  Years of dedicated study have yielded results, though the scholarship of the dark arts is not akin to the arcane. Standing before you is a woman who does not manipulate the strings of magic - no, she destroys them, weaving a tunnel of sorts to an unfathomable source of eldrich energy that pulses ominously around her, stirring unease into your soul. Out of nowhere, she laughs, and her features soften into a kind smile directed at you. Despite society's rejection, she is no monster. She, too, is human, with emotions and heart, however dark it may be.
  Witchblades are practicioners of the occult or outer magic and techniques beyond the normal domain. Using a blade, fell magic and even stealing powers away from the enemies, each Witchblade has its own source for their powers, by study, persuasiveness or pure chance.
  A Witchblade is a spellcaster attuned to the unknown and bizarre, who only needs to rest inbetween fights, and every encounter wakes the power in them anew - this time, sleep is not for the wicked.

Quick Note: A Witchblade is a spellcaster attuned to the unknown and bizarre, who only needs to rest inbetween fights, and every encounter wakes the power in them anew - this time, sleep is not for the wicked.

Difficulty: Medium

Weapons: You are Trained in 2 Weapon Categories of choice (e.g. 1-Handed Melee, 2-Handed Ranged, Shields, etc).


Level Up:
  Every Level: 
    Max Health: 3
    Mana: 1
    Health Regen: 2
    Skill Point: 1
    Any Stat (up to the Stat Limit): 1


Spellcasting:
  Type: Special Mana-based
  SpellsOrAbilities: Spell

  Spell Grade: 6 + ({Intelligence} or {Charisma}, whichever is higher)
  Mana:
    Amount: 1
    Regain: Your Mana reset after every combat.
    Per: per Adventure

  Change: You can change your known Spells and Talents inbetween Adventures.
  Other: All Witchblade-specific Abilities are considered Spells.

Ideas:
  ~Idea?~:
    Effect: Witchblade should also do increased healing or idk
  
  ~Quick Block~:
    A: Reaction
    Effect: spell shield and heal
  
  ~Damage To Shielding~:
    Effect: Gain Shielding equal to your last Damage dealt (spread within multiple d6's as you like).
  
  ~Swap Places~:
    Effect: Swap places with a Unit.

Starting Abilities Description: TODO
Starting Abilities:

  ~Sentient Weapon~ :
    _Value: 1
    A: Passive
    Effect: |
      You have a Witchblade Weapon - a special weapon of one chosen type (e.g. Shortsword, Longbow, Pike, etc). This weapon will have extra effects later on. Don't lose it!
      You gain +1 in {Might} or {Dexterity}, up to +3.
    Upgrade: |
      Reposess: By spending 1 hour, you can transfer the curse of your Witchblade Weapon into another weapon. That new weapon becomes your Witchblade Weapon, and the old one is destroyed.
    Notes: |
      You are bound by soul to your Witchblade Weapon, inside which your patron's avatar lies, either possessing the weapon, being trapped inside it, cursing it, or using it as a means of communication with you.
      You must choose your weapon type when you become a Witchblade Witchblade.
      You can customize your weapon's personality, voice, the way it looks. Talk to your Quest Master.

  ~Witchblade~ :
    _Value: 3
    A: Passive
    Cooldown: Once / Turn
    HasMixins: true
    Effect: |
      After you cast a Spell that costs Mana, your next Witchblade Weapon attack deals 1d6 extra Damage (within 5 minutes).
    Notes: "You can only add the 1d6 once per turn. The d6's can stack (from multiple Spells that cost Mana, one after another)."
        


Ability Choices:

    ~Hail~:
        A: 1 Action
        Range: 5 meters
        HasMixins: true
        Degree: Minor
        Tags: Damage
        Effect: |
            Blast a Unit for 2d8 + ^target's {Might}^ Damage of your chosen Element.
        Combo: +1d6 Damage.

    ~Wyrd Renewal~:
        A: Half-Action
        Range: 5 meters
        Degree: Lesser
        Requirement: Only usable in Worthy Combat
        Tags: [Heal, Damage]
        Effect: |
            Roll 1d10 - 5. After you see the result, choose a Worthy Unit.
            If it's negative, deal Scourge Damage to it. Otherwise, heal it.
        Combo: +50% Damage or Healing

    ~Deathfire Flame~:
        A: 1 Action
        Cost: 1 Mana
        Range: 10 meters
        Degree: Major
        Tags: Mass Damage
        Effect: |
            Shoot a bolt of deathly fire in a 1x10 meter line. All Units it touches take 1d6 + 1d8 + 1d10 Scourge or Fire Damage (your choice).
        Notes: Ignores Half-Hitting Damage reduction.

    ~Curse of Weakness~:
        A: Half-Action
        Range: 5 meters
        Cost: 1 Mana
        Duration: 1 minute
        Degree: Minor
        Tags: Debuff
        Effect: |
          Choose a Unit. The first time it deals Damage on its every Turn, roll 1d4 and subtract it from its dealt Damage.
        Upgrade: Only affects an Epic monster's first turn.

    ~Curse of Pain~:
        A: 0 Actions
        Cost: 1 Mana
        Range: 5 meters
        Duration: 1 minute
        Requirement: Level 4
        Tags: Damage
        Effect: |
            Choose a Unit. At the start of each of your Turns, it takes 1d4 Scourge Damage (ignoring Cover).

    ~Psyche Blast~:
        A: 1 Action
        Range: 3 meters
        Cost: 1 Mana
        HasMixins: true
        Degree: Major
        Tags: [Damage, Status Effect]
        Effect: |
            A Unit takes 4d6 Psychic Damage and chooses whether to become Blinded or Silenced.
            Apply a ~Combo~ to it.
        Notes: |
            Cover is applied normally.



Utility:

    ~Disenchantment~ :
        HasMixins: true
        A: 0 Actions
        Duration: Until end of Adventure
        Cooldown: 1 real hour
        Requirement: Level 3
        Degree: Lesser
        Tags: Roleplaying
        Effect: |
            A person you can see must pass a {Sense} Roll against your {Charisma} Roll or have -2 to non-combat Rolls, and be afflicted by minor curse effects (e.g. is clumsy, stumbles, get pimples, etc).
        Notes: |
            Be creative with the effects of the minor curse effects!

    ~Compel~:
        A: 0 Actions
        Range: 5 meters
        Degree: Minor
        Duration: Lasts until they can't see/hear you
        Cooldown: 1 real hour
        Tags: Roleplaying
        Effect: |
            Choose a Unit you can see. You have +1d2 to {Sense} Rolls against it.
        Notes: The target can't tell it was affected unless it knows about this type of magic.

    ~Oculus~:
        A: 0 Actions
        Range: 5 meters
        Duration: Until end of next Adventure
        Cooldown: Once / Adventure
        Degree: Lesser
        Tags: [Roleplaying, Utility]
        Effect: |
            You conjure a magical eye that records everything it sees. It can be a Tuner Eye or Recording Eye.
            At will, a Tuner Eye allows you to see what it sees, live, in your mind.
            A Recording Eye records everything it sees. You can retrieve it to see everything recorded in it.

    ~Thaumaturgy~:
        HasMixins: true
        A: 1 Action
        Range: 5 meters
        Degree: Lesser
        Effect: |
            You create one of the following magical effects:
            {Diamond} Your voice booms up to three times as loud as normal for 1 minute.
            {Diamond} You cause flames to flicker, brighten, dim, or change color for 1 minute.
            {Diamond} You cause harmless tremors in the ground for 1 minute.
            {Diamond} You cause an unlocked door or window to fly open or slam shut.
            {Diamond} You alter the appearance of your eyes for 1 minute.
        Upgrade: |
            At Level 4 you can cast this for Half-Action, and at Level 7, for 0 Actions.


Talents:
  Level 3 Class Talent:
    
    <Shapeshifting Weapon> :
      _Value: 0.25
      A: 0 Actions
      Cooldown: Once / Turn
      Effect: Instantly change the type of weapon of your Witchblade Weapon.

    <Curseweave> :
      _Value: 0.25
      A: Passive
      Cooldown: Once / Turn
      Replacement: Replaces Witchblade
      Effect: |
        After you attack a Worthy Enemy with your Witchblade Weapon, if your next Act is a Damaging Spell that costs Mana, it deals +1d6 Damage (within 5 minutes).
      Notes: |
        Applies to Mass Damage, but only applies once to Spells that hit multiple times (e.g. Magic Missile-like Spells, Damage over time effects, etc).

    <Cursehelix> :
      _Value: 0.25
      A: Passive
      Effect: |
        You now have 1 more Witchblade Weapon, of any kind. The same patron or another one of the same type is possessing your second weapon.
      Upgrade: Once per turn, for 0 Actions, you can vanish or resummon one of them.

    # Invoke weapon or draw it
    # Change Witchblade to be weapon-specific or only spell-specific

  Level 5 Class Talent:
    
    <Hungering Weapon>:
      _Value: 2.25
      A: Passive
      Effect: |
        When YOU drop a Worthy Enemy to 0 Health, gain an extra Half-Action this turn and 5 Shielding.

    <Spell Tap>:
      _Value: 2.25
      A: Passive
      Effect: |
        Every Worthy Combat, the moment you drop to 0 Mana, gain Shielding equal to your Max Mana and you can immediately freely (for 0 Actions) cast a Spell that doesn't cost Mana.

    <Somatic Pulse>:        # Should deal about ~0.5 more Damage than a normal Spell (15 against Defense)
      A: Half-Action        # Half-Action with 1 mana = 13.5 = ~4d6
      _Value: 2
      Cost: 1 Mana
      Effect: |
        ^Count^ the Worthy Units within 3 meters of you (including you).
        They all take Pulse Damage equal to ^Counted^ d4 (except you).
      Notes: E.g. if this affects 3 Units, it deals 3d4. If it affects 4 Units, it deals 4d4. 5 Units - 5d4. And so on.

  Level 6 - Utility Talent:

    ~Dancing Blade~:
        A: Passive
        Effect: |
          Your melee weapon Attacks have +1 meter range, by levitating to your target, hitting them, then quickly returning to your hand.
          You also have +1 Movement Speed
        Notes: |
            These Attacks are still considered melee Attacks, and are not considered thrown.
            Flanking applies normally if there's an Ally right behind the enemy you're Attacking (forming a line between the 3 of you).

    ~Speak With Objects~:
        A: 1 Action
        Cooldown: Once / real hour
        Effect: Choose a willing, non-hostile object. Think of an idea or question. The object responds in a way only you understand, based on its memory formed through its wear and tear.
        Notes: Keep in mind that object communication is not like talking to a sentient person - it is more akin to analyzing its wear and tear and getting an enhanced idea or impression of an event it went through.


  Level 7 Class Talent:
    
    <Hexdrain>:
      _Value: 3
      A: Passive
      Effect: Your Witchblade (or Curseweave) Damage and heals you for the Damage done.

    <Quick Hex>:
      _Value: 1.5
      A: Passive
      Requirement: Only usable without Curseweave Talent
      HasMixins: true
      Effect: Your Spells that cost Mana and can't deal Damage take 0 Actions for you, and your Witchblade applies after you cast ^any^ Spell that costs Mana, not just offensive ones.
    
    <Possessio>:
      _Value: 3
      A: 0 Actions
      Duration: 2 turns
      Effect: |
        You become possessed by your patron or power source. While possessed, you have 1 extra Action on your turn and can't spend Mana, but you can't control your Hero - your patron or power source controls it (the QM).
        You can suggest Actions for your possession, but your patron may act randomly or unpredictibly.
        You still roll any dice for Acts your Hero make.
        Lasts until the end of your next turn.

  Level 8 Class Talent:

    <Great Talent Bonus>:
      Effect: Gain one more Level 3 Talent, and one more Level 5 Talent.

  Level 10 Class Talent:

    <Soulstealer Weapon>:
      A: 0 Actions
      Cooldown: Once / Turn
      Effect: |
        Steal the soul of a dead Worthy Unit.
        Every 3 stolen souls give your Witchblade Weapon +1 Damage permanently.
        At any point, you can release all souls in your weapon to increase the Damage of the attack by 900% of the number of souls released.
      Upgrade: Dead Units whose souls are locked inside the weapon can not be revived.
      HasMixins: true
      Downside: "{Heroic}"
    
    <Whispers of Abeyance>:
      A: 0 Actions
      Effect: |
        Gain a Half-Action this Turn and get -1 in a random Stat permanently.
        Upon reaching 0 or less in all Stats, you become permanently possessed by the energies residing in your Witchblade Weapon. Each of your Stats becomes a random of 1d8 permanently.
        Reaching 0 or less in all Stats immediately kills you, and both your and your patron's souls are sent to the other plane forever.
      Upgrade: Your soul is sent into a different plane, according to your patronage. From then on, you have the same body, but you are now your patron for all intents and purposes - in mind, personality and soul.
      HasMixins: true
      Downside: "{Heroic}"

    <Cursewrought Avatar>:
      A: 1 Action
      Duration: 10 minutes
      Cooldown: Once / Adventure
      Effect: |
        Throw your Witchblade Weapon on the ground near you. It becomes a Cursewrought Avatar and immediately grows a body of its own, either ethereal, phantomatic or resembling an animated armor fused with the weapon.
        The Cursewrought Avatar resembles you in all aspects, but can't cast Spells or use Abilities, and can attack only with the Witchblade Weapon.
        Spells you cast apply to the Damage of your Cursewrought Avatar for Witchblade (or Curseweave).
      Notes: If you're not holding the Witchblade Weapon, you obviously can't attack with it.
      HasMixins: true
      Downside: "{Heroic}"
