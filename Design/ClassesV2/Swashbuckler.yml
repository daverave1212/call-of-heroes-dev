Utility:

  ~180 to Hell~:
    A: 0 Actions
    Cooldown: Once / real hour
    Range: 3 meters
    Effect: |
      Choose an Enemy within 3 meters.
      You quickly dash to the diametrically opposite space, on its other side, at the same distance.
    Notes: For example, if you're 3 meters to the South of a Unit, you move so that you become 3 meters to the North of it. Your starting space, the Enemy, and your landing space must be on the same line. Requires a clear path, but you can circle 'round the back.

  ~Raise~:
    A: 0 Actions
    Cooldown: Once / attack
    Effect: |
      Use immediately before rolling a Blood in the Water attack.
      If the attack deals Damage equal to or above its _average_, gain {Gold}Gold equal to 200% of the rolled amount.
      Otherwise, the attack misses.

  # ~Daring Leap of Logic~:
  #   A: Passive
  #   Effect: |
  #     The first time you want to perform a Stunt every Adventure, it has +50% effect (in addition to other bonuses), but only if it's really awesome.
  #     You must commit to the first idea if the Stunt is approved by the Quest Master, even if it's not that awesome.
  #   Notes: Its awesomeness depends on the Quest Master.

  ~What Have We Here~:
    A: 1 minute
    Cooldown: Once / Adventure
    Effect: |
      You can spend 1 minute to fast talk a non-playable character to try to bamboozle their morality.
      Make a {Presence} Check against their {Presence} Check.
      If you succeed, _steal_ a random Quirk it has. Otherwise, they notice you're trying to bamboozle them.

  ~I Know A Guy~:
    A: 0 Actions
    IconName: I Know This Guy
    Cooldown: Once / real hour
    Effect: |
      Use when in a town or hub to add 1d4 to an {Intelligence} Check, to bring up a reason as to why you know extra details about it. It can be about a particular subject you've encountered before, a person you know there, etc.
    Upgrade: Come up with a story on why you are already familiar with that subject matter!

Starting Abilities Description: Try to land Critical Strikes one after another! And make sure you use weapons that allow for Critical Strikes.
Starting Abilities:

  ~Blood in the Water~:
    A: Passive
    _Value: 2.25 # trigger it once per combat, though not at full potential
    Effect: |
      If your last 2 offensive Acts both either triggered a {Color('var(--green-color)' 'Critical Strike')} or a ~Combo~, your next targeted {Type} {A}Action Point Act deals +{Amount}% Damage.
      
      {Variants}
    Variants:
      - Type: 1
        Amount: 100
      - Type: 2
        Amount: 50

  ~Sharp End~:
    _Value: 0.5
    A: 0 Actions
    Cost: 1 Mana
    Cooldown: Once / 2 Turns
    Effect: Your next offensive attack or Ability deals +1d4 Damage and triggers its {Color('var(--green-color)' 'Critical Strike')} and ~Combo~ effect anyway!
    Upgrade: If it can not {Color('var(--green-color)' 'Critically Strike')}, it further deals an extra +1d4 Damage and counts as a {Color('var(--green-color)' 'Critical Strike')} anyway.

Talents:

  Level 1 Class Talent:

    ~Hack and Slash~:
        A: 0 Actions
        Cost: 1 Mana
        DisplayName: "{Name}"
        Tags: [Mass Damage]
        Effect: |
            Your next {Effect}
            
            {Variants}
        Notes: |
            Roll the attack only once. Weapon effects (like Critical Strikes), if necessary, are applied to the main target only.
            This may benefit from Blood in the Water.
        Variants:
            - Name: Hack and Slash
              Effect: melee 2-handed weapon attack also hits all other Units within weapon range, but deals -50% Damage to them (deals normal Damage to the main target).
              IconName: Hack and Slash
            - Name: Slice and Dice
              Effect: melee 1-handed weapon attack also hits all other Units within weapon range.
              IconName: Slice and Dice
            - Name: Lock and Load
              Effect: ranged 2-handed weapon attack also hits all other Units 1 meter from the main target, but deals -50% Damage to them (deals normal Damage to the main target).
              IconName: Lock and Load
            - Name: Point and Shoot
              Effect: ranged 1-handed weapon attack also hits all other Units 1 meter from the main target.
              IconName: Point and Shoot

    <Deflect>:
      A: Reaction
      Cost: 1 Mana
      Effect: Reduce the Damage of a weapon attack you or a Unit near you receives by 100%.
      Tags: [Defense]
      Notes: Works for ranged weapons. Melee body parts are considered weapons.

    ~Payday~:
      A: 1 Action
      IconName: Fame Time
      Cost: 1 Mana
      Requirement: Only usable in Worthy Combat
      Tags: [Gold]
      Effect: |
        For the rest of the Combat, gain 25 {Gold}Gold whenever you use an Action Point.

    ~All or Nothing~:
      A: 0 Actions
      Cooldown: Once / Attack
      Requirement: Only usable in Worthy Combat
      Effect: |
        Add 1d6 to an attack's Damage. If the total is _odd_, the attack misses, but you Heal for 1.


  Level 2 Class Talent:

    ~Overunder Blow~:
      Value: 0.5
      Bonuses:
        Intelligence: 1
      A: Passive
      Effect: |
        You have +1 {Intelligence} (up to your Stat Limit).
        Instead of dealing extra Damage with Blood in the Water, do one of the following:
      SingleTable:
        - 1. Heal yourself for that amount
        - 2. Single-Stun the target (Double-Stun for two-handed weapons)
        - 3. Freely move that many meters
        - 4. Push the target that many meters
      Notes: Pushing only works on non-Epic Units.

    <At Me!>:
      _Value: 1.5 # But seems inconsistent, so I really don't know
      A: Passive
      HasMixins: true
      Effect: |
        After landing 2 non-Critical Strikes in a row on a Unit, inflict a random Status Effect from the following options. Then the Unit becomes immune to ^At Me!^ for the rest of the Combat.
      List:
        - 1. Slow
        - 2. Blind
        - 3. Daze
        - 4. Single-Stun
      Upgrade: If they were both with a 2-handed weapon, the Status Effect applied is doubled (Double-Slowed, Double-Blind, etc)!

    <10 Percent Luck>:
      _Value: 2
      A: 0 Actions (or Reaction)
      Cooldown: Once / Turn
      Effect: Reroll one non-Check die you just rolled. If it rolls 1, the Act misses.

    ~Came To Collect~:
      A: Half-Action
      Cooldown: Once / 2 Turns
      Effect: |
        Use a ranged weapon to shoot a Worthy Unit for 1d4 Damage.
        Then, if it died, choose a permanent upgrade for this Ability from below.
      SingleTable:
        - 1. Dice Upgraded to the next die type
        - 2. Cooldown improved*
        - 3. Gain Gold equal to 1000% of the rolled Damage
        - 4. Restores 1 Health on use
      Upgrade: You can use this for Abilities that specify one-handed weapons.
      Notes: |
        Cooldown improved follows the following pattern, starting from the base Cooldown: Once / 2 Turns, Once / Turn, Twice / Turn, Thrice / Turn, etc.

    ~Fundamentals I~:
        A: Passive
        IsIgnored: true
        IconName: Fundamentals
        Effect: |
          Pick one more Level 1 Class or Utility Talent.

  Level 3 Class Talent:

    ~Strafe and Backpedal~:
      A: Passive
      Tags: [Crit]
      Effect: After you move from place 2 times on the same Round, your next weapon attack triggers its Critical Strike regardless, but misses if you roll 1 on at least one die.

    <Duel To Death>:
      _Value: 2.25
      A: 0 Actions
      Cooldown: Once / Adventure
      Requirement: Only usable on Units with 50% or more Health
      Tags: [Ultimate, Farming]
      Effect: |
        Challenge a non-Epic Worthy Enemy to a duel to the death!
        The two of you take Turns one after another until one of you reaches 0 Health.
        Neither of you can move away from eachother until the duel is over.
        If you win, roll on the table to permanently improve your Hero!
      DoubleTable:
        Values:
          - 1. +1 Skill Point
          - 2. +0.5 Initiative
          - 3. +2 Maximum Health
          - 4. +1 Health Regen
          - 5. +0.5 Movement Speed
          - 6. +20% Gold from what you're carrying
      Notes: First, you continue your Turn; then the Enemy has its turn. After the duel is over, resume Turn order, as if you just finished your Turn. All of these Turns happen on the same Round, as if in a vaccuum (e.g. Round number does not increase for some effects' purposes).

    <Dry Gulch>:
      IconName: Dashing Beauty
      A: 0 Actions
      Cooldown: Once / Turn
      Tags: [Damage]
      Effect: Your next attack deals extra Damage equal to 50% of how many meters you moved this Round.

    ~Drunken Bluff~:
      A: Passive
      Effect: |
        After you roll an attack this Combat, you can make it miss on purpose.

        Whenever you miss or do 0 Damage with an attack, your next one deals +1d8 Damage this Combat.

    ~Steady Hands~:
      A: Passive
      Effect: |
        Your multi-dice attacks that miss if they roll 1 on any of the dice now miss if they roll 1 on ~at least two~ of the dice.

  Level 4 Class Talent:

    ~Off-Hand Shank~:
      A: Half-Action
      Cooldown: Once / Turn
      Cost: 1 Mana
      Effect: Make 3 attacks with a one-handed weapon you haven't used this Turn that would normally scale with a Stat. These attacks do not add any Stat to the Damage, and miss if they roll 1 on any of the dice.
      Upgrade: |
        You may apply Sharp End, Blood in the Water, or similar effects to individual attacks.
      Notes: If the weapon jams or breaks, it does so after you finish the attacks.

    ~Second Wind~:
      A: 0 Actions
      Cost: 1 Mana
      Cooldown: Once / Turn
      Effect: Gain +Half-Action and a ~Combo~. This Turn, all your Acts miss if they roll 1 on any of the dice.
      Downside: Only usable as your first Act on a Turn.

    ~Circle Round~:
      A: 0 Actions
      Effect: Slam the target 1d6 meters away from you. Then, if the space is not blocked, you can dash behind it.
      Downside: Only usable immediately after a Blood in the Water attack.
    
    <Swing Thing>:              # 2 uses = 2 Charges
      _Value: 2.25
      A: Reaction
      Range: 5 meters
      Effect: |
        Use when a Unit within 5 meters (or yourself) becomes affected by a Status Effect.
        Slam it 1d8 meters in any direction.
      Notes: |
        Requires a Whiplash item, which can be bought for 50 {Gold}Gold (or freely crafted for the same price in materials).

    <Momentum Dance>:     # 3
      A: 0 Actions
      Cost: 1 Mana
      Effect: |
        Gain 1 Shielding equal to your 400% of your Initiative.

  Level 5 Class Talent:

    <High Noon>:
      _Value: 3
      A: 1 Action
      Cooldown: Once / Adventure
      Tags: [Damage, Ultimate]
      Requirement: Only usable on the 3rd Round of Combat
      Effect: |
        Make 6 attacks with a one-handed ranged weapon, which miss if they roll 1 on any of the dice.
        Further High Noon attacks on the same Unit (after the first) deal -50% Damage.
      Notes: Each attack may miss individually, not all at the same time.

    <Exude Damage>:
      _Value: 2.25 # (?)
      A: Passive
      Tags: [Mass Damage]
      Effect: Your first offensive melee Act every Turn deals Damage equal to your Movement Speed to all other Units within 2 meters of the main target.
      Notes: Excluding the main target and yourself.

    ~Sharp and Pointy End~:
      _Value: 1.5   # Because it replaces the original one and it's much better
      A: 0 Actions
      Cost: 1 Mana
      Replacement: Replaces Sharp End
      IconName: Sharp End
      HasUpgradeIcon: true
      Effect: |
        ~Use after you landed an offensive attack or Ability.~
        ~Add~ +1d4 Damage and trigger its {Color('var(--green-color)' 'Critical Strike')} and ~Combo~ effect anyway!
      Upgrade: If it can not {Color('var(--green-color)' 'Critically Strike')}, it also deals +1d4 Damage and counts as a {Color('var(--green-color)' 'Critical Strike')} anyway.

    ~Switcheroo~:
      A: Passive
      Effect: |
        After you deal at least 10 Damage with a {Type1} attack, your next {Type2} attack this Turn deals +1d4 Damage.

        ~Both Variants can trigger one after another.~
      Variants:
        - Type1: melee
          Type2: ranged
        - Type1: ranged
          Type2: melee


  Level 6 Utility Talent:

    ~Been There Done That~:
      A: Passive
      Effect: |
        Once per Adventure, you can introduce an _actually fact_ without spending a Plot Point.

    ~Loan Shark~:
      A: 1 minute
      Cooldown: Twice / Adventure
      Effect: |
        Loan a non-playable character anywhere between 100 and 500 {Gold}.
        After a set amount of time, you get it back with 1d100 interest.
        If the interest is 9% or less, you get nothing back.

    ~Fold~:
      A: 0 Actions
      Cooldown: Once / real hour
      Effect: |
        Use after you learn the result of a _random_ choice determined by the Quest Master. You can force the Quest Master to draw a different result.
      Notes: For example, when you would get random loot, a random shop or upgrade, a random encounter, etc you can use this Ability to get a different one.

    ~Blackcheck~:
      A: 0 Actions
      Tags: Roleplaying
      Cooldown: Once / real hour
      Effect: |
        Use after you failed a {Charisma} Check (that you could have passed) to play _Blackcheck_ with the Quest Master.
        The Quest Master tells you the required number to pass.
        Starting from your rolled Check result, you may roll 1d6 again and again, one after another, to try to get exactly the required number to succeed. If you go above that number, you fail.

  Level 7 Class Talent:

    ~Weighted Coin~:
      A: 0 Actions (or Reaction)
      Cost: 1 Mana
      Effect: |
        Use after a die is rolled.
        Increase or decrease it by 1.
    
    ~Ace in the Sleeve~:
      A: 0 Actions
      Cost: 2 Mana
      Cooldown: Once / Turn
      Effect: |
        Make a melee weapon attack that misses.
        The target becomes Dazed, Lagged, and Deafened, lasting until they do those Acts.
      Notes: Normally, Status Effects last at most 1 Turn. For example, if you Deafen a Unit, the Deafen lasts until they use an Ability.

    ~Hit-and-Run~:
      A: 0 Actions
      Cost: 1 Mana
      Effect: |
        Immediately dash to where you began your Turn.

    ~Hold It Partner~:
      A: 0 Actions
      Cost: 3 Mana
      Cooldown: Once / Adventure
      Effect: |
        Choose an ally.
        This Turn, whenever you land a {Green('Critical Strike')}, ~Combo~, Blood in the Water attack, or miss an attack against a Unit, that Ally can also make a 1 {A}Action Point Act against that Unit.

    ~Keelhaul~:
      A: 0 Actions
      Cooldown: Once / Turn
      Effect: |
        Make a free Movement Act, then you become Lagged.

  Level 8 Class Talent:

    ~Eye for an Eye~:
      A: Reaction
      Effect: |
        Use after you take 0 Damage or an attack against you misses.
        You can immediately attack the attacker, if within range, with a 1 {A}Action Point attack.
    
    ~Perfect Setup~:
      A: Passive
      Effect: |
        Whenever you trigger a ~Combo~, you can deal 1d6 Damage to the target, or Heal another Unit you can see for 1d6.

    ~Gallows Shock~:
      A: Passive
      Effect: |
        Your attacks that trigger both a {Green('Critical Strike')} and a ~Combo~ Double-Stun the target.

    ~Abstain~:
      _Value: 2.75
      A: Passive
      Effect: |
        After you roll a Blood in the Water attack, you can force it to not gain extra Damage, and you gain +1 {A}Action Point.

    ~Wanted Poster~:
      A: Passive
      Effect: |
        At the start of each Combat, one random Enemy becomes _Wanted_. The first attack against a _Wanted_ enemy triggers its {Green(Critical Strike)}, if any.
        When it die, you have 50% change to gain {Gold}Gold equal to its Max Health.


  Level 9 Class Talent:

    ~Smoke and Mirrors~:
      _Value: 3.75   # On average a 7th of all Damage, which is a 7th of your max HP + Regen = ~12 HP
      A: Passive
      Effect: |
        You automatically dodge all* direct Damage instances that roll 1 on any of the dice against you.
      Upgrade: Monsters must make the die roll against you instead of taking the average.
      Notes: If it makes sense to dodge it, you can dodge it. You can't dodge Damage over time, stepping on obstacles, etc.

    ~Sharks in the Water~:
      A: Passive
      _Value: 3.75 # trigger it once per combat, though not at full potential
      Replacement: Replaces Blood in the Water
      Effect: |
        If your last 2 offensive Acts both either triggered a {Color('var(--green-color)' 'Critical Strike')} or a ~Combo~, your next targeted {Type} {A}Action Point Act deals +{Amount}% Damage.
        
        {Variants}
      Variants:
        - Type: 1
          Amount: 200
        - Type: 2
          Amount: 100
    
    ~Devil's Bargain~:
      A: Passive
      Effect: |
        After you spend {Mana}Mana, roll 1d10.
        If you roll 4 or more, replenish 1 {Mana}Mana. Otherwise, the Act misses.

    ~Play Both Sides~:
      A: Passive
      Effect: |
        You can start Combats on the enemy side of the battlefield.
        If you do, you gain an extra free Turn. All Damage you deal to your Hero party members on this free Turn is also dealt to an enemy of choice, and vice-versa.

    ~Omertà~:
      A: Passive
      Effect: |
        Your regular* weapon attacks that don't trigger a {Green(Critical Strike)}, ~Combo~, or Blood in the Water always miss. The others always deal +1d12 Damage.
      Upgrade: Regular attacks refer to standard attacks not done through Abilities and not empowered by Abilities.

  Level 10 Class Talent:

    One Man Show:
      A: Passive
      Effect: |
        While outnumbered, you start your Turns with an extra {A}Action Point for each extra Worthy Enemy outnumbering your party.

        Also, passively, you gain +1 {Charisma} and +1 Damage on every Damage instance you deal.
      HasMixins: true
      Downside: "{Heroic}"

    Acrobatix Bellatrix:
      A: Passive
      Effect: |
        Gain +15 Movement Speed and your first attack every turn gains +1 Damage for every meter moved.

        You automatically pass all Hard {Dexterity} Checks (that require at least 15). Go be like an arrow in the wind!
    


