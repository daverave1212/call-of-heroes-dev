Utility:

  ~Coming Down Swinging~:
    A: 0 Actions
    Cooldown: Once / real hour
    Effect: |
      You automatically find a chandelier, rope, vine, or something similar to swing on, even if the room shouldn't logically have one.
      Reposition up to 4 meters away.

  ~Wink~:
    A: 0 Actions
    Tags: Roleplaying
    Cooldown: Once / real hour
    Effect: |
      Use after you failed a {Charisma} Check (that you could have passed) to play _Blackcheck_ with the Quest Master.
      The Quest Master tells you the required number to pass.
      Starting from your rolled Check result, you may roll 1d6 again and again, one after another, to try to get exactly the required number to succeed. If you go above that number, you fail.

  ~Daring Leap of Logic~:
    A: Passive
    Effect: |
      The first time you want to perform a Stunt every Adventure, it has +50% effect (in addition to other bonuses), but only if it's really awesome.
      You must commit to the first idea if the Stunt is approved by the Quest Master, even if it's not that awesome.
    Notes: Its awesomeness depends on the Quest Master.

  ~I Know This Guy~:
    A: 0 Actions
    Cooldown: Once / real hour
    Effect: |
      Use when in a town or hub to add 1d4 to an {Intelligence} Check, to bring up a reason as to why you know extra details about it. It can be about a particular subject you've encountered before, a person you know there, etc.
    Upgrade: Come up with a story on why you are already familiar with that subject matter!

Starting Abilities Description: Try to land Critical Strikes one after another! And make sure you use weapons that allow for Critical Strikes.
Starting Abilities:

  ~Bravado~:
    A: Passive
    _Value: 2.25 # trigger it once per combat, though not at full potential
    Effect: |
      If your last 2 offensive Acts both either triggered a {Color('var(--green-color)' 'Critical Strike')} or a ~Combo~, your next {Type} deals +{Amount}% Damage.
      
      {Variants}
    Variants:
      - Type: one-handed weapon attack
        Amount: 100
      - Type: two-handed weapon attack
        Amount: 50

  ~Sharp End~:
    _Value: -0.5
    A: 0 Actions
    Cost: 1 Mana
    Effect: Your next offensive attack or Ability deals +1d4 Damage and triggers its {Color('var(--green-color)' 'Critical Strike')} and ~Combo~ effect anyway!
    Upgrade: If it can not {Color('var(--green-color)' 'Critically Strike')}, it also deals +1d4 Damage and counts as a {Color('var(--green-color)' 'Critical Strike')} anyway.

Talents:

  Level 1 Class Talent:

    ~Hack and Slash~:
        A: 0 Actions
        Cost: 1 Mana
        DisplayName: "{Name}"
        Tags: [Area Damage]
        Effect: |
            Your next {Effect}
            
            {Variants}
        Notes: |
            Roll the attack only once. Weapon effects (like Critical Strikes), if necessary, are applied to the main target only.
        Variants:
            - Name: Hack and Slash
              Effect: melee 2-handed weapon attack also hits all other Units within weapon range, but deals -50% Damage to them (deals normal Damage to the main target).
              IconName: Hack and Slash
            - Name: Slice and Dice
              Effect: melee 1-handed weapon attack also hits all other Units within weapon range.
              IconName: Slice and Dice
            - Name: Lock and Load
              Effect: ranged 2-handed weapon attack also hits all other Units 1 meter from the main target, but deals -50% Damage to them (deals normal Damage to the main target).
              IconName: Lock and Load
            - Name: Point and Shoot
              Effect: ranged 1-handed weapon attack also hits all other Units 1 meter from the main target.
              IconName: Point and Shoot

    <Deflect>:
      A: Reaction
      Cost: 1 Mana
      Effect: Reduce the Damage of a weapon attack you or a Unit near you receives by 100%.
      Tags: [Defense]
      Notes: Works for ranged weapons. Melee body parts are considered weapons.

    ~Fame Time~:
      A: 1 Action
      Cost: 1 Mana
      Requirement: Only usable in Worthy Combat
      Tags: [Gold]
      Effect: |
        For the rest of the Combat, gain 25 {Gold} whenever you use an Action Point.

    ~All or Nothing~:
      A: 0 Actions
      Requirement: Only usable in Worthy Combat
      Effect: |
        Add 1d6 to an attack's Damage. If the total is _odd_, the attack misses, but you Heal for 1.


  Level 2 Class Talent:

    ~Overunder Blow~:
      Value: 0.5
      Bonuses:
        Intellgience: 1
      A: Passive
      Effect: |
        You have +1 {Intelligence} (up to your Stat Limit).
        Instead of dealing extra Damage with Bravado, do one of the following:
      SingleTable:
        - 1. Heal yourself for that amount
        - 2. Single-Stun the target (Double-Stun for two-handed weapons)
        - 3. Freely move that many meters
        - 4. Push the target that many meters
      Notes: Pushing only works on non-Epic Units.

    <At Me!>:
      _Value: 1.5 # But seems inconsistent, so I really don't know
      A: Passive
      HasMixins: true
      Effect: |
        After landing 2 non-Critical Strikes in a row on a Unit, inflict a random Crowd Control from the following options. Then the Unit becomes immune to ^At Me!^ for the rest of the Combat.
        {Diamond} 1. Slow
        {Diamond} 2. Blind
        {Diamond} 3. Deafen
        {Diamond} 4. Daze
      Upgrade: If they were both with a 2-handed weapon, the Crowd Control applied is doubled (Double-Slowed, Double-Blind, etc)!

    <10 Percent Luck>:
      _Value: 2
      A: 0 Actions (or Reaction)
      Cooldown: Once / Turn
      Effect: Reroll one die you just rolled.

    ~Came To Collect~:
      A: Half-Action
      Cooldown: Once / 2 Turns
      Effect: |
        Use a ranged weapon to shoot a Worthy Unit for 1d4 Damage.
        Then, if it died, choose a permanent upgrade for this Ability from below.
      SingleTable:
        - 1. Dice Upgraded to the next die type
        - 2. Cooldown improved*
        - 3. Gain Gold equal to 1000% of the rolled Damage
        - 4. Restores 1 Health on use
      Notes: |
        Cooldown improved follows the following pattern, starting from the base Cooldown: Once / 2 Turns, Once / Turn, Twice / Turn, Thrice / Turn, etc.

  Level 3 Class Talent:

    ~Strafe and Backpedal~:
      A: Passive
      Tags: [Crit]
      Effect: After you move 2 times on the same Turn, your next weapon attack triggers its Critical Strike regardless.

    <Duel To Death>:
      _Value: 2.25
      A: 0 Actions
      Cooldown: Once / Adventure
      Requirement: Only usable on Units with 50% or more Health
      Tags: [Ultimate, Farming]
      Effect: |
        Challenge a non-Epic Worthy Enemy to a duel to the death!
        The two of you take Turns one after another until one of you reaches 0 Health.
        Neither of you can move away from eachother until the duel is over.
        If you win, roll on the table to permanently improve your Hero!
      DoubleTable:
        Values:
          - 1. +1 Skill Point
          - 2. +0.5 Initiative
          - 3. +2 Maximum Health
          - 4. +1 Health Regen
          - 5. +1 Movement Speed
          - 6. +20% Gold from what you're carrying
      Notes: First, you continue your Turn; then the Enemy has its turn. After the duel is over, resume Turn order, as if you just finished your Turn. All of these Turns happen on the same Round, as if in a vaccuum (e.g. Round number does not increase for some effects' purposes).

    <Dashing Beauty>:
      A: Passive
      Tags: [Damage]
      Effect: Your first attack every Turn deals extra Damage equal to 50% of how many meters you moved this Round.

