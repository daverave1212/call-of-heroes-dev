Class: Rogue
Description: |
  A hush falls over the bustling city square as a fat pig adorned in a lavish display of gold and diamonds walks around the corner, accompanied by a pair of brutish lackeys, oblivious to the imminent danger lurking in the shadows. concealed within his pocket rests a scroll containing privileged information for his eyes only, or so he believes. Now! A shadowy figure descends upon them, a poisoned blade finding its mark in the unsuspecting guard's back. Swift and precise strikes to the legs, a tap on the shoulder and a trick of the shadows renders the swine isolated in the dim alley. Flee, little pig, and squal in vain - your cries fall upon deaf ears.
  It is finished. A message stolen, and one conveyed. From whom? That is for the little pig and his friends to determine. After all, it was the quickest way for him to lose weight; he'll have an easier time trotting home.
  Rogues are masters of the shadows who focus on subtlety, teamwork or direct combat. While they don't directly cast magic, they can train in the strange arts of shadow techniques - scholars debate wether this is a form of the arcane, psionics or a mere trick of the light. Only rogues know.

Quick Note: Rogues are masters of the shadows who focus on subtlety, teamwork or direct combat. While they don't directly cast magic, they can train in the strange arts of shadow techniques - scholars debate wether this is a form of the arcane, psionics or a mere trick of the light. Only rogues know.

Armor Training: Light Armor

Weapons: You are Trained in 2 Weapon Categories of choice (e.g. 1-Handed Melee, 2-Handed Ranged, Shields, etc).

Difficulty: Easy

Language: |
  You know Doublespeak! Doublespeak is not exactly a language, but a way to carry out private conversations in public by using code words and phrases with double meaning, such that what you say is indistinguishable from a normal conversation. Doublespeak also has a written version; thieves, rogues and streetspeople might use deliberate writing mistakes, punctuation errors or scratch marks on buildings to warn or convey concepts or even entire sentences; these markings are indistinguishable from random scratches to the unaware. Doublespeak is an art in itself - even if every doublespeaker has their own mannerisms and idiosyncracies, one must know and recognize the patterns to be able to speak this language properly, and as such, some even consider it a poetic "language".


Level Up:
  Every Level: 
    Health: 4


Spellcasting:
  Type: Rogue
  SpellsOrAbilities: Ability

  Mana:
    Regain: As a Hunter, you don't use Mana. You rely on weapons, class Abilities and simple Basic Spells.

  Change: You can change your known Spells and Talents inbetween Adventures.
  Other: All Rogue-specific Abilities are not considered Spells (unless stated otherwise).

  Known Basic Abilities: 2 + Intelligence (minimum 1)
  BaseKnownSpells: 2



Utility:

    ~Bells and Whistles~ :
        A: 10 minutes
        Duration: 24 hours
        Cooldown: 24 hours
        Degree: Lesser
        Effect: |
            You setup an invisible 6x6x6 meter area.
            If an unknown Unit or Enemy enters the cube, you are immediately alerted and woken up.
            While inside the area, ^YOU^ cannot be Surprised.

    ~Camping~:
        A: 5 minutes
        Cooldown: Once / in-game day
        Effect: |
            Setup camp, creating favorable conditions for your party for up to 8 in-game hours.
            Units in the camp are protected from all bad weather and are immune to being poisoned by food.
            Until the end of the Adventure, all Units who camped here are immune to Hard Terrain.
    
    ~Doublesault~:
        A: 0 Actions
        Cooldown: Once / Adventure
        Degree: Major
        Effect: |
            Leap up to 3 meters. If you land on a Unit, Doublesault again (for free)!
        Notes: |
            You leap from Unit to Unit until you no longer land on a Unit. If you land on a Unit, you must leap again. You can't leap on the same Unit twice; if you do, you end your leap in the closest space near it.
            You can use this even while in the air and it cancels out your current fall or acceleration.            

    ~Gladiator Grandeur~:
        A: Half-Action
        Cooldown: Once / Combat
        Degree: Minor
        Effect: |
            Push a Worthy Enemy 1 meter in any direction. Gain {Gold}Gold equal to the enemy's Experience Worth.
        Upgrade: Epic Monsters award {Gold}Gold equal to their Experience Worth / Epic Grade.

Starting Abilities:

  ~Isolated Ambush~:
    _Value: 5
    AlignOnWebsite: Right
    A: Passive
    HasMixins: true
    Replacement: Replaces Ambush
    Effect: |
      Every ~Turn~, your first ~attack or single-target offensive Ability against an isolated Unit~ deals +1d8 Damage.
    Upgrade: A Unit is _isolated_ if there are no other Units (except you) within 1 meter of it.

  ~Stalk 'n' Parry~:
    _Value: 1.5
    A: Special
    HasMixins: true
    Replacement: Replaces Stalking
    Effect: |
      On the first Round of combat, you can skip your Turn.
      Then, you can start your Turn whenever you like (even during enemies' turns)!
      ~Until then, reduce any weapon attack's Damage on you by 1d6.~
    Notes: |
      If you want to start during an enemy's Turn, you do so when they declare they want to do something or after they finish doing something.
      Be careful: if you don't start your Turn this Round, you lose your Turn!


Talents:
  Level 3 - Keystone Talent:

    <Duel To Death>:
      _Value: 2.25
      A: 0 Actions
      Cooldown: Once / Adventure
      Requirement: Only usable on Units with 50% or more Health
      Effect: |
        Challenge a non-Epic Worthy Enemy to a duel to the death!
        The two of you take Turns one after another until one of you reaches 0 Health.
        Neither of you can move away from eachother until the duel is over.
        If you win, roll on the table to permanently improve your character!
      DoubleTable:
        Values:
          - 1. +1 Known Ability
          - 2. +2 Initiative
          - 3. +4 Maximum Health
          - 4. +2 Health Regen
          - 5. +1 Movement Speed
          - 6. +1 Ambush Damage
      Notes: First, you continue your Turn; then the Enemy has its turn. After the duel is over, resume Turn order, as if you just finished your Turn. All of these Turns happen on the same Round, as if in a vaccuum (e.g. Round number does not increase for some effects' purposes).

    <Critical Doubledown>: Inherit

    <Swing Thing>:              # 2 uses = 2 Charges
      _Value: 2.25
      A: Reaction
      Range: 6 meters
      Effect: |
        Use when a Unit within 6 meters becomes affected by Crowd Control of any type except Slow.
        Deal 1d10 Pierce Damage to it and push it up to 3 meters in any direction.
      Notes: |
        Requires a Whiplash item, which can be bought for 50 gold (or freely crafted for the same price in materials).
  
  Level 4 - Minor Talent:

    <10 Percent Luck>:
      _Value: 1
      A: Passive
      Effect: Once per Round, when you roll a 1 for a Damage die, you can reroll that die.
      EffectGreen: When you get this, gain +1 in a Stat of choice, up to +4.

    <Cutting Verve>: Inherit

    <Opportunity Attacks>:
      _Value: 0.75
      A: Reaction
      Effect: |
        When an enemy moves 1 or more meters away from near you, you can make a free attack on them with a 1-Handed Melee Weapon.
      Notes: If you don't have a 1-Handed Weapon equipped, you automatically freely equip one, attack with it, unequip it and equip what you previously had.
      EffectGreen: When you get this, gain +1 in a Stat of choice, up to +4.

  Level 5 - Keystone Talent:

    <High Noon>:
      _Value: 3
      A: 1 Action
      Cooldown: Once / Adventure
      Requirement: Only usable on the 3rd Round of Combat
      Effect: |
        Make 6 attacks with a one-handed ranged weapon.
        Further High Noon attacks on the same Unit (after the first) deal 50% less Damage.

    <Exude Damage>:
      _Value: 2.25 (?)
      A: Passive
      Effect: Your first melee attack every Turn deals Damage equal to your remaining Movement to all other Units within 1 meter of the main target.
      Notes: Excluding the main target and yourself.

    <Deflect>:
      _Value: 4.5
      A: Reaction
      Cooldown: Once / Combat
      Effect: Reduce the Damage of a weapon attack you receive by 100%.
      Notes: Works for ranged weapons. Melee body parts are considered weapons.

  Level 6 - Utility Talent:

    <Puncture Wounds>:
      _Value: 3
      A: Passive
      Effect: |
        Whenever you Ambush a Unit you haven't Ambushed this Combat, heal an ally you can see (or yourself) for the number of Worthy Enemies in the Combat.
      EffectGreen: When you get this, gain +1 in a Stat of choice, up to +4.

    <Long Stalk 'n' Parry>:
      _Value: 3
      A: Special
      Replacement: Replaces Stalk 'n' Parry
      HasMixins: true
      Effect: |
        On the first Round of combat, you can skip your Turn ~and until the end of the second Round of Combat, reduce any weapon attack's Damage on you by 1d6.~
        Then, you can start your Turn whenever you like (even during enemies' turns)!
      Notes: |
        If you want to start during an enemy's Turn, you do so when they declare they want to do something or after they finish doing something.
        Be careful: if you don't start your Turn this Round, you lose your Turn!
      EffectGreen: When you get this, gain +1 in a Stat of choice, up to +4.

    <At Me!>:
      _Value: 2 (but it's inconsistent)
      A: Passive
      HasMixins: true
      Effect: |
        After Ambushing a Unit 2 of your Turns in a row, inflict a random Crowd Control from the following options. Then the Unit becomes immune to ^At Me!^ for the rest of the Combat.
        {Diamond} 1. Blind
        {Diamond} 2. Silence
        {Diamond} 3. Fear
        {Diamond} 4. Cripple
      EffectGreen: When you get this, gain +1 in a Stat of choice, up to +4.

  Level 7 - Keystone Talent:

    <Critical Ambush>:
      A: Passive
      Effect: Your Ambushes deal +50% Damage instead of the regular bonus Damage.

    <Minor Sudden Ambush>:
      A: Passive
      HasMixins: true
      Effect: |
        Every Worthy Combat, your first weapon attack deals 1d6 + 1d8 extra Damage.

    <Minor Savage Ambush>: Inherit

    <Minor Icebreaker Ambush>: Inherit

  Level 8 - Minor Talent:

    <Swashbuckle>:
      _Value: 2.25
      A: Passive
      Effect: Gain +3 Movement Speed.
      EffectGreen: When you get this, gain +1 in a Stat of choice, up to +5.

  Level 9 - Keystone Talent:

    <Finale>: Inherit

    <Momentum Dance>:     # 3
      A: 0 Actions
      Cooldown: Once / Adventure
      Duration: 1 minute
      Effect: |
        Gain Shielding equal to your current Initiative in combat.

  Level 10 - Ultimate Talent:

    One Man Show:
      A: Passive
      Effect: |
        While outnumbered, you start your Turns with an extra Half-Action for each extra Worthy Enemy outnumbering you.

        Also, passively, you gain +1 Presence and +1 Damage on every Damage instance you deal.
      HasMixins: true
      Downside: "{Ultimate}"

    Acrobatix Bellatrix:
      A: Passive
      Effect: |
        Gain +15 Movement Speed and your first attack every turn gains +1 Damage for every meter moved.

        You automatically pass all Hard Dexterity Checks (that require at least 15). Go be like an arrow in the wind!
    


