
Class: Sorcerer
Description: |
  You step inside the magic circle, and an incantation of fire, frost, and lightning begins. The figure with robes and glowing eyes moves around, raw energy emanating from their palms. A book lays open on the floor, pages flipping themselves and shifting through bright violet runes. The circle is abruptly broken, and the magic stops, as you notice the Sorcerer caressing his beard, eyes all on you. Did the spell fail? Could this be a mistake? An error in the code of arcane? Sorcerers work in mysterious ways...
  You are magic: not a student of it, not a wielder of it. Magic is your blood, your breath, your pulse.
  Where wizards study and warlocks bargain, you erupt. Your power doesn’t ask permission. It happens.

Quick Note: |
  You are magic: not a student of it, not a wielder of it. Magic is your blood, your breath, your pulse.
  Where wizards study and warlocks bargain, you erupt. Your power doesn’t ask permission. It happens.

Difficulty: Easy
 
Weapons: You are Trained in a Weapon Category of choice (e.g. 1-Handed Melee, 2-Handed Ranged, etc).


# Idea: What is the Sorcerer class fantasy?
# Idea: Summon a wizard's tower
# Idea: You become a dragon
# Idea: You become an ethereal being of pure magic
# Idea: Stop time for a few seconds (you literally get a free turn xD)
# Idea: Cast Spells that cost 2+ Charges with -1 Charge
# Idea: Create bombs
# Idea: Chronomancy - gain some chronomancy spells, like Slow (which limits Epics to 1 turn too)


Level Up:
  Every Level: 
    Health: 5

Spellcasting:
  Type: Mana-based
  SpellsOrAbilities: Spell

  Mana:
    Amount: 3
    Regain: You regain all Mana back inbetween Adventures.
    Per: per Adventure

  Change: You can change your known Spells and Talents inbetween Adventures.
  Other: All Sorcerer-specific Abilities are considered Spells (except Magic Mastery).
  Known Basic Abilities: 3 + Intelligence (minimum 1)
  BaseKnownSpells: 3



Starting Abilities:

  ~Unstable Spark~:
    _Value: 1.5
    A: Passive
    HasMixins: true
    Effect: |
      At the start of your every Turn in a Worthy Combat, roll 1d10.
      If you roll 1, you take 1d6 True Damage.
      If you roll 10, your next Spell this Turn has +50% Damage.

  ~Overcharge~:
    A: 0 Actions
    Cooldown: Once / Turn
    Requirement: Only usable in Worthy Combat
    Effect: Roll an Unstable Spark die.
  
  ~Flux~:
    A: Passive
    Effect: Choose a Damage Type from the ones listed below. Some of your Spells's Damage deal that Damage Type (written explicitly on those Spells).
    Notes: 1. Fire, 2. Cold, 3. Shock, 4. Pulse, 5. Poison, 6. Acid, 7. Divine, 8. Scourge.


Ability Choices:

    ~Gathering the Magic~:
      A: 0 Actions
      Cost: 1 Mana
      Requirement: Only usable in Worthy Combat
      Effect: |
        For the rest of the Combat, whenever you roll 3 on the Unstable Spark die, gain +1 Skill Point permanently.


    ~Arcane Fire~:
      A: Half-Action
      Requirement: Only usable in Worthy Combat
      Effect: |
        Your next weapon attack until the end of your next Turn deals extra Damage equal to your Highest Stat.
        The attack's Damage Type becomes of your chosen Flux Type.

    ~Spellbloodweave~:
      A: 0 Actions
      Cost: 1 Mana
      Effect: Your next attack or offensive Spell deals -50% Damage, but heals an ally you can see for the Damage dealt.



Utility:

  ~Fracture Reality~:
    A: 0 Actions
    Cooldown: Once / Adventure
    Effect: |
      Lightly alter reality to change a small detail in a story or environment that does not have large consequences. All other characters believe it didn't change, and it's always been like that.
    Upgrade: This may not be the right time to fracture reality, and it's possible your request does not happen.
    Notes: They can be _Mandela effect_ events such as changing the color of an object, a character placing something in a different room, you having bought a certain item that you didn't buy. Ask the Quest Master if your request fits!

  ~Flash~:
      A: Reaction (or 0 Actions)
      Cost: 1 Mana
      Cooldown: Once / Turn
      Degree: Minor
      Requirement: Level 3
      Font: [Chaos, Arcane]
      Effect: Instantly teleport up to 5 meters away, within line of sight.
      Notes: You take with you all items carried. Does not work if you're Rooted or stuck in place somehow.

  ~Magic Tricks~:
      A: 1 Action
      Range: 3 meters
      HasMixins: true
      Degree: Lesser
      AlignOnWebsite: Right
      Effect: |
          Choose one of these effects to cast:
          {Diamond} Create harmless sensory effects, sparks or non-damaging heat or cold.
          {Diamond} Channel to create simple, small, harmless illusions in your hand or within 3 meters.
          {Diamond} Instantly clean or soil objects.
          {Diamond} Control a quill with telekinesis to quickly write with it.
  
Talents:
  Level 2 - Keystone Talent:

    <Guiled Casting>:
      _Value: 0.5
      A: Passive
      AlignOnWebsite: Left
      Effect: |
        When you roll 2 on the Unstable Spark die, after taking the Damage, you deal +1 Damage of a random Damage Type _permanently_ as long as you have this Talent.
      Notes: 1. Fire, 2. Cold, 3. Shock, 4. Pulse, 5. Poison, 6. Acid, 7. Divine, 8. Scourge.

    <Mild Casting>:
      _Value: 0.5
      AlignOnWebsite: Left
      A: Passive
      Effect: |
        After you cast a Spell or one of its variants, you can't cast that spell or variant again this Combat.
        Your base Unstable Spark also triggers on 9.
      Notes: If you cast the 1st version Soulflare, you can still cast its other versions this Combat.

    <Viled Casting>:
      A: Passive
      AlignOnWebsite: Left
      Effect: 
        All non-physical Damage you deal becomes Eldritch Damage.
        When you roll 2 on the Unstable Spark die, increase all Eldritch Damage you deal for the rest of the combat by 3. Then roll another Unstable Spark die.

    <Sap>:
      _Value: 1
      A: Half-Action
      Range: 10 meters
      AlignOnWebsite: Left
      Effect: |
        A Unit must make a Charisma Roll at least equal to your last rolled Unstable Spark die or be Deafened, Slowed or Dazed (your choice).
      Notes: What are you doing, just pick Wild Casting.


    <Wild Casting>:
      _Value: 0.5
      AlignOnWebsite: Right
      A: Passive
      Effect: |
        When you roll the Unstable Spark die, if you roll 1 or 2, roll 1d20 (after taking Damage on 1). The Quest Master freely casts that Spell from the table below.
        If you rolled 2 on the Unstable Spark die, the effect is negative for your team. Otherwise, it's positive.
        The lower Health you are, the more intense the effect (probably).
      Notes: |
        For example, if you roll 1 and the random Spell is Fire Enchantment, it will be cast on an enemy's weapon if possible (respecting the range). If not possible, then it will be cast on a random, non-Player Character's weapon. If not possible, then it will be cast on a Player Character's weapon. If nothing is possible, nothing happens.
        If an effect can be cancelled or has ongoing effects, you have control of them as if you yourself had cast the Spell.
      SpellTable:
        - Name: 1. Fake Sound
          Effect: A sound is magically created at a point (it can Deafen some Units).
        - Name: 2. Quicksand
          Effect: An 3x3 to 9x9 area becomes Hard Terrain.
        - Name: 3. Conjure Steed
          Effect: A random animal is conjured as a mount for 1 to 5 Units.
        - Name: 4. Force Wall
          Effect: A thin 2x2 to 6x6 transparent wall is created.
        - Name: 5. Obstable Break
          Effect: One or more obstacles or traps are destroyed.
        - Name: 6. Strange Wave
          Effect: 1 to 5 Units are Healed or Damaged for 1d4.
        - Name: 7. Teleportation
          Effect: 1 to 5 Units are teleported 1 to 10 meters.
        - Name: 8. Fog
          Effect: A 3x3 to 9x9 fog cloud is created.
        - Name: 9. Enchanted Weapons
          Effect: 1 to 5 Units have their weapons enchanted (+2 Damage, any element)
        - Name: 10. Invisibility
          Effect: 1 to 5 Units become invisible for 1 to 99 Turns.
        - Name: 11. FULMINATION
          Effect: A 3x3 to 9x9 explosion happens, dealing 2d6 to 6d6 Damage of any element.
        - Name: 12. Fling
          Effect: 1 to 5 objects or items are flung around. If any hits a Unit, deals 1d6 Damage.
        - Name: 13. Thunder Clap
          Effect: All Units within 2 to 6 meters of you take 1d6 to 3d6 Damage (any type).
        - Name: 14. Wilder Casting
          Effect: Roll 2 more times on this table.
        - Name: 15. Reverse Gravity
          Effect: The gravity in a 3x3x3 to 9x9x9 area is reversed.
        - Name: 16. Banish
          Effect: 1 to 3 Units are banished to another plane for 1 Turn. When they come back, they immediately take 1 Turn.
        - Name: 17. Unknowable Health
          Effect: A Unit is healed for 5 to 55 Health.
        - Name: 18. Lightning Strikes Again
          Effect: 1 to 3 Units get any Crowd Control.
        - Name: 19. Nervous System Jolt
          Effect: One Unit permanently gains +1 in a Stat, or +1 to +3 Max Health, Regen or Mana.
        - Name: 20. Resurrection
          Effect: 1 to 3 dead or Fallen Units come back to life (without Exhaustion) with 1 to full Health.

