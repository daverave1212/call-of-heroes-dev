  Level 6 - Utility Talent:


    ~Hearth Recall~:
        A: 10 minutes
        Cost: 2 mana
        Degree: Major
        Range: Up to Intelligence * 100 kilometers
        Effect: |
            You can spend 10 minutes in a place to Bind to it.
            When you use this Ability, channel for 10 minutes to teleport up to 1d6 Allies (and yourself) within 10 meters of you to the bound place.
            You can only have 1 bound place at a time.
        EffectRed: You can teleport more Allies than the rolled die, but the teleportation will have strange side effects or consequences.
