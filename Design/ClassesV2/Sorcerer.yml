Starting Abilities Description:
  - Unstable Spark: |
      As a Sorcerer (or Sorceress), your bread-and-butter feature is the Unstable Spark die: your aim is to have it trigger as many times as possible, and add as many effects to it as you can! Many of your Abilities will make you roll more Unstable Spark dice, which are used in more ways than just determining what effect happens on that number. You'll see!
  - Flux: |
      Whenever you see Flux Type, it just means the element you chose. If you chose Fire, "Flux" means exactly "Fire".


Starting Abilities:

  ~Unstable Spark~:
    _Value: 1.5
    A: Passive
    HasMixins: true
    Effect: |
      At the start of your every Turn in a Worthy Combat, roll 1d10. Apply any effects you have.
      Other Talents will add extra effects to your Unstable Spark die.
      
      {Spark(1)} you take 1d6 True Damage.
      {Spark(10)} your next Spell this Turn has +50% Damage.
    Upgrade: The Color('orange' 'orange d10') icon on a Sorcerer Ability means that effect triggers when you roll that number on the Unstable Spark die.
    Notes: The triggered {Spark(numbers)} may or may not overlap.

  ~Overcharge~:
    _Value: 0
    A: 1 minute
    Cost: 1 Mana
    Effect: Permanently learn one Level 1 Sorcerer Talent.
    Notes: You may use this as many times as you want, until you learn all Level 1 Sorcerer Talents (works for both Utility or Class Talents). The Mana spent is restored inbetween Adventures as usual. You can't replace the permanently learned Spell inbetween Adventures... and why would you, anyway?
  
  ~Flux~:
    A: Passive
    IsIgnored: true
    Effect: Choose a Damage Type from the ones listed below. That becomes your {Color('orange' 'Flux')} Type. Some of your Spells's Damage deal that Damage Type (written explicitly on those Spells).
    Upgrade: |
      1. Fire, 2. Cold, 3. Shock, 4. Pulse, 5. Poison, 6. Acid, 7. Divine, 8. Scourge.
      You can change your Flux inbetween Adventures.


Utility:

  ~Poetic Justice~:
    A: Reaction
    Cooldown: Once / real hour
    ScrollPower: 2
    Requirement: Requires Level 3
    Tags: [Other]
    Effect: |
      At any point where it's fit, you can call for a _poetic justice moment_, representing a living metaphor, turning a situation around, karma, irony, or coming full circle.
      Declare an event you would like to happen that can be interpreted as _poetic justice_, which could be either good or bad for your team.
      Soon, the Quest Master may fumble one die roll or alter the current situation so that it reflects a _poetic moment_, in a way similar to your desire.
    Upgrade: There may be no place for poetic justice at that time, and it's possible nothing happens as the result of this.
    Notes: They can be events such as being saved by your worst enemy, or a xenophobic person being discriminated against by someone else who is xenophobic. Or perhaps a goblin dies by an arrow to the kn-, I mean shoulder, after he launched an arrow in someone else's shoulder.

  ~Fracture Reality~:
    A: 0 Actions
    Cooldown: Once / Adventure
    ScrollPower: 2
    Tags: [Other]
    Effect: |
      Lightly alter reality to change a small detail in a story or environment that does not have large consequences. All other characters believe it didn't change, and it's always been like that.
    Upgrade: This may not be the right time to fracture reality, and it's possible your request does not happen. If so, reset this Ability's Cooldown.
    Notes: They can be _Mandela effect_ events such as changing the color of an object, a character placing something in a different room, you having bought a certain item that you didn't buy. Ask the Quest Master if your request fits!

  ~Superposition~:
    A: Reaction or 0 Actions
    Cost: 1 Mana
    Tags: [Mobility, Other]
    Effect: |
      Use on your Turn, or when a Unit wants to attack you.
      Teleport yourself (or a non-Epic Unit you can see) in a _random direction_ a number of meters equal to your last rolled Unstable Spark die.
    Notes: Roll 1d8 to determine the direction. 1. North, 2. North-East, 3. East, etc. You take with you all items carried. Does not work if you're Rooted or stuck in place somehow.

  ~Magic Tricks~:
      A: 1 Action
      Range: 3 meters
      HasMixins: true
      ScrollPower: 0
      Degree: Lesser
      AlignOnWebsite: Right
      Tags: [Roleplaying]
      Effect: |
