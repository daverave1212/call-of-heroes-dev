
Class: Warlock
Description: |
  Years of dedicated study have yielded results, though the scholarship of the dark arts is not akin to the arcane. Standing before you is a woman who does not manipulate the strings of magic - no, she destroys them, weaving a tunnel of sorts to an unfathomable source of eldrich energy that pulses ominously around her, stirring unease into your soul. Out of nowhere, she laughs, and her features soften into a kind smile directed at you. Despite society's rejection, she is no monster. She, too, is human, with emotions and heart, however dark it may be.
  Warlocks are practicioners of the occult or outer magic and techniques beyond the normal domain. Using a blade, fell magic and even stealing powers away from the enemies, each warlock has its own source for their powers, by study, persuasiveness or pure chance.
  A warlock is a spellcaster attuned to the unknown and bizarre, who only needs to rest inbetween fights, and every encounter wakes the power in them anew - this time, sleep is not for the wicked.

Quick Note: A warlock is a spellcaster attuned to the unknown and bizarre, who only needs to rest inbetween fights, and every encounter wakes the power in them anew - this time, sleep is not for the wicked.

Difficulty: Medium



Level Up:
  Every Level: 
    Max Health: 3
    Health Regen: 2
    Skill Point: 1
    Any Stat (up to the Stat Limit): 1


Spellcasting:
  Type: Special Mana-based
  SpellsOrAbilities: Spell

  Mana:
    Amount: 2
    Regain: Your Mana reset after every combat.
    Per: per Worthy Combat

  Change: You can change your known Spells and Talents inbetween Adventures.
  Other: All Warlock-specific Abilities are considered Spells.

Starting Abilities:

  ~Affiance Casting~:
    A: Special
    AlignOnWebsite: Left
    Effect: |
      Your Max Mana is 2, i never increases, and can't increase except through Warlock Talents.
      Your Mana replenishes after each Worthy Combat.

  ~Evoke~:     # 2?
    _Value: 2
    A: Passive
    HasMixins: true
    AlignOnWebsite: Left
    Effect: |
      You start each Worthy Combat with 0 Evoke Points.
      When you roll at least 1 maximum die on any Act, gain 1 Evoke Point.
      Some Spells can consume all Evoke Points to gain an improved effect ^for each Evoke Point spent^.
      
      Additionally, you have an extra special Talent tier for Evocations.
    Notes: You must spend ^all^ EP when you decide to. You can pick one for free Evocation at Level 1, and get more {LikeNormalTalents}.

Starting Abilities Description:
  - Spending Evoke Points: |
      Note that many of your Spells gain an improved effect when you spend Evoke Points on them, though your Evocations cost 0 Action Points.
      For example, Diverge and Soul Drain both consume Evoke Points, so you can either spend the Evoke Points on Diverge, then cast Soul Drain to hit multiple targets, hoping to get more Max Health or Healing, or you could cast Soul Drain with Evoke Points to make sure you execute the targets!
  - Affiance Casting: |
      Don't forget to spend Mana every Combat! You can't keep Mana from Combat to Combat, so spend it all!
      If you want to spend Mana before a Combat, you will remain with that much Mana in the next Combat.

Other Abilities Title: Level 1 Evocation Talents
Other Abilities Description: You have access to an extra tier of Talents at Level 1 called Evocation Talents. You get one for free, and can get more as if you're getting regular Talents.
Other Abilities:

    ~Diverge~:
      _Value: 0 # Up to 0.75 / EP
      A: 0 Actions
      Requirement: Requires spending Evoke Points
      Effect: |
        {Evoke}: Your next single-target Ability or Attack targets an extra Unit in range per Evoke Point spent, dealing -50% Damage and Healing to the secondary targets.

    ~Overwhelm~:
      _Value: 0 # 1 / EP
      A: 0 Actions
      Requirement: Requires spending Evoke Points
      Effect: | 
        {Evoke}: Your next Ability or Attack Single-Stuns one of the Units hit. For each extra Evoke Point spent, Single-Stun it again.
      Notes: Alternatively, you can Single-Stun one extra Unit that was hit, if your Act hit multiple Units. When increasing the Stun Degree inflicted with an Evoke Point, only increase it for one of the hit Units.
    
    ~Amplify~:
      _Value: 0 # 0.66 / EP
      A: 0 Actions
      Requirement: Requires spending Evoke Points
      Effect: |
        {Evoke}: Your next Ability or Attack has its ^Dice Upgraded^ to the next die type per Evoke Point spent.
      Notes: "{DiceUpgrade}"
    
    ~Obliterate~:
      _Value: 0 # 0.75 / EP
      A: 0 Actions
      Requirement: Requires spending Evoke Points
      Effect: |
        {Evoke}: Your next single-target attack or Spell deals +1d6 Damage on cast, or +1d4 Healing on cast per Evoke Point spent.
      Upgrade: These extra dice can not produce more Evoke Points.
      Notes: If it heals, it does extra Healing. If it deals Damage, it deals extra Damage. If used with Damage over time effects, the extra Damage only happens when you cast the Spell.
    
    ~Transpose~:
      A: 0 Actions
      Requirement: Requires spending Evoke Points
      Effect: |
        {Evoke}: Teleport up to 3 meters away per Evoke Point spent.



