        A: Half-Action
        Range: 5 meters
        Degree: Lesser
        Requirement: Only usable in Worthy Combat
        Tags: [Healing, Damage]
        Effect: |
            Roll 1d12 - 5. After you see the result, choose a Worthy Unit.
            If it's negative, deal Scourge Damage to it. Otherwise, heal it.

            {Evoke}: +50% Damage or Healing per Evoke Point spent.
        Combo: +50% Damage or Healing

    ~Deathfire Flame~:  # Adds insane Damage (+1/EP)
        A: 1 Action
        Cost: 1 Mana
        Range: 10 meters
        Degree: Major
        Tags: Area Damage
        Effect: |
            Shoot a bolt of deathly fire in a 1x10 meter line. All Units it touches take 1d4 + 1d6 + 1d8 Scourge or Fire Damage (your choice).

            {Evoke}: Deals an extra ^higher^ die Damage for each Evoke Point spent.
        Notes: For 1 Evoke Point, deals +1d10 Damage. For 2 spent, deals +1d10 + 1d12. And so on.

    ~Curse of Pain~:  # Adds DoT (+0.5/EP)
        A: 0 Actions
        Cost: 1 Mana
        Range: 5 meters
        Duration: 1 minute
        Requirement: Level 4
        Tags: Damage
        Effect: |
            Choose a Unit. At the start of each of your Turns, it takes 1d4 Scourge Damage (ignoring Cover).

            {Evoke}: Has ^Dice Upgraded^ for each Evoke Point spent.

    ~Psyche Blast~: # Adds CC (+1/EP)
        A: 1 Action
        Range: 3 meters
        Cost: 1 Mana
        HasMixins: true
        Degree: Major
        Tags: [Damage, Crowd Control]
