      A: 1 Action
      Effect: TODO - inherit from Shaman??

  Level 8 Class Talent:

    <Advanced Talent Bonus>:
      HasMixins: true
      Effect: Gain one more Level 3 Talent, ^or^ one more Level 5 Talent.
  
  Level 10 Class Talent:

    <Curse of Domination>:
      A: 1 Action
      Cooldown: One Success / Adventure
      Effect: |
        Choose a Unit you can see. Pass an {Intelligence} or {Charisma} Check at least equal to 5% of its Experience Worth to permanently put it under your control. You can command it telepathically what to and it will do your bidding.
        You can only have one dominated Unit at a time and lasts until the Unit dies, until you dominate another Unit or until you willingly end the curse.
        Also, passively, you gain +3 {Charisma}.
      Upgrade: Failing the Check makes the Unit permanently immune to Hand of Domination and it can sense they resisted an attempt of possession. A dominated Unit has the same combat capabilities and acts like themselves but is essentially a _philosophical zombie_ - they feel no emotion, have no will of their own and manifest little sentiment in their speech and expressiveness. When the Unit stops being dominated, they recall nothing that has happened in that period of time.
      HasMixins: true
      Downside: "{Heroic}"

    <Whispers of Oblivion>:
      A: 0 Actions
      Effect: |
        Gain a Half-Action this Turn and get -1 in a random Stat permanently.
        Upon reaching 0 or less in all Stats, you become permanently possessed by the energies of your power source. Each of your Stats becomes a random of 1d8 permanently.
        Reaching 0 or less in all Stats immediately kills you, and both your and your patron's souls are sent to the other plane forever.
      Upgrade: Your soul is sent into a different plane, according to your patronage. From then on, you have the same body, but you are now your patron for all intents and purposes - in mind, personality and soul.
      HasMixins: true
      Downside: "{Heroic}"
    
    <Mirror Mirror>:
      A: Half-Action
      Cost: 1 Mana
      Duration: 1 hour
      Cooldown: Once / Adventure
      Effect: |
        Summon a clone of yourself on a space within 5 meters. You control the clone and it resembles you perfectly.
        In Combat, the clone acts on your Turn. It has Movement of its own, but will always use its Actions to copy all Basic Abilities and Weapon Attacks you make, on the same target.
      Notes: The clone can't do combat Acts and fine motor skills on its own -- it will always copy yours in parallel.



