
Class: Mystic
Description: |
  Years of dedicated study have yielded results, though the scholarship of the dark arts is not akin to the arcane. Standing before you is a woman who does not manipulate the strings of magic - no, she destroys them, weaving a tunnel of sorts to an unfathomable source of eldrich energy that pulses ominously around her, stirring unease into your soul. Out of nowhere, she laughs, and her features soften into a kind smile directed at you. Despite society's rejection, she is no monster. She, too, is human, with emotions and heart, however dark it may be.
  Mystics are practicioners of the occult or outer magic and techniques beyond the normal domain. Using a blade, fell magic and even stealing powers away from the enemies, each Mystic has its own source for their powers, by study, persuasiveness or pure chance.
  A Mystic is a spellcaster attuned to the unknown and bizarre, who only needs to rest inbetween fights, and every encounter wakes the power in them anew - this time, sleep is not for the wicked.

Quick Note: A Mystic is a spellcaster attuned to the unknown and bizarre, who only needs to rest inbetween fights, and every encounter wakes the power in them anew - this time, sleep is not for the wicked.

Difficulty: Medium

Weapons: You are Trained in 2 Weapon Categories of choice (e.g. 1-Handed Melee, 2-Handed Ranged, Shields, etc).


Level Up:
  Every Level: 
    Max Health: 3
    Mana: 1
    Health Regen: 2
    Skill Point: 1
    Any Stat (up to the Stat Limit): 1


Spellcasting:
  Type: Special Mana-based
  SpellsOrAbilities: Spell

  Mana:
    Amount: 1
    Regain: Your Mana reset after every combat.
    Per: per Adventure

  Change: You can change your known Spells and Talents inbetween Adventures.
  Other: All Mystic-specific Abilities are considered Spells.


Ideas:
  
  ~Amplify DoTs~:
    Effect: yes
  
  ~Clone Monster~:
    Effect: Summon a clone of a monster.
  
  ~Nuh-uh~:
    Effect: Name a thing a Unit can't do on its next turn
  
  ~Possess~:
    Effect: Possess - enemy can't distinguish friend from foe

  ~Swoosh~:
    Effect: Redirect an attack from an ally to an enemy
  
  ~Nope~:
    Effect: Next time target deals Damage, it takes back the same Damage before defense

