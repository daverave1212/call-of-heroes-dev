  Level 6 - Utility Talent:

    ~Shadow Clone~:
        A: 0 Actions
        Cooldown: Once / Adventure
        Range: 10 meters
        Duration: 10 minutes
        Degree: Major
        Effect: |
            You create an illusion of yourself at a target location.
            The illusion has 1 Health and 1 Defense and it fails all Checks.
