  Level 3 - Keystone Talent:

    <Join the Templar>:
      _Value: 4
      A: Special
      Cooldown: Lifetime
      AlignOnWebsite: Right
      Tags: Other
      Effect: |
        A party member pledges to you. They have the Blockade and Silver Grace Abilities.
      Upgrade: Ask a party member to join your cause and pledge their honor to you. Write a set of vows, which your companion must vow to abide to and follow with their life, upon death do you two apart.
      Notes: |
        Only one person can pledge for you and it must within sight or hearing to have access to all of those.
        If you ever change this Talent, the ally loses access to all things mentioned; it regains them when you get this Talent again.

    <Fellowship Aura>:
      _Value: 0.75
      A: Passive
      Effect: |
        You stand out for allies near you.
        Enemy ranged attacks against other allies within 1 meter of you have Cover.
      Notes: Nothing happens if an ally near you already has Cover. If playing on a grid, this does work for allies diagonally.

    <Martyrdom>:
      _Value: 2.25  # But it's quite situational
      A: Reaction
      Cooldown: Once / Adventure
      Effect: |
        Use when an ally (or you) falls to 0 Health.
        Immediately cast Holy Grace (or an upgraded version), ignoring its Cooldown and the Fallen Unit limitation.
      Notes: If that Fallen ally was healed, it Rises without Exhaustion.


  Level 5 - Keystone Talent:

