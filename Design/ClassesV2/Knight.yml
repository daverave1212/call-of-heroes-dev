Other Abilities Title: Level 1 Core Knight Talents
Other Abilities Description: Choose 2 of the following Talent options.
Other Abilities:

    ~Row Through~:
      _Value: 1.5
      A: Depends on weapon
      Cooldown: Once / Turn
      Tags: [Damage, Mass Damage (Valor)]
      Effect: |
        Make a weapon attack with +1 Damage per {A}Action Point spent.
        
        {Teal('After Status Effect:')} Hits one more Unit within 2 meters of the main target with -50% Damage.

    ~Cowards!~:
      A: Half-Action
      Cooldown: Once / Turn
      Range: 2 meters
      Tags: [Protection, Movement (Valor)]
      Effect: |
        Choose a Worthy Unit within 2 meters.
        Give them and yourself a _shared_ 1d6 Shielding.

        {Teal('After Targeted Damage:')} The Range is 5 meters and you dash in front of it.
      Upgrade: The _shared_ Shielding is automatically consumed when _either_ of you takes Damage.
      Notes: |
        This shared Shielding has priority over other Shieldings in reducing Damage.
        In ^front^ of the Unit means on the closest space in front of where they are facing.
        You dash ignoring obstacles. Requires Line of Sight, and dashing requires a mostly ^clear^ path (meaning of ^clear^ up to the Quest Master).
      Tips: |
        In certain situations, you might want to target an Enemy, so you can dash closer to them!

    ~Platinum Storm~:
      A: 1 Action
      ScrollPower: Auto
      Range: Depends on weapon
      Tags: [Mass Damage, Heal (Valor)]
      Effect: |
        Use a weapon to deal 2d4 + 2d6 Damage on a 3x3 meter area, of the weapon's Damage Type.

        {Teal('After Protection:')} Does not Damage Allies, but Heals an ally caught for one of the rolled dice.
      Notes: Each healing d4 must be target a different Ally.

    ~Champion's Gallop~:
      _Value: 1
      A: Half-Action
      Cooldown: Once / Turn
      Tags: [Movement, Status Effect (Valor)]
      Effect: |
        Make a Move Act with +{MS} Movement Speed that can pass through Enemies.
        
        {Variants}

        {Teal('After Mass Damage:')} {Effect}
      Variants:
        - Effect: All Units you pass through are Slammed 2 meters to the side (requires a Trusted Steed).
          MS: '2'
        - Effect: All Units you pass through are Slowed.
          MS: '1'

    ~Blade of Liberation~:
        A: 1 Action
        Cooldown: Once / Turn
        IconName: Liberation
        Degree: Minor
        Range: 3 meters
        Requirement: Only usable in Worthy Combat
        Tags: [Heal, Damage (Valor)]
        Effect: |
            Heal a Unit for 1d8 and remove a Status Effect from them.
            
            {Teal('After Movement:')} Then deal 200% of that die as ^weapon^ Damage to a Unit within 3 meters of you.
        
    ~Provocation~:
      _Value: 1
      A: Half-Action
      Tags: [Status Effect, Protection (Valor)]
      Cooldown: Once / Turn
      Range: 4 meters
      Effect: |
        Slam a Unit 3 meters towards you, or 3 meters away from you.
        
        {Teal('After Healing or being Healed*')} Daze it instead of Slamming, then gain a 1d6 Shielding.
      Upgrade: The {Teal('Valor*')} extra effect may trigger even if you were affected by a Heal on someone else's Turn.



