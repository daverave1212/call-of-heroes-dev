Class: Knight
Description: |
  Behold, a knight clad in armor, commanding the king's army with unvavering determination, his presence inspiring the rallied masses trailing in his wake while striking fear into the hearts of the enemy ranks! A heavy blow of his lance shatters the enemy's defence line, clearing a path for victory. Radiating with divine energy of righteousness and bearing the standard of his allegiance, the Knight fearlessly presses forward, to victory!
  Knights are the knights, the crusaders and the vigilantes who bear divine magic through conviction and purpose, perhaps aided by their god, rather than mastery over the arcane. They are able to both heal, resist damage and fell enemies with holy retribution.
  Be it by the sword, by the shield or by the book, Knights join (or form) an order or community of like-minded individuals, and follow their calling into battle - to attack, to protect, to serve for a greater future.

Quick Note: Knights are the knights, the crusaders and the vigilantes who bear divine magic through conviction and purpose, perhaps aided by their god, rather than mastery over the arcane. They are able to both heal, resist damage and fell enemies with holy retribution.

Weapons: You are Trained in 2 Weapon Categories of choice (e.g. 1-Handed Melee, 2-Handed Ranged, Shields, etc).

Difficulty: Hard


Level Up:
  Every Level:
    Health: 5

Spellcasting:
  Type: Mana-based
  SpellsOrAbilities: Ability

  Spell Grade: 6 + Intelligence, Presence or Presence, whichever is higher
  Mana:
    Amount: 1
    Regain: You regain all Mana back inbetween Adventures.
    Per: per Adventure

  Change: You can change your known Spells and Talents inbetween Adventures.
  Other: All Warrior-specific Abilities are not considered Spells (unless stated otherwise).
  Known Basic Abilities: 2 + Intelligence (minimum 1)
  BaseKnownSpells: 2
  Basic Ability Lists:
    - Bloodshed
    - Warfare

  Recommended Basic Abilities:
    - Bloodshed: Recuperate
    - Bloodshed: Slam
    - Bloodshed: Chilling Shout
    - Bloodshed: Bull Rush
    - Warfare: Atonement

  Recommended Abilities Description: |
    Warriors should be able to withhold damage, and as such, we recommend Recuperate for some extra healing and breaking enemy effects on you. Slam will provide you with area damage and Chilling Shout is a great ranged attack for the Mana cost. If you still have more available Basic Spells, no-one ever complained about having Bull Rush - it's a great passive effect for dealing extra damage. Lastly, if your Presence is low, Atonement will be great in combat for survival, if you're expecting to take a lot of damage.


Ideas:
  ~Silver Valor~:
    A: 0 Actions
    Cooldown: Once / 2 Turns
    Effect: |
      Your Abilities can ^chain^ after eachother.
      After using an Ability (A), the next Act (B) might get a bonus. The Ability (A) lists what the bonus on the next Act is, depending on its type.
      When casting this, start a ^chain^:

      {Chain} Weapon Attack: +1d4 Damage
      {Chain} Area Damage: +100% length and width
  
  ~Actions With Valor~:
    A: Passive
    Effect: |
      Your Abilities and attacks have bonus effects if made with {Teal('Valor')}.
      An Ability triggers its {Teal('Valor')} effect if it was made immediately after another Ability's {Teal('next')} property.

  ~True Attack~:
    A: 0 Actions
    Effect: |
      {Teal('Valor:')} Your next weapon attack deals +1 Damge for each Action Point it costs.

  ~Row Through~:
    A: Depends on weapon
    Cooldown: Once / Turn
    Effect: |
      Make a weapon attack with +1 Range.
      
      {Teal('With Valor:')} Hits one more Unit within 2 meters of the main target with -50% Damage.
      {Teal('Next:')} Healing Ability

  ~Run of Champions~:
    A: Half-Action
    Cooldown: Once / Turn
    Effect: |
      Make a Movement Act with +1 Movement Speed.

      {Teal('With Valor:')} Gain 1 Shielding that can block 1d6 Damage.
      {Teal('Next:')} Crowd Control Ability

  ~Blockade~:
    _Value: 1
    A: Reaction
    Range: 3 meters to that ally
    HasMixins: true
    Effect: |
      When another Unit is targeted and attacked (after the roll), dash to the closest space to that ally.
      You take the ^exact Damage^ instead of the Unit.

      {Teal('With Valor:')} You take -50% Damage from the final Damage
      {Teal('Next:')} Area Damage or Ability that can move yourself
    Upgrade: This Damage can only be mitigated by Shielding.
    Notes: Requires a clear direct path.

  ~Stand Strong, Fellows~:
    A: Half-Action
    Cooldown: Once / Turn
    Requirement: Only usable in Worthy Comabt
    Effect: |
      Heal all Units within 1 meter of you for 1d2.

      {Teal('With Valor:')} 1d4 Healing instead
      {Teal('Next:')} Ability that can hit multiple Units

  ~Templar Retribution~:
    A: Half-Action
    Range: 3 meters
    Effect: |
      Single-Stun a Unit.

      {Teal('With Valor:')} Double-Stun instead.
      {Teal('Next:')} Ability that can Heal

  ~No Matter What~:
    A: Passive
    Requirement: Only applies in Worthy Combat
    Effect: |
      At the end of your every Turn, heal for an amount equal to the Round Number.

      {Teal('With Valor:')} Also heals an Ally you can see
      {Teal('Next:')} Damaging Ability

  <Fellowship Aura>:
    _Value: 0.75
    A: Passive
    Effect: |
      You stand out for allies near you.
      Enemy ranged attacks against other allies within 1 meter of you have Cover.
    Notes: Nothing happens if an ally near you already has Cover. If playing on a grid, this does work for allies diagonally.

  ~Liberating Judgement~:
    A: Half-Action
    Range: 3 meters
    Degree: Lesser
    Tags: [Damage, Mobility]
    Effect: |
      Deal 2d4 Damage to a Unit (you choose the Damage Type).
      
      {Teal('With Valor:')} Then move a number of meters equal to the lower of the dice.
      {Teal('Next:')} Damaging Ability




Starting Abilities:

  ~War Craft~:
    A: Passive
    Effect: |
      No two warriors fight alike. Choose your War Craft from below!
      Each War Craft usually gives you a way to deal {Color('#ff5900' '+1d4 extra Damage each Turn')}.
    Upgrade: You may change your War Craft inbetween Adventures.


Ability Choices:

    ~Lance Heave~:
        A: Depends on Weapon
        DisplayName: "{Name}"
        HasMixins: true
        DisplayRequirement: Only usable if it hits at least 2 Units
        Tags: AoE
        Effect: |
            Make a {Weapon} ^weapon^ attack {Effect}
            ~Click on the Icon to select a preferred effect!~
        Combo: Comboed Units take the original full Damage.
        Notes: |
          Can apply weapon effects. If the weapon effect requires a target, applies to one chosen Unit hit.
          Range increases do increase the length. The Damage must the same for all Units hit. All bonuses to the attack (e.g. Smite, Cursewielder, etc) also split evenly.
        Variants:
            - Name: Lance Heave
              Effect: that hits all Units in a 3-meter long line. The Damage is evenly split among all hit Units.
              Weapon: 2-handed melee
              IconName: Lance Heave
            - Name: Blade Heave
              Effect: that hits all Units in a 3-meter long line. The Damage is evenly split among all hit Units.
              Weapon: 1-handed melee
              IconName: Blade Heave
            - Name: Penetrating Heave
              Effect: that hits one more Unit up to 2 meters directly behind the main target.
              Weapon: 2-handed ranged
              IconName: Penetrating Heave
            - Name: Piercing Heave
              Effect: that hits one more Unit up to 2 meters directly behind the main target.
              Weapon: 1-handed ranged
              IconName: Piercing Heave

    ~Smite~:
      _Value: 1 (you gain 1 mana back)
      A: 0 Actions
      Cooldown: Once / Turn
      Cost: 1 Mana
      Tags: [Damage, Finisher]
      Effect: |
          After you roll Damage for a melee attack or Spell made in melee range, add 1d6 Divine Damage.
          If the target dies, regain 1 Mana.
      Combo: Heal for the extra Damage dealt.
      Notes: Melee range is 1 meter, longer if made with a Weapon with longer range.

    ~Invigorate~:
        A: 0 Actions
        Cost: 1 Mana
        Range: 5 meters
        HasMixins: true
        Degree: Minor
        Tags: Healing
        Effect: |
            Heal a target for 1d4 + ^Presence or Intelligence^ Health.
            After this, if the target is at full Health, repeat this on another target within 5 meters of you.
        Combo: If the target is Comboed and still not full Health, increase the Healing by 50%.
        Notes: Yes, this can chain again and again.
    
    ~Safeguard~:
      A: 1 Action
      Cost: 1 Mana
      Tags: Protection
      Effect: |
        A Unit you can see gains 2 Shieldings. Each can block 1d8 Damage.
        Each die that rolled maximum applies a ~Combo~.

    ~Knighthood~:
      A: Passive
      Effect: |
        While mounted, after moving in a straight line at least 3 meters, your first attack this turn also hits a Unit directly behind the main target for 50% of the incoming Damage.
      Combo: Each Comboed Unit hit becomes Single-Stunned.


Utility:

    ~Light~:
        A: 0 Actions
        Range: 3 meters
        Duration: 30 real minutes
        Cooldown: 30 real minutes
        Degree: Lesser
        Tags: Utility
        Effect: |
            Create a faithful source of light in a 3 meters radius (of any color).
            It levitates and stays where you put it and can be moved by hand, or you can simply stick it to any solid object.
        Notes: |
            You may cancel it with 0 Actions. It can be purposefully destroyed with an Attack.
            The light is not strong enough to blind someone.
            The bulb can't go through solid objects.

    ~Guidance~ :
        A: Reaction
        Range: 10 meters
        Cooldown: 1 real hour
        Tags: Utility
        Effect: When an ally makes a Check, also add your respective Stat for that Check.

    ~Liberation~:
        A: Reaction or 0 Actions
        Cost: 1 Mana
        Requirement: Level 3
        Degree: Minor
        Effect: |
            Instantly remove all Crowd Control from another ally you can see.
        Upgrade: |
            At Level 5, also removes all non-magical debuffs and poisons.
            At Level 8, also removes all curses and normal negative magical effects.

    ~Vault Break~:
      Degree: Lesser
      A: 0 Actions
      Cooldown: 1 real hour
      Range: 3 meters
      Effect: |
          Slam the ground so hard that it shatters one obstacle that fits within a 3x3x3 meter area.
          After casting this Ability, if you moved this turn, you can continue your movement.
      Notes: It is the Quest Master's call if an obstacle can be broken. Most walls can't be broken, except for thinner ones and fences.

Talents:

  Level 5 - Keystone Talent:

    <Knight in Black>:
      A: Passive
      Requirement: Requires Black Clothes
      HasMixins: true
      Effect: |
        Single-Stuns have no effect on your. Double-Stuns and Triple-Stuns only reduce your Actions by 1 and 2 (respectively).
        While there are no allies within 4 meters of you, all your weapon attacks and self healing have their ^Dice Upgraded^ to the next dice type.
      Notes: |
        {DiceUpgrade}.
        While _alone_, your healing Abilities have their Dice Upgraded when healing yourself.

    <Man of Steel>:
      _Value: 2
      A: Passive
      Requirement: Heavy Armor or Shield
      Effect: |
        If you're wearing Heavy Armor or a Shield, you have +1 Defense and +5 Max Health.

    <White Knighthood>:
      A: Passive
      _Value: 2+
      HasMixins: true
      Requirement: White Clothes
      Effect: |
        While at or above 35 Health and wearing white clothes, all your Abilities have their ^Dice Upgraded^ to the next die type.
      Notes: |
        {DiceUpgrade}

  Level 6 - Utility Talent:

    ~Get Up, Stand Up~:
        A: 0 Actions
        Cooldown: Once / Adventure
        Degree: Minor
        Effect: |
            Remove all your party members' Exhaustion (from any source).
            If they were Exhausted from lack of sleep, they can resist sleep Exhaustion for 8 more hours.
            