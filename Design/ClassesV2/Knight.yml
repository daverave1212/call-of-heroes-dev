          ~HURL!~:
            A: Half-Action
            Damage: 1d6 Smash (3x3 area)
            Range: 5 meters to edge
            Sieger: Deals +100% Damage against Constructs and buildings!

    ~Stand Strong, Fellows~:
      _Value: 1
      A: Half-Action
      Cooldown: Once / Turn
      Requirement: Only usable in Worthy Comabt
      Range: 2 meters
      Tags: [Heal, Mass Damage (Valor)]
      Effect: |
        Heal either yourself, or all other Allies within 2 meters for 1d2.

        {Teal('After Targeted Damage:')} Also Damages Enemies within 2 meters for 1d4 Psychic Damage.

    ~Ruin Lineage~:
      A: 1 Action
      Effect: |
        The _strongest_ Enemy takes 3d6 Scourge or Pulse Damage, and the next strongest Enemy takes 50% of that.

        {Teal('After Heal:')} Choose another Unit on the battlefield to take 50% of that.
      Notes: |
        Will only affect alive Units. ^Strongest^ is up to the Quest Master.
        For each target, you can choose the Damage Type.

    ~Lance Unbound~:
      A: Depends
      Cooldown: Once / Turn
      Tags: [Damage, Combo, Heal (Valor)]
      Effect: |
        Make a melee weapon attack that applies a ~Combo~ and has +1 Range for each {A}Action Point spent.

        {Teal('After Mass Damage:')} Heal an Ally for 1 for each {A}Action Point spent.

  Level 4 Class Talent:
    ~Creed of the Crown~:
      A: Passive
      Cooldown: Once / Turn
      Tags: [Movement, Gold]
      Effect: |
        Your first moving* Act each Turn has its distance increased by 50%.
        At the end of each Turn, gain {Gold}Gold equal to 100% the number of meters you moved this Turn.
        You are immune to being Slowed, Rooted, and to Hard Terrain.
      Upgrade: You serve the realm above all else. Your sword defends law, order, and your liege's will.
      Notes: Moving* bonus accounts for Pushing or Slamming, too!

    ~Creed of the Rose~:
      A: Passive
      Tags: [Healing]
      Effect: |
        All your Abilities that can Heal do the {Teal(After)} effect regardless of the previous Act.
        Your Abilities that can Heal that don't have an {Teal(After)} effect at all have their ^Dice Upgraded^ to the next die type.
      Upgrade: You are the knight of beauty and grace, a protector of the innocent, and a paragon of compassion.
      Notes: Healing Abilities that have an {Teal(After)} effect that doesn't Heal ^do^ trigger their {Teal(After)} effect anyway.

    ~Creed of the Dragon~:
      A: Passive
      Requirement: Requires finding a dragon patron
      Tags: [Mass Damage, Defense]
      Effect: |
        You take -50% Damage from that dragon's element Type.
        All your Abilities' Ranges, areas, and distances increase by 2 meters, become of the dragon's element Type, and you deal +1d4 Mass Damage*.
      Upgrade: You swear your allegiance to an elder dragon you have encountered on your journey.
      Notes: If an effect or Ability manages to deal Mass Damage, it deals +1d4 to all affected Units.

    ~Creed of Vengeance~:   # Improves Status Effect + Buffs
      A: Special
      Requirement: Requires having been betrayed this Campaign, or having broken an oath
      Tags: [Damage, Initiative, Farming, Mobility]
      Effect: |
        You gain 2 Hatred Positive Quirks of choice.
        For each die rolled with Targeted Damage, gain 0.01 Initiative and 0.05 Damage or Healing on a chosen Ability permanently.
        After killing a Unit, you can move through obstacles* and enemy Units until the end of your Turn.
      Upgrade: |
        Justice has failed. Your oath was broken, your faith was betrayed, but you swore a new one: to hunt those who wronged you and make the world remember. You will bring justice, to the world and to yourself.
      Notes: Obstacles* are not walls and ceilings.

    ~Creed of the Sun~:
      A: Passive
      Tags: [Upgrade]
      Bonuses:
        Max Health: 4
      Effect: |
        You have +4 Max Health.
        Whenever you inflict a non-Slam Status Effect, you can also Slam that Unit 1d6 meters away from you.
        Whenever you Slam a Unit, they must choose to be Blinded, Lagged, or Frailed.
      Upgrade: |
        You are the dawn that banishes despair. You ride with the light at your back and hope in your hand.

    ~Creed of Steel~:
      A: Passive
      Effect: |
        You can wear 2 Shields at the time, both on the same hand.
        Whenever you block some Damage with a Shielding, save the blocked amount as _Steel Points_, or give 50% of the blocked amount as a Shielding to an Ally you can see.
        _Steel Points_ may last until the end of the Adventure.
      Subspells:
        ~Rebuke~:
          A: Half-Action
          Range: 2 meters
          Tags: [Damage]
          Effect: |
            {Teal('After Protection:')} Consume all _Steel Points_ to deal that much Damage of your Shield's Damage Type.
          Notes: If your Shield has multiple Damage Type reductions, you can choose. If it has no Damage Type reducion, it's Smash Damage.

# New: Trigger Combo, Trap, Elemental Damage, Summon

  Level 5 Class Talent:

    ~Inevitable Cataclysm~:
      Value: 5.5  # 3 Damage + 2.5 AoE
      A: 3 Action Points
      Cooldown: Once / Adventure
      Requirement: Can't be used on the first Round
      Tags: [Ultimate, Movement, Damage, Mass Damage]
      Effect: |
        You declare war on your enemy, and wait for the perfect moment to obliterate them.

        Choose a Unit you can see. At the start of your next Turn, you jump to them and strike them with your weapon for 5d12 Damage of your weapon's type. The impact ripples to Units within 5 meters, and each Unit caught takes 1 die less of the result per meter away from the main target. The Quest Master chooses which die to drop per meter.

        {Teal('After Targeted Damage:')} 
        {Teal('After Heal:')} 

      Notes: If the main target took 7, 8, 9, 10, and 11 Damage on the dice, then Units 1 meter away may take 8, 9, 10, and 11 if the Quest Master decides to drop the lowest die. Units 2 meters away take 8, 9, and 10 if the Quest Master decides to drop the highest die. And so on.

    ~Knight's Corral~:
      _Value: 5.5 # 3 Slam + 2.5 Heal
      A: 0 Actions
      Range: 3 meters
      Cooldown: Once / Adventure
      Tags: [Ultimate, Status Effect, Mass Damage, Heal]
      Effect: |
        You make your surrounding area impossible to tresspass, except for your challenger of choice.

        Choose a Worthy Enemy. All other Units within 4 meters of either of you are Slammed 5d4 meters away from between you. Until the start of your next Turn, no other Units can willingly come within 3 meters of either of you, and for the rest of the Combat, you both Heal for 200% of the Round number at the start of each Worthy Round.

        {Teal('After Mass Damage:')} 
        {Teal('After Targeted Damage:')} 
      Notes: Units can't willingly enter the zone. If a Unit somehow gets in, they can't willingly move closer to either of them.

    ~Liege's Banner~:
      _Value: 4  # 1.25 AoE + 1 Heal per throw + 2.5 Protection (-2.25 potentially for an enemy)
      A: Half-Action
      IconName: Banner of Honor
      Requirement: Can't be used on the first Round
      Range: 3-10 meters
      Tags: [Ultimate, Protection, Mass Damage, Heal]
      Cooldown: Once / Adventure
      Effect: |
        You detach your banner, and raise it above the battlefield, ready to throw it.

        Throw your special banner onto a place on the battlefield, dealing 3d6 Pierce Damage to Units within 1 meter of its landing point and Healing the thrower for 1d8. The banner has 15 Max Health and absorbs all Damage the Knight's allies take.

        {Teal('After Heal:')} 
        {Teal('After Mass Damage:')} 
      Upgrade: Anyone can use 1 {A}Action Point to pick up the banner and throw it again!
      Notes: You must spend 50 {Gold}Gold to craft the special banner, and you must draw a picture of what it looks like.

  Level 6 - Utility Talent:

    ~Get Up, Stand Up~:
        A: 0 Actions
        Cooldown: Once / Adventure
        Degree: Minor
        Effect: |
            Remove all your party members' Exhaustion (from any source).
            If they were Exhausted from lack of sleep, they can resist sleep Exhaustion for 8 more hours.

