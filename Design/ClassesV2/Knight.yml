  ~Double Valor~:
    Effect: Double a valor trigger.

  ~Valor Flex~:
    _Value: 3
    A: Passive
    Effect: Your first Ability each Turn counts as {Teal(After)} every Act type.

  ~Axiom~:
    Effect: Roll 1d6 and convert it to Movement or Shielding.

  ~Perfect Form~:
    _Value: 2 # Realistically, this would happen after 2 Rounds.
    Effect: After you use all six Act types in a Combat, choose an Ability. It is always made with Valor this Combat and has no Cooldown.

  ~Honorable Duel~:
    Effect: Each Combat, choose an Enemy. You deal +10% Damage against eachother.

  ~Courageous Duel~:
    Effect: Choose a Unit. You and it can only target* eachother.

  # ------ Normal options ------

  ~Self-Sacrifice~:
    _Value: 1
    A: Half-Action
    Cooldown: Once / Turn
    Requirement: Only usable in Worthy Combat
