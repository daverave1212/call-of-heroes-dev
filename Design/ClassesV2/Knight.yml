Class: Knight
Description: |
  Behold, a knight clad in armor, commanding the king's army with unvavering determination, his presence inspiring the rallied masses trailing in his wake while striking fear into the hearts of the enemy ranks! A heavy blow of his lance shatters the enemy's defence line, clearing a path for victory. Radiating with divine energy of righteousness and bearing the standard of his allegiance, the Knight fearlessly presses forward, to victory!
  Knights are the knights, the crusaders and the vigilantes who bear divine magic through conviction and purpose, perhaps aided by their god, rather than mastery over the arcane. They are able to both heal, resist damage and fell enemies with holy retribution.
  Be it by the sword, by the shield or by the book, Knights join (or form) an order or community of like-minded individuals, and follow their calling into battle - to attack, to protect, to serve for a greater future.

Quick Note: Knights are the knights, the crusaders and the vigilantes who bear divine magic through conviction and purpose, perhaps aided by their god, rather than mastery over the arcane. They are able to both heal, resist damage and fell enemies with holy retribution.

Weapons: You are Trained in 2 Weapon Categories of choice (e.g. 1-Handed Melee, 2-Handed Ranged, Shields, etc).

Difficulty: Hard


Level Up:
  Every Level: 
    Max Health: 4
    Health Regen: 2
    Skill Point: 1
    Any Stat (up to the Stat Limit): 1

Spellcasting:
  Type: Knight
  SpellsOrAbilities: Ability

  Change: You can change your known Spells and Talents inbetween Adventures.
  Other: All Warrior-specific Abilities are not considered Spells (unless stated otherwise).


#       Combo Pieces:
# 1.  Damage -> Healing  -> Movement -> CC          (Slam/Daze)
# 2.  Damage -> Movement |  Healing ->  CC          (Stun/Double-Stun)
# 3.  Damage -> CC -> Movement -> Healing
#
#       Extra Effects
# Combo, Buff (Regen), Shielding, Gold Generation
# Quirk, Combo, Summon
#
# NOTE: Provocation (L1 CC) can go into Templar Retribution (L2 CC)
# Note: "Use a gem or something to keep track of your last used Ability on your paper sheet"
#
#       Needs:
#   Spells, Pet (peasant), You make keep your mount in combat
#
#   Level 3:
# Damage: ranged spell
# CC
#
#
#




Ideas:
  ~None~:
    Effect: None


Other Ideas:
  
  ~Dark Knight Creed~:
    Effect: TODO

  ~Liberating Judgement~:
    A: Half-Action
    Range: 3 meters
    Degree: Lesser
    Tags: [Damage, Mobility]
    Effect: |
      Deal 2d4 Damage to a Unit (you choose the Damage Type).
      
      {Teal('With Valor:')} Then move a number of meters equal to the lower of the dice.
      {Teal('Next:')} Damage Ability
  
  ~Free From Corruption~:
    Effect: If you cast this 3 times this Combat, choose an ally and remove one of their Negative Quirks.




Utility:

  ~Outpost~:
    A: 1 hour
    Cooldown: Once / Adventure
    Degree: Minor
    Effect: |
      Choose either a First Aid Tent or an Outpost Tower to build from scratch.
      Once per Adventure, the tent can heal everyone inside for 1 Health.
      While within 50km of the Tower, your party can't be ambushed, has +2 in Sight, and halves the travel time of your party.
    Upgrade: For smaller-scope adventures, the Quest Master can reduce the distance of the Tower to 10km.
    Notes: Try to build towers within 100km of eachother, and in places you may want to visit multiple times. Construct a network of such towers!

  ~Nominate Squire~:
    A: Special
    Popup:
      Message: Remember to manually change the Stats and numbers from the My Character tab (and tell your Ally to do so).
    Effect: |
      Nominate a Hero from your party to become your _squire_ - your trusted companion and helper in your quest.
      
      Your squire gets -2 Max Health, but you get +3 Max Health.
      Whenever one of you would get a Quirk, you can choose to deny it, and be given a different Quirk that fits the situation.
    Upgrade: |
      Your squire has doubled inventory capacity and you can instantly swap items from eachother with 0 Actions (if near eachother).
      They also have +2 in War Machines.

  ~Vows~:
    A: 10 minutes
    Cooldown: Depends
    Requirement: Only usable in Campaigns with multiple sessions
    Effect: |
      Vow on achieving a goal that would take at least 1 full Adventure.
      Upon reaching your goal, you get a number of Positive Quirks equal to the number of sessions it took.
    Upgrade: You can only have one vow at a time. Abandoning a vow gives you a Negative Quirk.

  ~Trusted Steed~:
    A: Passive
    Effect: |
      You have a steed that increases your Movement Speed by 50%.
      In Combat, your first Damaging Ability you use dismounts you, but deals +1d4 Damage or Slams the target 1d4 meters away.
    Upgrade: At Level 3, your Steed can climb steep hills and jump up to 5 meters. At Level 6, it can walk on water. At Level 9, it can fly.
    Notes: The steed can be any animal that fits the story. When dismounting, your steed runs away and disappears into the surroundings. Once per real hour, you can whistle for your steed and it will appear running toward you and you automatically mount it.

Starting Abilities Description: Playing a Knight can be challenging. If you truly can't chain together some of your Abilities, don't worry about it too much. It's all about planning in advance!
Starting Abilities:

  ~Actions With Valor~:
    A: Passive
    Effect: |
      Your Abilities and attacks in Worthy Combat have bonus effects if made {Teal('With Valor')}.
      An Ability triggers its {Teal('Valor')} effect if it was made immediately after another Ability's {Teal('Next')}.
    Upgrade: Valor carries on to the next Turn, but not to the next Combat (you start each Combat without Valor).
    Notes: For example, on your first Turn, you use Knockback (Level 1 Class Talent). It does not trigger the With Valor part, so you Slam a Unit 1d4 meter. It says "Offensive Damage Ability" at "Next", so you use Row Through, which activates its With Valor effect, hitting one more. It says "Healing Ability" at "Next", so you can use Stand Strong, Fellows to heal for 1d4 instead of 1d2. And so on. You can't activate With Valor or Next outside Worthy Combat. You start each Worthy Combat without Valor.

  ~Challenge of Arms~:
    _Value: 2 # About 0.5 Damage and 0.5 movement per Combat, * 2 = 2-ish
    A: Half-Action
    Cooldown: Once / Combat
    Requirement: Only usable in Worthy Combat
    Duration: 1 minute
    Range: 3 meters
    Tags: [Damage, Heal, Mobility, Crowd Control]
    Effect: |
      Heal yourself for 1d4, or move 1d4 meters.
      Then deal 1d8 Smash Damage to a Unit, or Slam it 1d6 meters.

      {Teal('With Valor:')} Do it again!
      {Teal('Next:')} Any other Ability
    Notes: Use this to start a chain of Abilities With Valor! When you repeat this, choose the effects again and roll dice as normal. Obviously, the repeat does not retrigger another repeat.

Talents:

  Level 1 First Class Talent:

    ~Row Through~:
      _Value: 1.5
      A: Depends on weapon
      Cooldown: Once / Turn
      Tags: [Damage, Area Damage]
      Effect: |
        Make a weapon attack with +1 Range.
        
        {Teal('With Valor:')} +1d4 Damage and hits one more Unit within 2 meters of the main target with -50% Damage.
        {Teal('Next:')} Healing Ability

    ~Stand Strong, Fellows~:
      _Value: 1
      A: Half-Action
      Cooldown: Once / Turn
      Requirement: Only usable in Worthy Comabt
      Tags: [Heal]
      Effect: |
        Heal all other Units within 1 meter of you for 1d2.

        {Teal('With Valor:')} 1d4 Healing instead
        {Teal('Next:')} Movement Ability

    ~Champion's Gallop~:
      _Value: 1
      A: Half-Action
      Cooldown: Once / Turn
      Tags: [Movement]
      Effect: |
        Make a Move Act with +2 Movement Speed.
        
        {Variants}

        {Teal('With Valor:')} {Effect}
        {Teal('Next:')} Crowd Control Ability
      Variants:
        - Effect: All Units you pass near take 1d4 Damage (requires a Trusted Steed).
        - Effect: Gain one Shielding that can block 1d4 Damage.
      
    ~Provocation~:
      _Value: 1
      A: Half-Action
      Tags: [Crowd Control]
      Cooldown: Once / Turn
      Range: 4 meters
      Effect: |
        Slam a Unit 3 meters toward you, or 3 meters away from you.
        
        {Teal('With Valor:')} If toward you, Taunt it. If away from you, Daze it.
        {Teal('Next:')} Other Offensive Damage Ability


# Extra keywords: Buff
  Level 1 Second Class Talent:

    ~Lance Unbound~:
      _Value: 2
      A: Depends on weapon
      Cooldown: Once / Turn
      Tags: [Damage, Combo]
      Effect: |
        Make a weapon attack. The target gains a Combo.

        {Teal('With Valor:')} +1d4 Damage for each Action Point it costs.
        {Teal('Next:')} Movement Ability

    ~Liberation~:
        A: Half-Action
        Cooldown: Once / Turn
        Degree: Minor
        Range: 3 meters
        Requirement: Only usable in Worthy Combat
        Tags: [Heal, Support]
        Effect: |
            Heal a Unit for 1d4.
            
            {Teal('With Valor:')} 1d6 Healing instead, and remove all Crowd Control from it.
            {Teal('Next:')} Crowd Control Ability
        Upgrade: |
            At Level 5, also removes all non-magical debuffs and poisons.
            At Level 8, also removes all curses and normal negative magical effects.

    ~Blockade~:
      _Value: 1
      A: Reaction
      Range: 3 meters to that ally
      HasMixins: true
      Tags: [Movement, Shielding]
      Effect: |
        When another Unit would take Damage, dash to the closest space to that ally.
        You take the ^exact Damage^ instead of the Unit.

        {Teal('With Valor:')} Block 1d4 of that Damage.
        {Teal('Next:')} Offensive Damage Ability
      Upgrade: This Damage can only be mitigated by Shielding.
      Notes: Requires a clear direct path.

    ~Templar Retribution~:
      A: Half-Action
      Range: 3 meters
      Cooldown: Once / Turn
      Tags: [Crowd Control, Gold Generation]
      Effect: |
        Single-Stun a Unit.

        {Teal('With Valor:')} Double-Stun instead and gain 4d10 {Gold}Gold.
        {Teal('Next:')} Healing Ability

  Level 2 Second Class Talent:

    ~Platinum Storm~:
        A: 1 Action
        ScrollPower: Auto
        Range: Depends on weapon
        Tags: [Damage, Area Damage]
        Effect: |
          Use a Magic Wand to deal 2d4 + 2d6 Damage on a 1x1 meter space, of the Wand's Type.

          {Teal('With Valor:')} The area becomes 3x3 meters instead.
          {Teal('Next:')} Crowd Control

    ~Cowards!~:
        A: Half-Action
        Tags: [Crowd Control, Protection]
        Effect: |
          Taunt all enemies within 2 meters of you.

          {Teal('With Valor:')} Gain 1 Shielding, which can block 1 Damage for each Unit Taunted.
          {Teal('Next:')} Movement

          Passively, you have Rebuke.
        Subspells:
          ~Rebuke~:
            A: Reaction
            Range: Depends on weapon
            Tags: [Damage, Crowd Control]
            Requirement: Requires having some Shielding
            Effect: |
              Use when targeted by an attack.
              Use a ^weapon^ to deal Damage to the attacker equal to your total Shieldings value.
              Afterwards, if you took no Damage from the attack, also Single-Stun the attacker.

    ~Self-Sacrifice~:
      _Value: 1
      A: Half-Action
      Cooldown: Once / Turn
      Requirement: Only usable in Worthy Combat
      Tags: [Heal, Buff, Health Transfer]
      Range: 5 meters
      Effect: |
        Take 2d6 True Damage. Heal a different ally for 200% of the rolled amount.

        {Teal('With Valor:')} They gain +1 Health Regen for the rest of the Adventure.
        {Teal('Next:')} Damage Ability
      Notes: Can not be used on other Knights or characters with a Health Transfer Ability.

    ~Charging Stallion~:
        A: 1 Action
        ScrollPower: Auto
        Requirement: Only usable in Worthy Combat
        Tags: [Movement, Other]
        Effect: |
          Charge in a straight line to any location on the battlefield.
          All Units you pass through _shuffle_ their positions.

          {Teal('With Valor:')} And are Slowed and get a Combo.
          {Teal('Next:')} Healing
        Notes: |
          Units you hit swap their positions between them _randomly_ (as chosen by the Quest Master). For example, the first Unit hit might swap positions with the last Unit hit.
          Optionally, you can use this to exit the battlefield and the Combat.
          Shuffling positions does not count as Crowd Control.
        



  Level 3 Class Talent:

    ~Creed of the Crown~:  # Improves Movement and Gold Generation
      _Value: 3
      A: Special
      Tags: [Defense, Gold]
      Effect: |
        You serve the realm above all else. Your sword defends law, order, and your liege's will.

        You are immune to being Slowed, Rooted, and to Hard Terrain.
        At the end of your Turn, give yourself or an ally a Shielding equal to 50% and gain {Gold}Gold equal to 200% the number of meters you moved this Turn.
    
    ~Creed of the Rose~:  # Improves Healing and Shielding
      _Value: 3
      A: Special
      Bonuses:
        Max Health: 4
      Tags: [Defense, Heal, Protection]
      Effect: |
        You are the knight of beauty and grace, a protector of the innocent, and a paragon of compassion.

        You get +4 Max Health.
        All your Healing or Shielding Abilities not done with Valor are automatically made with Valor.
        If they were already done with Valor, they do +50% Healing or Shielding.

    ~Creed of the Dragon~:  # Improves Damage + Combo (though not specified) + Resistance
      _Value: 2.75
      A: Special
      Requirement: Requires finding a dragon patron
      Tags: [Area Damage, Defense]
      Effect: |
        You swear your allegiance to an elder dragon you have encountered on your journey.
        
        You take -50% Damage from that dragon's element Type.
        When dealing Damage with an Ability that was cast With Valor, 50% of the main target's Damage is also dealt to all Units within 1 meter of the target (of your dragon's element Type).

    ~Creed of Vengeance~:   # Improves Crowd Control + Buffs
      A: Special
      Requirement: Requires having been betrayed this Campaign, or having broken an oath
      Tags: [Support, Crowd Control (Hard)]
      _Value: 2
      Effect: |
        Justice has failed. Your oath was broken, your faith was betrayed, but you swore a new one: to hunt those who wronged you and make the world remember. You will bring justice, to the world and to yourself.

        Whenever you buff an Ally, also apply that buff to yourself.
        Once per Ability, when applying Crowd Control to a Unit, it takes 1d4 Scourge Damage. Then another Unit within 2 meters of it must pass a {Might} Roll at least equal to your Highest Stat Roll or also be affected by that Crowd Control and extra Scourge Damage.
      Notes: The secondary Crowd Control does not retrigger Creed of Vengeance.

    ~Creed of the Sun~:   # Generic improvement
      _Value: 2
      A: Half-Action
      Cooldown: Once / Combat
      Replacement: Replaces Challenge of Arms
      Tags: [Upgrade]
      Duration: 1 minute
      Range: 3 meters
      Effect: |
        ~Heal yourself for 1d8 and move up to 1d4 meters~.
        Deal ~1d12~ Fire Damage to a Unit ~and Slow it~.

        {Teal('With Valor:')} Do it again!
        {Teal('Next:')} Any other Ability
      Upgrade: |
        You are the dawn that banishes despair. You ride with the light at your back and hope in your hand.


