Class: Knight
Description: |
  Behold, a knight clad in armor, commanding the king's army with unvavering determination, his presence inspiring the rallied masses trailing in his wake while striking fear into the hearts of the enemy ranks! A heavy blow of his lance shatters the enemy's defence line, clearing a path for victory. Radiating with divine energy of righteousness and bearing the standard of his allegiance, the Knight fearlessly presses forward, to victory!
  Knights are the knights, the crusaders and the vigilantes who bear divine magic through conviction and purpose, perhaps aided by their god, rather than mastery over the arcane. They are able to both heal, resist damage and fell enemies with holy retribution.
  Be it by the sword, by the shield or by the book, Knights join (or form) an order or community of like-minded individuals, and follow their calling into battle - to attack, to protect, to serve for a greater future.

Quick Note: Knights are the knights, the crusaders and the vigilantes who bear divine magic through conviction and purpose, perhaps aided by their god, rather than mastery over the arcane. They are able to both heal, resist damage and fell enemies with holy retribution.

Weapons: You are Trained in 2 Weapon Categories of choice (e.g. 1-Handed Melee, 2-Handed Ranged, Shields, etc).

Difficulty: Hard


Level Up:
  Every Level: 
    Max Health: 4
    Health Regen: 2
    Skill Point: 1
    Any Stat (up to the Stat Limit): 1

Spellcasting:
  Type: Knight
  SpellsOrAbilities: Ability

  Change: You can change your known Spells and Talents inbetween Adventures.
  Other: All Warrior-specific Abilities are not considered Spells (unless stated otherwise).


Meta:

  New Design: "From Previous"
  Guidelines:
    - Ability _Value: 0.5 - 1
    - Froms With Value:
        Weapon Attack: Easy
        Casting a Spell: Easy-Medium
        Area Damage: Medium
        Critical Strike/Combo: Medium
        Killing Blow: Medium    # Only Medium because it can snowball hard
        High Ground Attack: Medium

        Movement: Easy-Medium   # -Medium because Movement costs 1 AP
        Applying Status Effect: Hard
        
        Healing / Being Healed: Easy-Medium
        Gaining Shielding: Medium
        Taking 0 Damage: Hard

  Core Knight set (in "Sequence" order):
    Damage (medium power): AoE (medium effect)
    Protection (easy power): Movement (low effect)
    AoE (hard power): Heal (hard effect)
    Movement (medium power): Status (medium effect)
    Heal (easy power): Damage (low effect)
    Status (hard power): Protection (hard effect)
  
  
  Level 2 & 3 Knight set (in "Sequence" order):
    Heal (easy power): AoE (medium effect)
    AoE (hard power): Damage (easy effect)
    Damage (medium power): Heal (hard effect)
    Movement (medium power): Protection (hard effect)
    Status (hard power): Movement (easy effect)
    Protection (hard power): Status (medium effect)
  
  Level 4 Creed (NOT in sequence):
    Creed of the Dragon: AoE + Farming
    Creed of the Crown: Movement + Gold
    Creed of the Rose: Healing + Buff
    Creed of the Sun: Status + Elemental Damage?
    Creed of Vengeance: Damage + You can move through obstacles
    Creed of Steel: Protection + accumulate Damage from shieldings
  
  Then:
    That means: each of these goes into a +2 and +4 effect
    Also: +5 is not valid since they loop around
    Available effects: +1 and +3

  Extras To Add:
      - If you've killed such an enemy Type before..
      - Gold
      - Farming
      - Buff
      - Control
      - Combo
      - Debuff
      - Plot Points
      - RoI
      - Trap
      - Pet
      - Quirk (?)

Ideas:

  # ------ Other unusual effects ------

  ~Formation~:
    Effect: Your party gains various bonuses depending on your formation!

  ~Free From Corruption~:
    Effect: If you cast this 3 times this Combat, choose an ally and remove one of their Negative Quirks.



  ~Creed of the Crown~:
    A: Passive
    Cooldown: Once / Turn
    Tags: [Movement, Gold]
    Effect: |
      Your first moving* Act each Turn has its distance increased by 50%.
      At the end of each Turn, gain {Gold}Gold equal to 100% the number of meters you moved this Turn.
      You are immune to being Slowed, Rooted, and to Hard Terrain.
    Upgrade: You serve the realm above all else. Your sword defends law, order, and your liege's will.
    Notes: Moving* bonus accounts for Pushing or Slamming, too!

  ~Creed of the Rose~:
    A: Passive
    Tags: [Healing]
    Effect: |
      All your Abilities that can Heal do the {Teal(After)} effect regardless of the previous Act.
      If they don't have an {Teal(After)} effect at all, they have their ^Dice Upgraded^ to the next die type.
    Upgrade: You are the knight of beauty and grace, a protector of the innocent, and a paragon of compassion.
    Notes: Healing Abilities that have an {Teal(After)} effect that doesn't Heal ^do^trigger their {Teal(After)} effect anyway.

  ~Creed of the Dragon~:
    A: Passive
    Requirement: Requires finding a dragon patron
    Tags: [Mass Damage, Defense]
    Effect: |
      You take -50% Damage from that dragon's element Type.
      All your Abilities' Ranges, areas, and distances increase by 2 meters, become of the dragon's element Type, and you deal +1d4 Mass Damage*.
    Upgrade: You swear your allegiance to an elder dragon you have encountered on your journey.
    Notes: If an effect or Ability manages to deal Mass Damage, it deals +1d4 to all affected Units.

  ~Creed of Vengeance~:   # Improves Status Effect + Buffs
    A: Special
    Requirement: Requires having been betrayed this Campaign, or having broken an oath
    Tags: [Damage, Initiative, Farming, Mobility]
    Effect: |
      You gain 2 Hatred Positive Quirks of choice.
      For each die rolled with Targeted Damage, gain 0.01 Initiative and 0.04 Damage on a chosen Ability permanently.
      After killing a Unit, you can move through obstacles* and enemy Units until the end of your Turn.
    Upgrade: |
      Justice has failed. Your oath was broken, your faith was betrayed, but you swore a new one: to hunt those who wronged you and make the world remember. You will bring justice, to the world and to yourself.
    Notes: Obstacles* are not walls and ceilings.

  ~Creed of the Sun~:   # Generic improvement
    A: Passive
    Tags: [Upgrade]
    Bonuses:
      Max Health: 4
    Effect: |
      You have +4 Max Health.
      Whenever you inflict a non-Slam Status Effect, you can also Slam that Unit 1d6 meters away from you.
      Whenever you Slam a Unit, they must choose to be Blinded, Lagged, or Frailed.
    Upgrade: |
      You are the dawn that banishes despair. You ride with the light at your back and hope in your hand.


  # ------ Valor flexibility / hybridization ------

  ~Advance!~:
    A: Passive
    Effect: |
      After making a weapon attack, you can make a free Movement Act for 1 meter.

  ~Delayed Valor~:
    Effect: You can store an After trigger and use it later.

  # ------ Strong Effects ------

  ~Double Valor~:
    Effect: Double a valor trigger.

  ~Valor Flex~:
    _Value: 3
    A: Passive
    Effect: Your first Ability each Turn counts as {Teal(After)} every Act type.

  ~Axiom~:
    Effect: Roll 1d6 and convert it to Movement or Shielding.

  ~Perfect Form~:
    _Value: 2 # Realistically, this would happen after 2 Rounds.
    Effect: After you use all six Act types in a Combat, choose an Ability. It is always made with Valor this Combat and has no Cooldown.

  ~Honorable Duel~:
    Effect: Each Combat, choose an Enemy. You deal +10% Damage against eachother.

  # ------ Normal options ------

  ~Self-Sacrifice~:
    _Value: 1
    A: Half-Action
    Cooldown: Once / Turn
    Requirement: Only usable in Worthy Combat
