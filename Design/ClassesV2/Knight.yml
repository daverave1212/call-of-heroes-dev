  Level 8 Class Talent:

    ~Sovereign Execution~:
      _Value: 4.5 # 1 Execution + 2.5 Heal + 1 Shielding
      A: 0 Actions
      Requirement: Can't be used on the first Round
      Cooldown: Once / Adventure
      Tags: [Ultimate, Heal, Movement, Protection]
      Effect: |
        You prepare to decimate the meak and using their life force as fuel for your conquest.

        Your next attack charges you up to 5 meters towards the target, and heals you for all the Damage done. If it leaves the non-Epic Unit with 25% or less Health, further deals extra Damage equal to its current Health and the Damage type becomes True.

        {Teal('After Protection:')} 
        {Teal('After Status Effect:')} 

    ~Damsel's Deliverance~:
      _Value: 3.75 # +2.75 Damage + 0.5 Slam push + 0.5 Your movement
      A: 1
      Requirement: Can't be used on the first Round
      Cooldown: Once / Adventure
      Tags: [Ultimate, Damage, Movement, Status Effect]
      Range: 2 meters
      Effect: |
        You lock eyes with a target, and prepare to take them into oblivion.

        Charge towards the target, grab them, and dash with it away from your original position until you hit a non-Unit obstacle. On impact, it takes 9d6 Smash Damage.

        {Teal('After Movement:')} 
        {Teal('After Protection:')} 
      Notes: You grab the Unit and you both go flying, until you smash it into the first obstacle it collides with. If you reach 15 meters of uninterrupted dashing, you smash them into the ground and stop, dealing the Damage then and there.

    ~Divide and Conquer~:
      _Value: 4.5 # +1 Damage + 1.5 Slam + 2 Shieldings
      A: 2
      Requirement: Can't be used on the first Round
      Tags: [Ultimate, Mass Damage, Protection, Status Effect]
      Cooldown: Once / Adventure
      Effect: |
        You stomp your weapons into the ground and divide the battlefield.

        ALL Units in front of you take 4d8 Damage of your weapon's type and are Slammed back 1d8 meters. Each Unit behind you gains a 1d8 Shielding.

        {Teal('After Status Effect:')} 
        {Teal('After Movement:')} 

    <Knight in Black>:
      A: Passive
      Requirement: Requires Black Clothes
      HasMixins: true
      Tags: [Defense, Damage]
      Effect: |
        Single-Stuns have no effect on your. Double-Stuns and Triple-Stuns only reduce your Actions by 1 and 2 (respectively).
        While there are no allies within 4 meters of you, all your weapon attacks and self healing have their ^Dice Upgraded^ to the next dice type.
      Notes: |
        {DiceUpgrade}.
        While _alone_, your healing Abilities have their Dice Upgraded when healing yourself.

