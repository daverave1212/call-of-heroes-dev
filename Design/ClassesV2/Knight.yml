      Tags: [Damage, Area Damge]
      Effect: |
        Make a weapon attack with +1 Range.
        
        {Teal('With Valor:')} Hits one more Unit within 2 meters of the main target with -50% Damage.
        {Teal('Next:')} Healing Ability

    ~Stand Strong, Fellows~:
