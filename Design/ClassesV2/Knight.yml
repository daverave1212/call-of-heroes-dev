      {Teal('With Valor:')} They gain +1 Health Regen for the rest of the Adventure.
      {Teal('Next:')} Damage Ability
    Notes: Can not be used on other Knights or characters with a Health Transfer Ability.

  ~Liberating Judgement~:
    A: Half-Action
