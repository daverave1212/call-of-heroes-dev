Class: Knight
Description: |
  Behold, a knight clad in armor, commanding the king's army with unvavering determination, his presence inspiring the rallied masses trailing in his wake while striking fear into the hearts of the enemy ranks! A heavy blow of his lance shatters the enemy's defence line, clearing a path for victory. Radiating with divine energy of righteousness and bearing the standard of his allegiance, the Knight fearlessly presses forward, to victory!
  Knights are the knights, the crusaders and the vigilantes who bear divine magic through conviction and purpose, perhaps aided by their god, rather than mastery over the arcane. They are able to both heal, resist damage and fell enemies with holy retribution.
  Be it by the sword, by the shield or by the book, Knights join (or form) an order or community of like-minded individuals, and follow their calling into battle - to attack, to protect, to serve for a greater future.

Quick Note: Knights are the knights, the crusaders and the vigilantes who bear divine magic through conviction and purpose, perhaps aided by their god, rather than mastery over the arcane. They are able to both heal, resist damage and fell enemies with holy retribution.

Weapons: You are Trained in 2 Weapon Categories of choice (e.g. 1-Handed Melee, 2-Handed Ranged, Shields, etc).

Difficulty: Hard


Level Up:
  Every Level: 
    Max Health: 4
    Health Regen: 2
    Skill Point: 1
    Any Stat (up to the Stat Limit): 1

Spellcasting:
  Type: Knight
  SpellsOrAbilities: Ability

  Change: You can change your known Spells and Talents inbetween Adventures.
  Other: All Warrior-specific Abilities are not considered Spells (unless stated otherwise).


Meta:

  Guidelines:
    - Froms With Value:
        Weapon Attack: Easy
        Casting a Spell: Easy-Medium
        Area Damage: Medium
        Critical Strike/Combo: Medium
        Killing Blow: Medium    # Only Medium because it can snowball hard
        High Ground Attack: Medium

        Movement: Easy-Medium   # -Medium because Movement costs 1 AP
        Applying Status Effect: Hard
        
        Healing / Being Healed: Easy-Medium
        Gaining Shielding: Medium
        Taking 0 Damage: Hard

  # Prev is -1 (+5), goes into +2
  Core Knight set (in "Sequence" order):
    Damage (medium power): AoE (medium effect)
    Protection (easy power): Movement (low effect)
    AoE (hard power): Heal (hard effect)
    Movement (medium power): Status (medium effect)
    Heal (easy power): Damage (low effect)
    Status (hard power): Protection (hard effect)

  # Prev is -4 (+2), goes into +4
  ALTERNATIVE Level 2 & 3 Knight set (in "Sequence" order):
    Heal: AoE (medium effect)                           # Prev is -4 (+2), goes into +4
    AoE: Damage (easy effect)                           # Prev is -4 (+2), goes into +4
    Damage: Heal (hard effect)                          # Prev is -4 (+2), goes into +4
    
    Status: Movement (easy effect)                      # Prev is -4 (+2), goes into +4
    Movement: Protection (hard effect)                  # Prev is -4 (+2), goes into +4
    Protection (hard power): Status (medium effect)     # Prev is -4 (+2), goes into +4
  
  Level 4 Creed (NOT in sequence):
    Creed of the Dragon: AoE + Farming
    Creed of the Crown: Movement + Gold
    Creed of the Rose: Healing + Buff
    Creed of the Sun: Status + Elemental Damage?
    Creed of Vengeance: Damage + You can move through obstacles
    Creed of Steel: Protection + accumulate Damage from shieldings
  
  # Prev is +4, goes into +5
  Level 5+ (in Sequence)?:
    AoE: goes into Protection
    Damage: goes into Status
    Heal: goes into Movement

    Movement: goes into AoE
    Status: goes into Heal
    Protection: goes into Damage
  
  # Prev is +3, goes into +5 / +1 / +3
  # NOTE: Level 5 has Prev is -3 (+3) and +1, goes into +5 and +3!
  Level 5+ Ultimate Possibilities (any 3 of) (Sequence from first):
    - AoE / Protection / Movement / Status
    - Damage / Status / Protection / Movement 
    - Heal / Movement / Status / Protection

    - Movement / AoE / Heal / Damage
    - Status / Heal / Damage / AoE
    - Protection / Damage / AoE / Heal

  Level 5 Ultimates (Sequence from first):
    - "Big Slash": AoE / Protection / ... / Status
    - Sett: Damage / Status / ... / Movement
    - 100% LS: Heal / Movement / ... / Protection

    - RoI: Movement / AoE / ... / Damage  # Next Turn, jump to a Unit and deal massive damages
    - Xin Zhao: Status / Heal / ... / AoE
    - Banner: Protection / ... / AoE / Heal

  Choices for prev are:
    - Status + Movement
    - Movement + Protection
    - Protection + Status


  Things I can give per higher Level Talent tier:
    - More standard Abilities
    - More standard Abilities
    - Standard Abilities with 2 "After" effects rather than 1
    - Ultimate
    - Passive tricks (hybridization)
    - Passive reinforcement effects
    - Upgrade for lower-Level Talents.

  


