



~Grab Ledge~:
    A: Reaction
    Requirement: Only for Heroes and Epic monsters.
    Effect: |
        Use when you would fall off a ledge.
        Stop and hold onto the ledge.
        You become Single-Stunned.
    Upgrade: |
        If you were Slammed, take Damage equal to the remaining Slam meters.
        Epic monsters can Grab Ledge.


~Improvised Attack~:
    HasMixins: true
    A: Half-Action
    DisplayA: "{DisplayA}"
    Range: "{Range}"
    Requirement: Only for Heroes
    Effect: |
        Attack with an object or body part for {Value} (Slash, Smash or Pierce Damage, depending on the object).
    Notes: |
        Body parts are considered weapons.
        Monsters' Improvised Attacks take a Half-Action and deal 1d4 Damage.
    Variants:
        - Range: 1 meter (or weapon range)
          Value: 1d6
        - Range: 2-5 meters
          Value: 1d4

~Push~:
    Requirement: 1 {Might}
    A: Half-Action
    Range: 1 meter
    Effect: Slam a non-Epic, max medium-sized Unit 1 meter in any direction you choose.