General Description: |
  QuestGuard is a quirky alternative tactical TTRPG that plays like a video game - fast, punchy, and made to be broken. It's focused on combos, character builds and progression, and solid pacing, while also being much simpler than most TTRPG's that are out there.


  It's an asymmetrical game: each race and class functions differently. Firstly, you can play as a lot of different types of races by choosing how you customize your base race. If you're a Bertle, you can be an animal folk ranging from a small squirrel-folk to a large, menacing lion man, to a mantis shrimp who punches people to death. If you're a giant you can customize yourself to be an orc, troll, two-headed ogre, ettin, and many other. If you're a littlefolk, you can be anything from a gnome to a gremlin to a pixie. Not even talking about the elves, humans, etc, who are just as customizable.



  And the way it works is also each race has its own gimmick: Dwarves can wear 2 sets of armor, Hollows (cursed folk) are 1 level above the rest of the party, etc.



  There are plenty of ways that QuestGuard plays like a video game: you may be able to generate gold out of thin air (thieves are good at this!) and you may even be able to farm enemies for permanent character upgrades.

  There's no such thing as roll to hit, saving throws, rests, armor class, etc. What you see on the dice is what you get.


  As a quick refresher on the rules of combat, you have 3 Action Points on your Turn which you can use as you like (attacking, moving, casting spells, etc - unlike Pathfinder 2e, there are no diminishing returns). There are 4 main stats in the game, and we use a 2d6 Check system that awards Plot Points on equals on the rolls.


  The game right now is fully online at https://questguardrpg.com, where you can find all the content and plenty of tools. The website is gorgeous, professionally made and has a lot of fully working useful features, such as a Hero Creator, similar to the one on D&D Beyond, which saves your characters to the cloud. For the Quest Masters, there's a random item generator, support for homebrew, and a ton more.

Marketing and Monetization Plan: |
  1. The game will stay website-first. Any updates and new content is always up to date on the website. The intent is to release balance changes and tweaks every now and then to keep the game balanced and free of unwanted interactions. The game online has a free tier of content, and, on release, there will be one premium tier of content. The free content includes 5/8 of the races and 7/11 of classes, as well as 66% of the content such as monsters and whatever other content. Everyone will have access to these, without paying. The rest is under a premium tier, which I will explain how it works next.
  
  2. Monetization As I mentioned, there is the free content, and the premium content. There are 2 ways to buy the premium content: a. Simply buy the premium content online, directly on the website. It will be around $10, and it's a one-time purchase. b. Buy the physical book*, which will be available to the backers on kickstarter, and the starting price will be around $50. Once you buy the book, you automatically get a code which you can enter on the website to connect the book to your account and automatically unlock the premium content. To keep the game's content alive and well, there will be extra content coming in bundles throughout the years, with about 1 content update per quarter, probably for $5.
  
  3. This is the release plan: I will launch a kickstarter campaign, where the main product will be the physical book, which contains all compiled data on the website, including the rules, guides, content, and some dedicated book-only content, tips, and art. The book is automatically generated based on the website's content, but is also hand-edited and contains dedicated content.
  
  4. On the kickstarter campaign, I will have campaign goals and various tiers for backers.