
Description: |
  At the end of every Adventure, each Player Character gets a Positive or Negative Quirk. Quirks are extra small effects that signify character development, be it toward the good or the bad.
  
  Based on how the Adventure fared, the Quest Master will determine if all players get a Positive or Negative Quirk, and the Quest Master decides what quirk to give to which player.
  Even in victory, some adventures may have been detrimental to a character's personality. A victory in the face of undead may cause a phobia, or a tight win in sparring may result in a permanent physical trauma.

  A Character may get the same Quirk twice!
  
  As a general rule of thumb, player should receive Positive Quirks half of the time, and Negative Quirks the other half. As an alternative rule, each player gets both a Negative and a Positive Quirk at the end of every Adventure, chosen by the Quest Master.
Quest Master Tips: |
  Avoid giving Quirks that ruin player builds, such as decreasing their highest stat with Personal Development, lowering their Initiative too much that it breaks their Initiative-heavy build, or giving them a Weak Grip for their primary weapon.

  If not much has happened along the Adventure, prefer giving small Quirks such as Practiced or Clumsy in a specific non-Combat Skill, or Weak Grip for a weapon type they're not using, etc.

Positive:


  Monster Hater:
    DisplayName: "{Name}"
    Effect: "You have +Half-Action on your first Turn in Combat against {Monster}s."
    Upgrade: "{Description}"
    Tags: Hatred
    Variants:
      - Monster: Beast
        Name: Hunter of Beasts
        Description: You've grown accustomed to tracking, studying, and slaying wild animals, as you better understand both their strengths and weaknesses.
      - Monster: Undead
        Name: Hatred for the Unholy
        Description: The stench of decay and unholy corruption fills you with righteous fury. You feel sick in the stomach with anger when the unholy is mentioned.
      - Monster: Demon
        Name: Intolerant to Blasphemy
        Description: You cannot stand those who defile faith or mock the divine. Heresy provokes not fear in you, but action.
      - Monster: Fiend
        Name: Conspiracy Disprover
        Description: You tend not to believe far tales, legends and stories until seen with your own eyes, as you've seen how lies twist men into madness.
      - Monster: People
        Name: Scum Scorn
        Description: You've had enough of human cruelty. Thievery, hipocricy, and crime disgust you, and you'll gladly dirty your hands to make the world cleaner.
      - Monster: Plant
        Name: Annoyance With Nature
        Description: After too many battles with roots, vines, and swarms, you’ve lost your reverence for the natural world. You see its beauty as camouflage for its hostility.
      - Monster: Giant Insect
        Name: Pest Repulsion
        Description: Buzzing wings and skittering legs make your blood boil and your skin crawl. Food for the ecosystem - that's their only purpose. Insects are not welcome around people.
      - Monster: Giant
        Name: Loather of the Colossal
        Description: You feel no awe for titanic creatures, buildings or mountain peaks. Tall structures are to you nothing more than a show of opulence.
      - Monster: Vampire
        Name: Vindicator of Accursed
        Description: You cannot ignore those twisted by curses, corruption, or unnatural afflictions. You see it as your duty to strike at what has been defiled, ensuring the cursed suffer no further harm—or spread it no further.
      - Monster: Fey
        Name: Down to Earth
        Description: Illusions, mind-altering substances, and trickery offend you. You prefer clarity, sobriety, and honesty; nothing that clouds the senses or bends reality earns your trust.
      - Monster: Dragon
        Name: Disrespect for the Ancient
        Description: The wisdom of old beings or relics no longer impresses you. Age alone is no guarantee of authority, and you meet the ancient with your eyes rolling rather than reverence.
      - Monster: Elemental
        Name: Spite for the Elements
        Description: Fire, ice, and storm have all burned or frozen you once too often. Now, you turn their fury back upon them. Bad weather annoys you and puts you in a bad mood.
      - Monster: Monstrosity
        Name: Monster Abhorrence
        Description: You've seen too many horrors that should not exist. Their forms offend your very sense of order, and you take satisfaction in erasing them.
      - Monster: Machine
        Name: Rage Against the Machines
        Description: You see automation as a corruption of people's work, and nothing good comes from replacing people with soulless metal slaves. Ropes and pulleys may or may not be useful, but you prefer doing things with your own hands.
      - Monster: Celestian
        Name: Blasphemer
        Description: You have turned your back on gods and holy law alike. You see the divine as flawed tyrants, and you'll tear down their symbols with your own hands. Weaponized or fake religion should be destroyed.
      - Monster: Spellcaster
        Name: Hatred for Witches
        Description: You bear a deep distrust—and often hatred—of those who wield magic through ritual or spell. To you, these are cheaters of the hard-working men. Witchery is evil. Period.
      - Monster: God
        Name: God Slayer
        Description: You've glimpsed divinity and found it wanting. Whether mortal or celestial, no being has the right to rule over you. You start hating being commanded what to do, especially if there's no sense of mortal equality between you and your boss.

  Overcome Trauma:
    Effect: Remove a certain Negative Quirk, chosen by the Quest Master.

  Personal Development:
    Effect: Optionally, get -1 in a Stat of choice, and +1 in a different Stat of choice (up to your Level's limit).

  More Disciplined:
    Effect: You can have +1 known Minor Talent.
  
  Better Problem Solving:
    Effect: Pick an extra Utility Talent (from any Level available).

  Practiced in Skill:
    Effect: Get +1 in a non-combat activity the Quest Master chooses.
  
  Higher Pain Tolerance:
    Effect: +2 Max Health
  
  Increased Stamina:
    Effect: +1 Health Regen

  Heightened Awareness:
    Effect: +1 Initiative

Negative:

  Phobia of Monster:
    DisplayName: "{Name}"
    Effect: "You have -Half-Action on your first Turn in Combat {Monster}."
    Upgrade: "{Description}"
    Tags: Phobia
    Variants:
      - Monster: against Beasts
        Name: Zoophobia
        Description: You feel tense and uneasy around animals or beasts. Even harmless creatures might make your heart race and hands tremble. Even if tamed, beasts are beasts, after all...
      - Monster: against Undead
        Name: Anxiety Around Cadavers
        Description: The sight or stench of corpses fills you with dread. You flinch around the dead, and the smell of decay makes you feel faint.
      - Monster: against Demon
        Name: Susceptible To The Occult
        Description: Symbols, rituals, or whispered incantations unsettle you. You are easily unnerved by mysterious or demonic forces.
      - Monster: against Fiend
        Name: Fear of the Unknown
        Description: Unfamiliar situations and unseen threats make you hesitate. You prefer caution over action, fearing what might lurk beyond sight.
      - Monster: against People
        Name: People Doubter
        Description: People are the deadliest of monsters. They are unpredictible, and capable of horrors no other creature can imagine. You distrust others instinctively. Friends, strangers, and foes alike leave you wary and prone to misjudgment.
      - Monster: against Plant
        Name: Spring Melancholy
        Description: When the world blooms, you feel heavy-hearted and distracted. The change of seasons saps your focus and vigor, and being in the wilderness only makes it worse.
      - Monster: against Giant Insect
        Name: Skittering Dread
        Description: The sound of crawling, clicking, or buzzing makes you flinch. Insects and other small creatures disturb your mind and reflexes.
      - Monster: against Giant
        Name: Megalophobia
        Description: You feel no awe for titanic creatures, buildings or mountain peaks. Tall structures are to you nothing more than a show of opulence.
      - Monster: against Vampire
        Name: Superstitious
        Description: You take every omen, rumor, and local superstition seriously. Fear drives you to follow rituals and avoid taboo actions. You take heed of the legends. You just never know...
      - Monster: against Fey
        Name: Rapid Eye Movement
        Description: You are jittery and easily startled. Sudden motions or distractions disrupt your focus, leaving you tense in combat. Does the shadow play tricks on you? Or is it just your immagination?
      - Monster: against Dragon
        Name: Fear of Dragons
        Description: Winged, scaled, and fire-breathing foes terrify you. The shadow of a dragon or its roar can make your courage falter. Such creatures are not made to be fought by mortals. In the face of dragons, we should flee while we can.
      - Monster: against Elemental
        Name: Sensitive To Sensations
        Description: You notice every drop of water falling from the ceiling. You can't help but feel every little gust of drought and shift in temperature and pressure, and they all make you anxious. Are these natural, or is someone doing it on purpose?
      - Monster: against Monstrosity
        Name: Horror of the Flesh
        Description: You are unnerved by mutilation, mutation, or grotesque flesh. Aberrations and monstrosities trigger revulsion and hesitation. Your stomach is turned upside down at the sight of deformity.
      - Monster: against Machine
        Name: Gear Anxiety
        Description: Clockwork, constructs, and automatons unsettle you. Their precision and soulless efficiency make your instincts overcautious.
      - Monster: against Celestian
        Name: Unease With The Divine
        Description: Divine beings or symbols make you wary. Their presence feels oppressive, leaving you hesitant to act or speak. Let's not disrespect religion.
      - Monster: against Spellcaster
        Name: Jitters From Magic
        Description: Spells, rituals, or magical effects make you nervous and distracted. Even minor enchantments provoke anxiety, for they could be evil effects in disguise and fulminate when you least expect it.
      - Monster: against God
        Name: God Fearing
        Description: The presence or judgment of deities terrifies you. You act cautiously and deferentially, haunted by their potential wrath. Someone may always be watching. Best be careful...
      - Monsters: near a body of water, such as a lake, a river, the sea or ocean
        Name: Thalassophobia
        Description: The sight or sound of deep water unsettles your nerves. Ripples hide unseen depths, and even gentle waves feel like they are calling you under, to what might lurk beneath.
      - Monsters: on an elevated surface with a risk of falling, such as a downward cliff, a platform, or a floor with windows
        Name: Fear of Heights
        Description: Open ledges and towering places unsettle your balance. Your stomach tightens at the thought of falling, and every step near an edge feels like the ground might slip away beneath you.
      - Monsters: in confined spaces, such as narrow corridors or small rooms
        Name: Claustrophobia
        Description: Walls close in. Air feels thin. Heart pounds. Every step crushes. You can't breathe. You must get out.
      - Monsters: in crowded places, be the crowd monsters or people. You also have -2 in Public Speaking
        Name: Social Anxeity
        Description: Every word you might say twists in your mind before it leaves your mouth and every glance feels loaded with judgment or every pause seems like a spotlight on your flaws, and you imagine a hundred ways people could think poorly of you, so you hesitate, stumble, and wish you could disappear before even trying.

  Traumatized:
    Effect: You get -1 in a certain Stat, and +1 in a different Stat (up to your Level's limit). The Quest Master decides what stats are changed.
  
  Clumsy:
    Effect: Get -1 in a non-combat activity the Quest Master chooses.
  
  Fatigue:
    Effect: Get -1 Health Regen.
  
  Permanent Scar:
    Effect: Get -2 Max Health.
  
  Distracted:
    Effect: -1 Initiative

  Irritable Bowel Syndrome:
    Effect: Whenever you drink a potion or elixir, you take 1d6 True Damage.
  
  Weakened Grip:
    Effect: You can no longer use a certain type of weapon, chosen by the Quest Master (e.g. Longswords, Heavy Crossbows, etc).

  Untalented:
    Effect: Lose a certain Talent you currently have, chosen by the Quest Master. You can never pick it again. You may respec inbetween Adventures.
  
  Itches:
    Effect: You can't wear Light, Medium or Heavy armor, chosen by the Quest Master.