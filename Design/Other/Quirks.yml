
Positive:

  Talented:
    Effect: Pick an extra Level 1 Talent.
  
  Skilled:
    Effect: Become Skilled in a non-combat activity the Quest Master chooses.
  
  Healthy:
    Effect: +2 Max Health
  
  High Stamina:
    Effect: +1 Health Regen

  Fast:
    Requirement: Level 5
    Effect: +1 Movement Speed

Negative:

  1. Physically Injured:
    Effect: Get -1 in Body or Heart, chosen by the QM.

  2. Traumatized:
    Effect: Get -1 in Mind or Soul, chosen by the QM.
  
  3. Clumsy:
    Effect: Become Clumsy (or lose Skilled) in a non-combat activity the Quest Master chooses.
  
  4. Afraid in Combat:
    Effect: Start combats with certain things Single-Stunned. The Quest Master decides what you're afraid of.
    Notes: This could be anything from a monster type (Humanoid, Beast, Undead, etc) to an environment, certain objects, elements, etc.

  5. Untalented:
    Effect: Lose a certain Talent you currently have, chosen by the Quest Master. You can never pick it again. You may respec inbetween Adventures.

  6. Phobia:
    Effect: Gain a phobia of something chosen by the Quest Master. You roll with Disadvantage on all Checks if your phobia trigger is around.
  
  7. Irritable Bowel Syndrom:
    Effect: You can't drink potions.
  
  8. Obsessed:
    Effect: You become obsessed with a certain Skill you already have. You gain +1 on Checks for that Skill, but -1 in all other Checks.

  9. Body Trauma:
    Effect: -2 Health or -1 Health Regen, chosen by the Quest Master.

  10. Weak Grip:
    Effect: You can't use 1-handed or 2-handed weapons, chosen by the Quest Master.