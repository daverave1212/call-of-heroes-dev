




Introduction:
  What We Want: |
    I want to slay monsters, quickly and with awesome combos. I want simple rules, but deep tactical thinking. I want freedom of choice and meaningful character progression, I want to feel like I am playing a medieval fantasy video game with my friends at the table. I want to run games for my friends, and tell my story at my own pace! I want no redundant rolls, few look-up tables, no <i>Saving Throws</i> or other elements that make the game slower. I want to <i>farm mobs</i>!
    I want to play like my generation of gamers wants to play!
    And this is why we made QuestGuard\: a heroic tabletop role-playing game based both on slaying foes, and ever-growing characters. And if you want the same thing, you're in the right place. Keep on reading, stranger, and welcome to QuestGuard!

  Welcome To QuestGuard: |
    A role-playing game (RPG) is a game (either a video or at the table) where you control a hero, battle monsters and go on wonderous adventures and quests.
    RPG's are one of the most common genres of video games, like Skyrim, Baldur's Gate, World of Warcraft, etc. To some extent, you can even consider games like League of Legends to be RPG's.
    
    Imagine if instead of playing it on the computer, you played it with your friends at the table. And instead of being restricted to prewritten lines of dialogue, you can say whatever you want, to whomever you want, wherever you want. That's essentially a tabletop RPG! You can do anything you choose!
    Of course, you need rules to play, like in a board game. So there are dice, maybe cards, abilities, and turn-taking between players.

    And if you can literally say anything to any in-game character, no book or app could possibly contain the rules for every situation. Unless you're using a complex AI to run the world for you, we need something else. That's where the Quest Master comes in.
  
  Quest Master: |
    One of the players will play as a storyteller, called a Quest Master. They are the referee, judge and jury of the game. Generally, the Quest Master creates the world, narrates everything that happens, roleplays the characters you meet, controls the monsters, and designs the dungeons and quests you will explore.

    The job of the Quest Master is to make sure everyone has fun. The Quest Master is not the enemy, even though they play the monsters and villains.

    Ultimately, the Quest Master decides what is and isn't possible. If you say you want to “fly to the king, slay him, and teleport away,” you will need to respect the rules and get your Quest Master's approval to <i>try</i> that.
  
  Trying Things: |
    In Quest Guard, you can <i>theoretically</i> do anything. Or, at least, you can <i>try</i>.
    When you want to do something as a regular Hero (not the Quest Master), you usually need to roll dice to determine whether you succeed. This is called a “Check.”
    
    If you want to climb on top of a house, the Quest Master may ask you to roll a Check to see if you’re able to do it.
    Rolling a Check means rolling two regular cubic dice (called 2d6). If you roll high enough, you succeed. The Quest Master determines what total number you need to reach. Generally, rolling at least 10 means you succeed on a medium-difficulty Check. A difficult Check might require a 15 or higher.

    But hold on - the numbers you can roll range from 2 to 12. How could you ever roll a 15!?
    That's because you may get certain <i>bonuses</i> to your roll.
  
  Stats: |
    Each player's Hero is better or worse at certain things. If you're dexterous, you will get a bonus to the Check for climbing the house. Furthermore, if you're particularly good at climbing, you may get an additional on top of that!

    your Hero has five main Stats that determine how good you are at different activities. These Stats are: Might (physical power and constitution), Dexterity (agility and speed), Intelligence (knowledge and smarts), Sense (wisdom, willpower, and awareness), and Charisma (social aptitude and confidence).

    Each Stat ranges from -1 to +3, and they will grow over time as your Hero develops, in time.
    If you have a +3 in Dexterity, your Check to climb a house gains a +3 bonus. That means you don’t need to roll a 10 on the dice. You only need to roll a 7, which becomes a 10 after adding your bonus.
    
    Suddenly, rolling high enough doesn’t seem so impossible anymore.

  How We Play: |
    The game is generally played as follows: the Quest Master describes a situation. Then, the players decide together how they want to react. Each player takes turns declaring their actions. After that, the Quest Master resolves what happens and presents a new situation. Rinse and repeat.

    RPG stories are long. There are ways to lose, such as having all Heroes die. But there is no single way to win, and victory usually takes time. In fact, there may not even be a traditional “win” condition at all. Just like in a video game or TV series, success depends heavily on the Quest Master’s story.

    Many adventures take multiple sessions to complete. In QuestGuard, we are committed to long journeys. You may meet with your friends over many days, picking up where you left off each time. That’s part of the magic—there is always more to discover.

    You and your fellow players form a team. You are a band of adventurers, explorers, mercenaries, puzzle solvers, and sometimes even merchants or leaders.

    Work together. Respect each other and the Quest Master. Leave no one behind!
  
  <aside>I Don't Really Get It...</aside>: |
    The best way to understand the game is to watch it being played. We recommend the “Force Grey: Lost City of Omu” series on YouTube, or any Critical Role campaign. Just make sure you start from the first episode.
    Do note those series play Dungeons & Dragons, so while the rules may be different, the core vibe and feel are the same.

  What You Need:
    - 2-4 Friends: Going out can be difficult, especially in a post-pandemic world. You can search for local Facebook or Discord gaming groups to find players. The most common tabletop RPG is Dungeons & Dragons (D&D), so many groups use “D&D” as shorthand for tabletop RPGs in general. Ask at local game stores or gaming cafés. If you live remotely, online play is more popular than ever. Join D&D or Looking For Group communities on Reddit, Facebook, or Discord and make a post. You'll find people quickly.
    - Dice: You will need two six-sided dice for Checks, but a full RPG dice set is recommended. These include four-sided (d4), six-sided (d6), eight-sided (d8), ten-sided (d10), twelve-sided (d12), and twenty-sided (d20) dice. They are easy to find online or at game stores. If you play online, free digital dice rollers are widely available. Even Google has a built-in dice roller.
    - The Rules: Congratulations! You already have them! This book contains the complete rules of the game and more. You can also find most of them online at <i>https://questguardrpg.com</i>, free of charge.
    - Pen & Paper (or device): A notebook will be your best friend in writing notes, keeping track of your quest journal, and, most importantly, tracking your Hero's powers. Luckily, if you hate writing by hand, we have online tools on our website to help you keep track of your Hero. More on that later!
    - Other: Many RPG groups use miniature figures, terrain, maps, etc. The fun part in tabletop RPG's is you can make your own <i>board</i>, on a square grid each representing one meter, and figurines or tokens to represent each character. While you don't necessarily require a grid and miniatures, we recommend using something (anything) to represent each character on the battlefield. Of course, if you're playing online, all of that will be taken care of for you!

  <aside>Is There a Tutorial?</aside>: |
      Yes! Simply search “how to play QuestGuard” on YouTube to find dedicated video tutorials that walk you through everything step by step.

