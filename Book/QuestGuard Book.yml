Introduction:
  What We Want: |
    I want to slay monsters, quickly and with awesome combos. I want simple rules, but deep tactical thinking. I want freedom of choice and meaningful character progression, I want to feel like I am playing a medieval fantasy video game with my friends at the table. I want to run games for my friends, and tell my story at my own pace! I want no redundant rolls, few look-up tables, no <i>Saving Throws</i> or other elements that make the game slower. I want to <i>farm mobs</i>!
    I want to play like my generation of gamers wants to play!
    And this is why we made QuestGuard\: a heroic tabletop role-playing game based both on slaying foes, and ever-growing characters. And if you want the same thing, you're in the right place. Keep on reading, stranger, and welcome to QuestGuard!

  Welcome To QuestGuard: |
    A role-playing game (RPG) is a game (either a video or at the table) where you control a hero, battle monsters and go on wonderous adventures and quests.
    RPG's are one of the most common genres of video games, like Skyrim, Baldur's Gate, World of Warcraft, etc. To some extent, you can even consider games like League of Legends to be RPG's.
    
    Imagine if instead of playing it on the computer, you played it with your friends at the table. And instead of being restricted to prewritten lines of dialogue, you can say whatever you want, to whomever you want, wherever you want. That's essentially a tabletop RPG! You can do anything you choose!
    Of course, you need rules to play, like in a board game. So there are dice, maybe cards, abilities, and turn-taking between players.

    And if you can literally say anything to any in-game character, no book or app could possibly contain the rules for every situation. Unless you're using a complex AI to run the world for you, we need something else. That's where the Quest Master comes in.
  
  Quest Master: |
    One of the players will play as a storyteller, called a Quest Master. They are the referee, judge and jury of the game. Generally, the Quest Master creates the world, narrates everything that happens, roleplays the characters you meet, controls the monsters, and designs the dungeons and quests you will explore.

    The job of the Quest Master is to make sure everyone has fun. The Quest Master is not the enemy, even though they play the monsters and villains.

    Ultimately, the Quest Master decides what is and isn't possible. If you say you want to “fly to the king, slay him, and teleport away,” you will need to respect the rules and get your Quest Master's approval to <i>try</i> that.
  
  Trying Things: |
    In Quest Guard, you can <i>theoretically</i> do anything. Or, at least, you can <i>try</i>.
    When you want to do something as a regular Hero (not the Quest Master), you usually need to roll dice to determine whether you succeed. This is called a “Check.”
    
    If you want to climb on top of a house, the Quest Master may ask you to roll a Check to see if you’re able to do it.
    Rolling a Check means rolling two regular cubic dice (called 2d6). If you roll high enough, you succeed. The Quest Master determines what total number you need to reach. Generally, rolling at least 10 means you succeed on a medium-difficulty Check. A difficult Check might require a 15 or higher.

    But hold on - the numbers you can roll range from 2 to 12. How could you ever roll a 15!?
    That's because you may get certain <i>bonuses</i> to your roll.
  
  Stats: |
    Each player's Hero is better or worse at certain things. If you're dexterous, you will get a bonus to the Check for climbing the house. Furthermore, if you're particularly good at climbing, you may get an additional on top of that!

    your Hero has five main Stats that determine how good you are at different activities. These Stats are: Might (physical power and constitution), Dexterity (agility and speed), Intelligence (knowledge and smarts), Sense (wisdom, willpower, and awareness), and Charisma (social aptitude and confidence).

    Each Stat ranges from -1 to +3, and they will grow over time as your Hero develops, in time.
    If you have a +3 in Dexterity, your Check to climb a house gains a +3 bonus. That means you don’t need to roll a 10 on the dice. You only need to roll a 7, which becomes a 10 after adding your bonus.
    
    Suddenly, rolling high enough doesn’t seem so impossible anymore.

  How We Play: |
    The game is generally played as follows: the Quest Master describes a situation. Then, the players decide together how they want to react. Each player takes turns declaring their actions. After that, the Quest Master resolves what happens and presents a new situation. Rinse and repeat.

    RPG stories are long. There are ways to lose, such as having all Heroes die. But there is no single way to win, and victory usually takes time. In fact, there may not even be a traditional “win” condition at all. Just like in a video game or TV series, success depends heavily on the Quest Master’s story.

    Many adventures take multiple sessions to complete. In QuestGuard, we are committed to long journeys. You may meet with your friends over many days, picking up where you left off each time. That’s part of the magic—there is always more to discover.

    You and your fellow players form a team. You are a band of adventurers, explorers, mercenaries, puzzle solvers, and sometimes even merchants or leaders.

    Work together. Respect each other and the Quest Master. Leave no one behind!
  
  <aside>I Don't Really Get It...</aside>: |
    The best way to understand the game is to watch it being played. We recommend the “Force Grey: Lost City of Omu” series on YouTube, or any Critical Role campaign. Just make sure you start from the first episode.
    Do note those series play Dungeons & Dragons, so while the rules may be different, the core vibe and feel are the same.

  What You Need:
    - 2-4 Friends: Going out can be difficult, especially in a post-pandemic world. You can search for local Facebook or Discord gaming groups to find players. The most common tabletop RPG is Dungeons & Dragons (D&D), so many groups use “D&D” as shorthand for tabletop RPGs in general. Ask at local game stores or gaming cafés. If you live remotely, online play is more popular than ever. Join D&D or Looking For Group communities on Reddit, Facebook, or Discord and make a post. You'll find people quickly.
    - Dice: You will need two six-sided dice for Checks, but a full RPG dice set is recommended. These include four-sided (d4), six-sided (d6), eight-sided (d8), ten-sided (d10), twelve-sided (d12), and twenty-sided (d20) dice. They are easy to find online or at game stores. If you play online, free digital dice rollers are widely available. Even Google has a built-in dice roller.
    - The Rules: Congratulations! You already have them! This book contains the complete rules of the game and more. You can also find most of them online at <i>https://questguardrpg.com</i>, free of charge.
    - Pen & Paper (or device): A notebook will be your best friend in writing notes, keeping track of your quest journal, and, most importantly, tracking your Hero's powers. Luckily, if you hate writing by hand, we have online tools on our website to help you keep track of your Hero. More on that later!
    - Other: Many RPG groups use miniature figures, terrain, maps, etc. The fun part in tabletop RPG's is you can make your own <i>board</i>, on a square grid each representing one meter, and figurines or tokens to represent each character. While you don't necessarily require a grid and miniatures, we recommend using something (anything) to represent each character on the battlefield. Of course, if you're playing online, all of that will be taken care of for you!

  <aside>Is There a Tutorial?</aside>: |
      Yes! Simply search “how to play QuestGuard” on YouTube to find dedicated video tutorials that walk you through everything step by step.

Using This Book:
  What's In It?: |
    The QuestGuard Core Book doesn't just explain the rules, but it contains all the <i>content</i> you need to play. It includes all the base playable Races, Classes, equipment, monsters to fight against, tips and guides for the Quest Master, and much much more!
    Let your eyes wonder about the pages, and let your imagination flow!
  Website: |
    While this book contains so much of what you will need, the official QuestGuard website also contains much of it, though the book contains all the free and premium content available on release! However, the website may in the future complete the core rules with extra mentions, balance chances and improvements to the overall game, so do check out the website from time to time as to not miss important updates! The website is at <i>https://questguardrpg.com</i>.
  For D&D Players: |

    The following 2 sections are the <i>Beginner Guide</i> and the <i>Transition Guide</i>.

    ^If you're an RPG beginner^, read on to the next section - the Beginner Guide. After that, you can skip the Transition Guide (or read it for a quick recap).
    ^If you're coming from a different game^, like D&D or Pathfinder, you can skip the Beginner Guide and move on straight to the Transition Guide, on page TODO.
  Rules Glossary: |
    The last section of the book contains all rules, clarified and concrete. The end page contains a quick reference sheet for all the keywords and terms of the game.

For D&D Players:

  Text: |
    If you're coming from D&D or Pathfnder, here's what you should know: in QuestGuard there are no short or long rests, roll-to-hit attacks or defense, concentration rules, spell components, spell slot levels, <i>saving throws</i>, modifier tables, hit dice, opportunity attacks, success degrees, diminishing returns on actions, <i>proficiencies</i>, stat-to-skill lists, and there are hardly any tables.

    It's a 2d6 game as opposed to d20, and follows a 3-Action-Point system, very simillar to Pathfinder.

Get Started:
  How Do I Start?: |
    You’re already in it!
    You can create a character, quickly and without hassle, using our Character Creator, going to Create Character in the website menu. It will take you through everything you need!
    Also, our website https://questguardrpg.com features a “Play With Us!” button. Once clicked, it will redirect you to our Discord group, where we regularly host campaigns and one-shot adventures for new and old players alike!

    Feel free to say hi and show your Hero!
  
  What To Expect?: |
    In QuestGuard you will find more “gamified” elements, both for the heroes and for the Quest Master. The game plays somewhat like a board game, but one in which you have more freedom of choice. Character abilities are gamified for gameplay rather than realism, to be able to do things such as creating gold or magic items out of thin air or farming enemies. Characters can respec between Adventures, all monsters are tactical and change how you must approach combat, and this is the tip of the iceberg!

    There is <i>some</i> math involved, but most often, what you roll on the dice is what you get. There will be <i>halving</i> and <i>doubling</i> of numbers involved, some simple addition, and rarely subtraction.

    If long tables, lists and big boxes of rules text scare you, that's perfect! We avoid that in QuestGuard as much as possible.
  
  Non-Combat: |
    QuestGuard heavily focuses on battling enemies. There are 2 different types of gameplay: in-combat and non-combat. While not in combat, ther game focuses on the narrative aspect and interaction with the adventure constructed by the Quest Master. Traveling is abstract, there are more intricate descriptions, and time in-game passes abstractly, like in a book or movie. You may jump from scene to scene, from day to day, from moment to moment, doing things as you see fit. It's more abstract than palpable.
  
  Combat: |
    When combat begins, the pace shifts. Heroes and monsters will take turns, like in a board game, to try to defeat eachother. We use specific rules for attacking, casting spells, being hit, etc. It's more palpable than abstract. For example, during Combat, on your Turn, you have 3 Action Points each Turn that you can spend to do things, like move, attack, etc. You could spend 1 Action Point to move, then 1 Action Point to attack with a shortsword, then your last Action Point can be spent to cast a Spell. There's a specific section for Combat later on.

Playing the Game:

  Text: |
    Unlike board games and video games, QuestGuard requires you to use your imagination to create a so-called "theater of the mind". The Quest Master will do their best to immerse you in the story with lush descriptions of environments and characters in the story, and they may even show you reference images and music for what things look, sound, and feel like.
    Do you <i>feel</i> it? The atmosphere, the tension? Let yourself speak in the voice of your hero, and imagine, if for one second, that the people you're speaking to are the Heroes and story characters you're interacting with.

  Example of Play: |
    <b>Quest Master David</b>: You finally made it to the meeting point. Your contact, Varis, sits across from your, warming his hands at the campfire crackling softly in the forest clearing. "You're late" he mutters.
    <b>Arin the Knight<b>: I say boldly "We had company on the road. But nothing has stopped us so far."
    <b>Quest Master David</b>: Varis replies "Curious..."
    <b>Lira the Mage<b>: That's all he says? Something feels wrong. Can I check if there's anything suspicious about him?
    <b>Quest Master David</b>: Sure. Make a Sense roll. You're going to need at least 10.
    <b>Lira the Mage<b>: Here goes... 2d6... that's a 9. If I add my +2 Sense, that's an 11!
    <b>Quest Master David</b>: Success! His face is right. His voice is right. But as the fire flares… his shadow stays perfectly still.
    <b>Arin the Knight<b>: I approach lighty and ask him "Can you raise your hand for me?"
    <b>Quest Master David</b>: He looks surprised, but raises his hand. You notice his shadows hasn't moved.
    <b>Lira the Mage<b>: That's not a human! It's an ambush!
    <b>Quest Master David</b>: Varis reveals his sharp fangs as he grins, and quickly lunges at you! Prepare for battle!
  
  For Heroes: |
    If you're set on being a protagonist in the story, here's what you need to do: talk to your Quest Master to see what kind of adventure you'll be playing. Then, you and your friends (except Quest Master) each creates a Hero, so that your team is diverse and ready to face any obstacle!
    
    Remember: while it's a Hero's journey to follow the main story, you might have your own story and character arc!
    It all depends on what kind of adventure you play, and what kind of Quest Master you have.
  
  For Quest Masters: |
    If you like to tell intricate stories, create epic worlds, and like to entertain others, you should definitely be the Quest Master! You're the narrator, the referee, and the HR department of your group.
    
    Think of a story you want to tell. If you like vampires (like our friend Varis earlier), then make an adventure about vampires. If you like , make an adventure about dragons. If you like the Lord of the Rings, no one is stopping you from recreating it with your friends, or even expand on it by holding adventures in the that universe!

    However, note that Heroes will always choose a different course of actions. Let them! Let them keep the Ring and face Sauron in face-to-face combat! You just never know what the Heroes will do and how the story will progress. Let them try!

    But a small piece of advice: if you've never done this before, start small. Start with a short adventure around a village, or a journey through the mountains for an artefact. If it works out, keep expanding the story to keep the players engaged.

    There is a Quest Master guide at the second half of the book, at page TODO. You can read it for guidelines and tips from the very best of game masters.

Hero:
  Text: |
    Before setting out on your quests, you need a Hero to play as. Talk to your fellow Quest Master and players about what kind of group you want to be, and decide what role each of you should fill.
    A good party contains both close-range Heroes and artillery Heroes, one or more spellcasters and support or healer role. Of course, nothing is stopping you from being a full 5-people group of wizards!
  
  Character's Concept: |
    After deciding what role you want to fill, you should determine your broader concept for a Hero. Are you an orc barbarian seeking to avenge his tribe? An elf sorceress seeking a cure for her magical curse? Or a human farmer who was forced out of his town and into the greater world.
    What is your narrative, what is your ancestry, and what is your specialization?
    What are you good and bad at? What are you afraid of and what do you like? What is your relationship to your other party members? Did you know eachother before setting out, or did you meet in a tavern? Are any of the two of your brothers, lovers, or enemies?
    And most importantly, what is your name?

  What Makes a Hero:
    Text: Each Hero must pick a Race, a Class, and some starting equipment. All of these will be written on your Hero Sheet -- a piece of paper (or web page) that contains all the information about your Hero. Listed here are the basics of each. There are separate chapters for the Race and Class. Follow them, in order.
  
    A. Hero Sheet: You will need a place to keep track of all your Hero's abilities and aptitudes. You can either use a sheet of paper that you can print and fill in the fields, or use the online My Character tracker.

    B. Race: Your Race is your species, and each species has plenty of different ancestries to pick from. Your Race determines not just your roleplay and story opportunities, but also your physical and mental capabilities. Giants are <i>usually</i> larger and stronger than Littlefolk. But that's not to say you can't have a Littlefolk who is stronger than a Giant! You will find all the options summarized in the next pages.

    C. Class: Your Class is your combat archetype. Examples of Classes are Warrior, Wizard, Rogue and Hunter, but there are plenty of Classes to pick from, each with hundreds of possible ways to play!

    D. Equipment: Every Hero needs solid armor, a trusty blade or a mage's robe if that's your type. You'll have a budget of 1000 Gold to spend to buy your starting equipment.

  Let's Go!: Following, you will find a reference with all core Races and Classes in QuestGuard. Pick a combination of 2 that you like, without worrying about the nitty-gritty, then we'll start filling in that character sheet! If you are completely new to this type of game, we recommend sticking to <i>easy</i> Races and Classes.

Races Reference: 
  
  Bertle: Bertles are animal people. Big, small, scaly or furry, they come in all shapes and sizes!
  
  Dragon: Dragons scare mortals. Hero Dragons may be large and fierce, or have humanoid forms.

  Dwarf: Dwarves are short but stout. They are the miners, builders and vikings of fantasy.

  Elf: Elves have a very wide range of genes. High Elves, Wood Elves, Dark Elves, Snow Elves...

  Giant: Giant is a term encompassing large creatures, like Orcs, Ettings, Ogres, and other.

  Human: Humans are everywhere, with a wide array of skills. 

  Hollow: Hollows are the accursed of the universe, the Vampires, Werewolves and the Undead.

  Littlefolk: Littlefolk are the Gnomes, Goblins, Gremlins, Leprechauns... oh, the Leprechauns...

Classes Reference:

  Artificer:
    Difficulty: Hard
    Text: Inventors who trade their Sense for advancement. They brew potions, build devices, and may graft metal or mutations onto themselves and allies. Some seek perfection through metal, others embrace humanity. As they level, their choices permanently reshape who they are, getting closer that ideal form.

  Cleric:
    Difficulty: Easy
    Text: Wielders of light and shadow, whose actions trigger Awe, damaging foes or healing allies. As they level, their Awe becomes stronger but more focused on their faith in the light or the dark.They can fill any role, nd Some of their blessings become permanent.

  Druid:
    Difficulty: Hard
    Text: Nature-bound spellcasters whose magic changes with the environment. Each spell gains altered or enhanced effects based on terrain, weather, or elemental presence. Shapeshifting is optional, but specialists can build entirely around adaptive beast forms.

  Hunter:
    Difficulty: Medium
    Text: Tacticians who fight through customized animal companions. They rely on positioning, tracking, and pet synergy rather than spellcasting. Many talents enhance or modify their pets instead of themselves, and Beastmasters can command two permanent companions.

  Knight:
    Difficulty: Hard
    Text: Armored combo fighters who chain abilities together. Each attack improves the next, rewarding sequencing and planning. Their chosen Creed defines their style, such as the Creed of the Rose, Dragon, or Crown, and they employ squires, mounts, banners, or siege tools to shape the battlefield.

  Rogue:
    Difficulty: Easy
    Text: High-burst assassins and precision thieves. They don’t use mana — instead, every talent is a powerful Major Talent, built for decisive plays. They specialize in single-target elimination and economic manipulation, turning cunning into lethal advantage.

  Shaman:
    Difficulty: Medium
    Text: Spirit-channelers whose spells can echo to cast twice through spiritual resonance. They guide allies toward enlightenment and inner clarity, empowering their team through shared spiritual balance and unpredictable duplication.

  Sorcerer:
    Difficulty: Easy
    Text: Uncontrollable magic gamblers. Each turn, they roll a customizable 1d10, triggering unique effects based on the result. Players define what each number does, shaping their own chaos engine while riding unpredictable surges of power.

  Swashbuckler:
    Difficulty: Easy
    Text: Charming duelists and fearless fencers who live for spectacle. They leap, taunt, and fish for critical strikes, chaining them into deadly flourishes. Built for high noon standoffs, duel-to-the-death showdowns, and swinging on chandeliers in pursuit of glory.

  Warlock:
    Difficulty: Medium
    Text: Combatants who gain Evoke Points during battle and spend them on devastating effects. Though often seen as dark spellcasters, Warlocks are highly versatile, able to tank, heal, wield weapons, or dominate with magic depending on their source of magic.

  Warrior:
    Difficulty: Medium
    Text: Combat generalists who choose a personal War Craft to define their style. They use mana to wield wide tactical options, and can even borrow Fire or Frost spells as physical techniques and martial effects. Built for flexibility, they can deal damage, protect allies, or even heal to fill hybrid roles.

  Wizard:
    Difficulty: Medium
    Text: Elemental specialists with the largest mana pools and the widest spell access. They focus on Fire, Frost, Shock, or pure arcane magic. The longer combat lasts, the stronger they become, scaling steadily into overwhelming power.

Hero Sheet:
  Which One To Get: |
    You can either download and print a Hero Sheet from the website, navigating to the <b>Game</b> tab and clicking on <b>Hero Sheet</b> under the <b>Downloads</b> section. You can print it and fill it in with a pen.
    If you prefer to do it digitally, there's also a form-fillable PDF version, under the same <b>Downloads</b> section. You can open it on a device with an app like Adobe Acrobat or Google Chrome, fill in the forms, and <b>save</b> it somewhere safe.
    Finally, if you want to go full digital and store your character in the cloud, you can log in with a Google account on the website and click on <b>Create Hero</b>. There you can simply follow the tabs one by one, going through each choice, then hit <b>Save</b>. Simply follow the guidelines and tips displayed.
    <i>The process for using the <b>Create Hero</b> app may be slightly different, depending on when you're reading this.

    There are also a few pregenerated Heroes you can use as an example, to help you through your Hero creation.

  Names: |
    Start by filling in the name of your Hero, and your chosen Race and Class. On the right side (WIP) of the sheet, you will find a blank space where you can either draw or stick an image of what your Hero looks like. If you prefer writing, you can jot down how your character looks, what aura they give, and their overall personality.
    You can write about their goals, backstory, fears, and wants. And feel free to personalize the rest of your character sheet's empty space with drawing, writing or whatever will make it feel more homely.

  Level:
    Text: |
      Each Hero's advancement in their adventure is noted by their Level. A Hero usually starts at Level 1 and can grow stronger and more keen up until Level 10, which is the maximum Level.
      Some Quest Masters opt to start their story with Heroes already more advanced, and at higher Levels! If so, then simply start at Level 1, and then follow the steps detailed in the Leveling Up chapter, on page TODO.
    +Experience: |
      A Hero Levels up when they gain enough experience through adventuring. The Quest Master may award Experience Points to Heroes who complete quests, slay enemies, engage in meaningful roleplay, solve problems and puzzles, etc.
      Every Hero starts with 0 Experience Points (XP).

      To Level Up, you need an extra number of XP equal to 100 × your Level. Thus, when you are Level 1, you need 100 XP to reach Level 2. Then you need another 200 XP to reach Level 3, then another 300 XP to reach Level 4, and so on.

      Some Quest Masters opt out of Experience entirely, and award Levels directly after reaching certain milestones in the story. If you're a beginner Quest Master, this is the recommended approach to managing your players' Heroes' Levels.

Stats:
  Text: |
    There are 5 Stats in QuestGuard, and these reflect your strengths and weaknesses: Might (physical strength and pain tolerance), Dexterity (speed and agility), Intelligence (knowledge and magic prowess), Sense (the 5 senses and willpower), and Charisma (social game and initiative).
  Fill in the 5 Stats:
    Text: |
      On your Hero sheet, you have 5 boxes on the left (WIP), each corresponding to one of the 5 Stats. You need to fill these boxes with the numbers -1, 0, 1, 2, 3, in any order you like. For example, if your Hero is very intelligent but quite frail, you can have 3 in Intelligence and -1 in Might.
    Restrictions: |
      However, note that some Races will impose some restrictions on the way you distribute your Stats, namely Bertle, Giant, and Hollow. I recommend starting with a Race that is tagged as Easy on the Race quick-reference page.
  
  What Stats Do: |
    Whenever you roll a Check (2d6), you will add your appropriate Stat to that Check. For example, if the Quest Master wants you to make a Sense Check, you will roll 2d6 and add your Sense to that roll (yes, even if your Sense is -1)!

  What Each Stat Does:
    - Might: Increases your maximum Health (each Might increases your Max Health by 3).
    - Dexterity: Increases your Movement Speed (each Dexterity increases your Movement Speed by 0.5 meters).
    - Intelligence: Increases the number of Spells and Abilities you can have (each Intelligence allows you to pick an extra Talent, explained later).
    - Sense: Increases your Health Regen after combats (each Sense increases your Health Regen by 2).
    - Charisma: Increases the number of Actions you can take on the first Turn each combat (each Charisma increases your Initiative by 0.5).

Race & Combat Attributes:
  Text: Next up, we will complete the Hero Sheet with everything the Race gives you, plus the <i>Combat Attributes</i> on your Hero Sheet. You will want to put a bookmark on this page and the Race page, because you will need to flip between them. First, flip to your Race's page (or navigate online on the website to your Race's web page). The Races section of the book starts at page (WIP).

  Combat Attributes:
    Text: |
      Near the 5 Stats, on the center of the page (WIP), you will find the 4 Combat Attributes: Max Health, Health Regen, Movement Speed, and Initiative. Some of these are self explainatory, but we will go one by one and fill them in. Your chosen Race will determine your Max Health and Health Regen, so we will start with those.
    
    Max Health: |
      Max Health (or HP) determines how many hits you can take in battle before you go down. If you have 10 Health and take a hit for 6 Health, you will be left with 4 Health.
      <b>Fill In:</b> Check your Race's page. Under Race Features, there's a box (WIP) for Max Health. Calculate your Max Health based on what it says in that box. This calculation is always a flat number (different for each Race), plus your Might × 3.

    Health Regen: |
      Health Regen (HR) determines how much HP you recover after each fight. If you have 4 Health left out of 10, and your Health Regen is 5, you will be left with 9 Health after the combat is finished.
      <b>Fill In:</b> Check your Race's page. Under Race Features, there's a box (WIP) for Health Regen. Calculate your Health Regen based on what it says in that box. This calculation is always a flat number (different for each Race), plus your Sense × 2.

    Movement Speed: |
      When you use 1 Action Point to move (out of the 3 you have per Turn), you can move a number of meters, determined by your Movement Speed. If you have 5 Movement Speed and decide to spend 1 Action Point to move, you can move up to 5 meters.
      <b>Fill In:</b> Your Movement Speed is 4, plus 0.5 for each Dexterity you have, but the result is always rounded down. For example, if your Dexterity is 1, then your Movement Speed is 4.5 meters. Therefore, you can move 4 meters.

    Initiative: |
      On your first Turn each Combat, you gain extra Action Points based on your Initiative! The higher your Initiative, the more explosive your Combats will be.
      <b>Fill In:</b> 0.5 for each Charisma you have. For example, if you have 2 Charisma, your Initiative is 1, and you get 1 extra Action Point at the start of each Combat. Therefore, you will start Combats with 4 Action points instead of 3! Note that fractions (e.g. 1.5) are rounded down. So even if your Initiative is 1.5, you still only get +1 Action Point (no such thing as half-action points).
    
    Done!: |
      That was the hard math part! Next, let's continue with something easier and with more freedom.

  Languages and Other:
    Text: The number of languages your Hero knows is based on Intelligence, but each Race may give you different base languages. Check your Race's <i>Languages</i> section, at Race Features. By default, everybody speaks <i>Common</i> (English). No 2 stories and adventures are the same, therefore there isn't a set-in-stone set of languages to pick from. This is where you should ask your Quest Master what languages are present in your story. Perhaps there is no Elvish, or goblins speak Italian. Decide on your langauges together with your Quest Master.

  Abilities:
    Text: |
      You are now about to get your first Abilities! An Ability is a power, which can be either active (requiring manual activation) or passive (always there in the background, or one-time-use). From this point on, almost everything in the game is an Ability: spells, weapons, armor, Talents, Feats, and act as the powers your Hero has.
      You can recognize an Ability by seeing that it looks like a playing card (in the book). On the website, an Ability looks like a box with a little icon on the left, and text down below.
      Each Ability clearly displays what it does, and has a set of <i>tags</i> that tell your how many Action Points it uses (if any), its duration, its cost, any specific requirements, etc. (TODO: add icons here and example)
    
    Organizing Abilities: |
      It's difficult to manually write by hand all your Abilities, so there are several tools to organize your Abilities, most of them online. Pick one of the following options to track your Abilities. We recommend the first option with the printed cards.

      <b>Printed Cards</b>: Make a list of all your Abilities that you get (just the names). When you finish creating your Hero, go to the website at Game, Abilities, and click on Print Abilities (WIP). Then input by name all Abilities you have and the website will give you some A4 (or letterbox WIP) paper images that you can download, print, and cut. You will always have these Ability cards at hand.

      <b>Online Tracker</b>: Make a list of all your Abilities that you get (just the names). Login on the website, then go to Game, Abilities, and click on Ability Sheet Maker (WIP). Add all your Abilities there, input the name of your Hero and hit save. From now on, you can go to that page and always see all Abilities you have.

      <b>Character Creator</b>: If you opted to use the Character Creator on the website, things are much easier. You can simply hit <i>Select</i> on Abilities as you come accross them, and they will appear under the My Character tab, at the bottom of the page (scroll down).

      <b>Write By Hand</b>: If you prefer the old-school way of doing things, you can simply write the Abilities down on a sheet of paper, use a spreadsheer, or a Word document, etc. It's all up to you!
    
  Race Abilities:
    Text: On your Race's page, check the Starting Abilities section (WIP). Each Race gives you some Abilities that you start with. For example, the easiest ones are probably for the Dwarf. Dwarves only get 1 Starting Ability called Stouthearten. Merely having this Ability allows your Character to wear 2 sets of armor simultaneously! Write that down on your Character Sheet, on the bottom-right (WIP).
  
  Race Talent Abilities:
    Text: |
      Here is where your Hero becomes different from other Heroes of the same Race. Each Race gets to pick 2 different Abilities from the Race Talents (WIP) section. Read them carefully, see what you like, and write them to your Abilities. When you're done, come back to this page and we will get started with the Class!
  
  That's All:
    Text: That's all for the Race! But the real skillset of your Hero comes from your Class, which will determine your fighting capabilities and your approach to encounters!

Class:
  Text: |
    Your Class is what gives life to your Hero, it is what makes it unique and what influences your play style the most. It is akin to your job: a Warrior is a master of weapons and physical combat, a Rogue is a trickster with thieving skills and assassination expertise, a Wizard is the master of pyromancy, arcanism, and the elements. Feel free to choose whichever you think suits your playstyle better. There are tons of Classes available in QuestGuard in this book.
    If you haven't decided on a Class yet, take a look at them on the Class reference sheet and go by the gut feeling for your first Hero, though some of the Classes are easier to play than other. I recommend picking an easy Class that fits youts Hero fantasy.

  Class Abilities: |
    Your Class gives you access to two or three starting Abilities. These are the core of your Hero's fighting style. Take note of them, or, if you're using the Hero Creator online, they were already added to your Hero Sheet when you selected the Class. If you find anything confusing, each Ability has a more detailed explanation either in the subtext, or on the Class's page.

  Mana:
    Text: Many Classes in the game use a system of points called Mana Points. It is the main resource you will use for casting Spells and using Abilities. For instance, if you have 4 Mana points, and a Spell costs 1 Mana to use, you can cast it and you will be left with 3 Mana points. If you don't have enough Mana to use an Ability, you just can't use that Ability. Most Classes with Mana regenerate their Mana points to their Maximum at the end of an entire Adventure, so make good use of your Mana! It's scarce! We'll go through what an Adventure is later.

    My Class Doesn't Have Mana!: |
      Not all Classes use Mana. If your Class doesn't have Mana at all, then that's great! It's one less thing to be concerned about, and it means your Class makes up for it through more powerful Abilities.

    <aside>If You're a Warlock...</aside>:
      Things change slightly if you're a Warlock. As it says in one of your Starting Abilities, your Mana points regenerate after each Combat, so use them all when fighting!
    
    More About Mana: |
      Your Hero has a maximum number of Mana points depending on the Class. When you Level up, you might also gain +1 Max Mana. Other Abilities might give you more Max Mana.
      The amount of Mana an Ability costs is represented by the  _blue flame_ icon and the number near it. Each Ability specifies individually how much Mana it costs.
      You can keep track of your Mana by ticking the _magical circles_ on your paper Hero Sheet, or by using plastic tokens, or simply writing the number and erasing it. If you're using the Hero Creator online, there's a widget on your Hero Sheet to help you track your Mana.
  
  Talents:
    Text: |
      Talents are how you differentiate your Hero from any other Hero of the same Class. Talents are Abilities that come in the form of a choice: you may get to pick one out of a set of 2 to 6 possibilities.
      At Level 1, you usually get to pick from 2 or more (TODO) sets of Talents. All Classes get a <i>Level 1 Utility Talent</i> set and a <i>Level 1 Class Talent</i> set. This means that for each of these sets, pick one of the possible options. Add it to your Hero Sheet like you would any other Abilities you already have.
    Rule of Thumb: Whenever you see <b>Talent</b>, it means it's a single choice out of a <b>Talent set</b>.
    
    Level Up Talents: |
      At each Level from 2 to 10, you will get another set of Talents, from which you can pick 1.
    
    <aside>Can I Change Them?</aside>: |
      Yes! Inbetween Adventures, you can completely change all your Talent options! If you don't feel like you made the right choices, you can just choose again!

  Extra Talents (WIP):
    Text: |
      We previously established you can ony have <b>one</b> Talent per Talent set. That's not entirely true, and there's a reason we've kept the use of the Intellgience Stat mysterious until now...

      <b>You can get extra Talents equal to your Intelligence.</b>

      Aside from the 1 free Talent you get per set, you can have an <i>extra</i> number of Talents equal to your Intelligence. For example, at Level 1, if your Intelligence is 2, you can have <i>3 Utility Talents and 1 Class Talents</i> (1 free Utility Talent, 1 free Level 1 Class Talent, and 2 extra Utility Talents). Or you can have 2 Utility Talents and 2 Level 1 Class Talents. You're free to mix and match which Talents you get. At higher Levels, you can let go of extra Talents from lower levels for more powerful, higher Level Talents.
    
    <aside/>What is "Keystone"?</aside>: Some Talents have an orange glow and are listed as <i>Keystone</i>. As it says on every Keystone Talent, you can't have more than one Keystone Talent for that given Level. This is usually because those Talents are very powerful or contradict eachother.

    