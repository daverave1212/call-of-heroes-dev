Beginner Guide:

Transition Guide:

  What is QuestGuard?: |
    QuestGuard is a gamified tactical tabletop roleplaying game for the younger generation, who are more used to video games and board games, and want a fast, rules-light, and combat-focused alternative to the mainstream and older systems.

    While playing QuestGuard, you will find more “gamified” elements, both for the players and for the Quest Master. There is an emphasis on build variety, combos, rules to help Quest Masters have an easier time, and depth through interactions, not complexity.

    We created QuestGuard out of love for tabletop roleplaying, to fit our needs and, most importantly, to fit with how the current generation actually plays combat RPGs.

    If you’ve played Dungeons & Dragons or Pathfinder, you will find QuestGuard very easy to pick up!

  +Is This D&D-compatible?: |
    No, QuestGuard is its own game, completely separate from D&D and Pathfinder.

  +What To Expect?: |
    QuestGuard is systems-light - there are hardly any tables, no concentration rule, no spell components or spell slot levels, no roll to hit or opportunity attacks, no saves (checks) in combat (crowd control/status effect is direct and fair).
    There are no long or short rests, as the Quest Master has better control over the pacing through the ^Adventure^ and enemy ^Worthiness^ system.

    Character abilities are gamified for gameplay rather than realism, to be able to do things such as creating gold or magic items out of thin air or farming enemies. Characters can respec between Adventures, all monsters are tactical and change how you must approach combat, and this is the tip of the iceberg!
  
  +How Do I Start?: |
    You’re already in it!
    Our website https://questguardrpg.com features a “Play With Us!” button. Once clicked, it will redirect you to our Discord group, where we regularly host campaigns and one-shot adventures for new and old players alike!
    You can create a character, quickly and without hassle, using our Character Creator, going to Create Character in the website menu. It will take you through everything you need!

    Feel free to say hi and show your character!
  
  Why QuestGuard?:
    It's "Gamey" and It Flows: |
      Everything in QuestGuard is intended to have a good flow in combat, be simple and allow for awesome Ability combinations, kind of like a board game.

      The complexity and skill expression does not come from number crunching, but rather from how you choose to combo your character pieces together.

      Your character build flows and all game elements fit in such a way that they don’t hinder one-another. It’s clean.
    
      ~Deafening Silence~

      Figure out your own combos and unleash them upon your foes!

      ~Pyromancy~
      ~Burning Breath~

      Every class and build path is different and breaks the rules of the game!

      <Path of the Berserker>
      <Stouthearten>

      There are ^hundreds^ of such abilities in the game, and the possibilities are in the millions!

    Being a Quest Master is easy: |
      QuestGuard is made to be cool for players, and easy and fun for the Quest Master (the game master). Through rules such as the Adventure, Worthiness, Skills, Quirks, etc, you will find running Quest Guard both enjoyable and easy to manage.

    Always Online: |
      All the resources are always online. As such, there are frequent patches, balance improvements, content updates and much, much more!

  The Dice:
    Checks: |
      QuestGuard is a 2d6 system. Whenever you roll a Check (called non-Combat Rolls), you roll 2 6-sided dice and add any modifiers to it.

      Rolling evens (1-1, 2-2, 3-3, and so on) mean rolling with ^Events^. An Event is just something that happens, and depending on the roll amount, it may be pretty good or quite bad for you.
      Getting 0 or less on a Check would constitute a Critical Failure (through negative modifiers).
    
    Dice Used: |
      In QuestGuard, we use the standard polyhedral dice: d2, d4, d6, d8, d10, d12 and d20 (although the d20 is rarely used).
    
    Combat Dice: |
      In combat, there is no rolling to hit. Whenever you attack, you roll for Damage directly - most of the time, what you see is what you get. If you rolled a total of 14 on 3d6, you deal 14 Damage.

      By default, there are no critical strikes, but some weapons and Abilities can trigger bonus effects based on the rolls. If it can, it is neatly mentioned in its text box.

      <Bow>

      Most of the time, you will deal and take Damage. Be prepared!
  
  Characters:

    Character Sheet: |
      Like in most RPG’s, a Player Character needs a character sheet.
      You can find it on the website at https://questguardrpg.com under Game, at Downloads.

      There are several available, but we recommend you instead use the Character Creator tool, online. You can find it in the website menu, at Create Character.

    What makes a Character: |
      A Player Character is made up of a Race plus a Class. Each of these has a ton of customization options.

      Each Race is different and you can customize it with 2 Racial Talents! Every level, you get a choice of one out of 3 or more Talents to pick. Talents are powerful Abilities that shape how your Character plays and fights.

      Don’t be afraid to try strange combinations! Player Characters can freely <i>respec</i>, changing all Talent choices and learned Abilities.

    Progression: |
      There are 10 Levels Players can progress through with their Characters.

      Levels are packed with interesting options. Every Level unlocks new Abilities, and every Adventure ends with players getting Quirks!

      The recommended way to Level-Up is through milestones or checkpoint set by the Quest Master. If using the Experience system, however, going from Level 1 to Level 10 should not take an eternity, either. QuestGuard intends campaigns to play out spanning a few months at most, but it’s all up to you and your group.
    
    Stats: |
      There are 5 Main Stats in QuestGuard: Might, Dexterity, Intelligence, Sense and Charisma. The Stat is directly the “modifier”. In combat, each Stat affects an aspect of your character.

      <ul>
        <li>Might affects base Health (+3 per point).</li>
        <li>Dexterity affects Movement Speed (+1 per 2 points).</li>
        <li>Intelligence usually affects the availability of Abilities, non-combat Skills and other roleplaying aspects (+1 available Minor Talent per point).</li>
        <li>Sense affects Health Regen (+2 per point).</li>
        <li>Charisma affects Initiative (+3 per point), and you get +1 Action Point on your first Turn per 5 Initiative.</li>
      </ul>

      All Stats also contribute to roleplay for Checks.
      The calculations are explained in Character Creation.

    Starting Stats: |
      Everyone (usually) has the same stat numbers, ordered as you like: -1, 0, 1, 2, 3. Put these numbers however you like in your 5 Stats.

      Each way to distribute Stats is perfectly valid - there are builds and variations for any combination. QuestGuard is designed so that there is no objectively best way to do anything.

    Races & Stats: |
      Races don’t increase or decrease Stats, but instead, each Race imposes some restrictions on Stats.

    Skills & Substats: |
      There are no Skills listed on your Character Sheet. 

      When you want to do something, the Quest Master will, for example, simply call out for a <i>Might Roll</i> or a <i>Charisma Roll</i> (2d6).

      However, each Character will have non-combat Skills they can add themselves to the Roll if appropriate.
      Each Skill you have explicitly has a bonus (e.g. +3 in Persuasion, +1 in Monstrology, -2 in Control Emotions, etc).

      The Quest Master might call for a Charisma Roll to ask a quest giver for more reward money, and, if you have a bonus in Persuasion, you can say <i>“I have a +2 in Convincing, can I add it to the roll?”</i>, to which the Quest Master might say yes or no, depending on the situation.

      Let’s keep the Character Sheets clean!

      Feel free to invent your own Skills, but you can find a list of recommendations on the website. Don’t be too broad with them.

    Abilities: |
      Almost everything you get in this game is an <b>Ability</b>. Spells, attacks, moves, Feats, Talents, even weapons and armor!

      An Ability is simply a rectangle with a clearly defined text, a little colorful icon and tags to help you identify its properties, such as the costs of using it, how often you can use it, the range, etc.

      ~Rime Shackles~

      Most of the time, the only thing you need to use an Ability is your hands. No need for materials, a focus, spoken words, etc.
    
    +Nifty Website Trick…: |
      On the website, click on the little document icon on the bottom-right of an Ability to copy it to your clipboard. You can then paste it in a Word document, in Paint, Discord, etc.


  Combat:
    Text: |
      Combat usually happens on a map, preferably on a grid, and distances are measured in meters.

      Turn order is clockwise around the table, with monsters somewhere in-between players.

    Actions: |
      Each character or monster in combat has <b>3 Action Points</b>. You can use these Action Points as you like, with no diminishing returns (e.g. you can attack 3 times with a one-handed weapon even).
      Abilities that cost 0 Actions are free and can be done as many times as you like.

      Also, on your first Turn in Combat, you gain Action Points equal to your Initiative!

      ~Invigorate~

      There is no "Minor Action", "Bonus Action", etc.

      ~Flail~

    Combo: |
      Many Abilities and weapons “apply a Combo”.
      Many Abilities and weapons trigger an extra effect if the target had a Combo! Then the Combo is removed.

      Anyone can trigger anyone’s combo. Go make some combos with your team!

    Mana: |
      The resource used to cast more powerful Abilities is called Mana. Most Classes use Mana.

      You have a number of Mana Points you can use on Abilities.
      If you have 5 Mana Points and an Ability requires 2 Mana, you spend 2 Mana and use the Ability. Then, you are left with 3 Mana.

      Usually, Mana regenerates in the downtime between <i>Adventures</i>.
    
    Resting & regeneration: |
      There are no rests like short rests or long rests.

      You regenerate Health equal to your Health Regen after every Combat. Your Health Regen is defined by your Race and Sense.
      You regenerate all resources (Health, Mana, etc) at the end of every <i>Adventure</i>.

    Adventures: |
      An Adventure is a time period defined by the Quest Master. It could be a full dungeon, a play session, completing a quest, etc.

      An Adventure that makes will have you use everything in your will to survive you will typically contain 3 medium-difficulty combat.
  
  Important Concepts: 

    Turn Order: |
      Players may take Turns clockwise (or counter-clockwise) around the table.
      Monsters have a stat called Setback that tells them after how many players they can take their Turn.Turn order is, for now, not set in stone and prone to changes (WIP).

    Initiative: |
      Your Initiative tells you how many extra Action Points you get on your first Turn in Combat.
      Each point of Charisma increases your Initiative by 0.5. Thus, each 2 points in Charisma give you +1 Action Point on the first Turn each Combat.

      Monsters don’t have Initiative, but instead have Setback.
      A monster with a Setback of 1 will take its Turn after 1 player has taken their Turn. A monster with 2 Setback will take its Turn after 2 players have taken their Turn this Round. If a monster's Setback is greater than the number of players, it just takes its turn last.
      If its Setback is 0, it takes its turn before the players.

    Quirks: |
      At the end of every Adventure, each Player Character gets a Quirk, be it positive or negative, based on their performance. These can be phobias, extra Health from being healthy, etc.

      We’re still testing out Quirks, so the system is not entirely nailed down, but it works (WIP)!

    Balance: |
      The game is balanced mathematically with tables and calculations, so that you may pick any Class and Race combination and have no disadvantage over other players.

      Naturally, not everything is perfect, and balance is subject to change (WIP).

    Tools: |
      The website is full of useful tools, such as the Character Creator, Ability Sheet Maker, etc. Make sure you explore and use them!

    Premium Content: |
      There are menus and pages with a yellow crown icon.
      This represents Premium Content that will be available only via subscription or owning the book.

      However, all Premium Content is freely available right now! Enjoy! (WIP)
  
